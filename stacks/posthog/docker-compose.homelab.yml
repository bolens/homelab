# Homelab: join PostHog's Caddy proxy to the shared `monitor` network for central Caddy,
# and run the internal proxy without binding host ports or issuing its own ACME certs.
services:
  proxy:
    ports: []
    networks:
      - default
      - monitor
    environment:
      CADDY_TLS_BLOCK: ""
      CADDY_HOST: "http://:80"
    labels:
      - logging=true
      - logging_sampling=true
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "3"
