services:
  soulseek:
    image: slskd/slskd:latest@sha256:ecd4026d4f8fb504e2cc55323efa2c1f5b56d20d3686b018249cc36b48ea17a6
    container_name: soulseek
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    memswap_limit: 4g
    pids_limit: 512
    cpu_shares: 256
    labels:
      - logging=true
      - logging_sampling=true
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    volumes:
      - soulseek_app:/app
      - "${SLSKD_DOWNLOADS_PATH:-./data/downloads}:/downloads"
      - "${SLSKD_SHARED_MUSIC_PATH:-/mnt/unraid/media/music}:/music"
      - soulseek_incomplete:/incomplete
    networks:
      - media-automation
      - media-services
      - ingress-public
    ports:
      - "${SLSKD_SLSK_LISTEN_PORT:-50300}:${SLSKD_SLSK_LISTEN_PORT:-50300}"
      - "${SLSKD_SLSK_LISTEN_PORT:-50300}:${SLSKD_SLSK_LISTEN_PORT:-50300}/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5030/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  media-automation:
    name: media-automation
    external: true
  media-services:
    name: media-services
    external: true
  ingress-public:
    name: ingress-public
    external: true

volumes:
  soulseek_app:
  soulseek_incomplete:
