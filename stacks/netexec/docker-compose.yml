services:
  netexec:
    labels:
      logging: "true"
    build:
      context: .
    image: homelab/netexec:local
    profiles: ["tools"]
    cpus: 4.0
    mem_limit: 4g
    memswap_limit: 6g
    pids_limit: 1024
    cpu_shares: 256
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    volumes:
      - ${NETEXEC_WORKSPACE_PATH:-${HOME}/security-lab/netexec}:/workspace
    working_dir: /workspace
    command: ["--help"]
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "2"
