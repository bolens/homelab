# Compose reads `.env` (copy of stack.env from `./prepare-stack.sh`) for `${VAR}` substitution.
services:
  redis:
    image: docker.io/valkey/valkey:8-alpine
    container_name: searxng-redis
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    labels:
      - logging=true
      - logging_sampling=true
    volumes:
      - searxng_valkey_data:/data
    networks:
      - default
      - monitor
    env_file:
      - path: ../../shared.env
        required: false
    mem_limit: 256m
    cpus: "0.50"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    # No host port: access via Caddy (reverse proxy on monitor network)
    volumes:
      # Require explicit host path (set in stack.env; prepare copies stack.env -> .env for compose).
      - ${SEARXNG_SETTINGS_PATH:?Set SEARXNG_SETTINGS_PATH in stack.env (see stack.env.example)}:/etc/searxng/settings.yml:ro
      - searxng_data:/var/cache/searxng
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - default
      - monitor
    labels:
      - logging=true
      - logging_sampling=true
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    environment:
      # Host path in stack.env is only for the bind mount above; inside the container the file is here.
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-https://searx-ng.home/}
      - SEARXNG_REDIS_URL=redis://searxng-redis:6379/0
      - SEARXNG_SECRET=${SEARXNG_SECRET:-change-me-use-openssl-rand-hex-32}
    mem_limit: 1g
    cpus: "1.00"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5).status==200 else 1)",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  monitor:
    name: monitor
    external: true

volumes:
  searxng_valkey_data: {}
  searxng_data: {}
