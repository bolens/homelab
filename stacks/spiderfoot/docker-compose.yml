name: spiderfoot

services:
  spiderfoot:
    image: joshuapfritz/spiderfoot:latest@sha256:b7bf0e68d2d46a3976eeb2d9ce6a3d280dcc9d44417b37bbd2f739d2ea44ad9a
    container_name: spiderfoot
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    memswap_limit: 4g
    pids_limit: 512
    cpu_shares: 256
    env_file:
      - stack.env
    environment:
      - TZ=${TZ:-America/Denver}
    volumes:
      # Persistent scan data, config, API keys, etc.
      - spiderfoot-data:/data
    networks:
      - security-research
      - ingress-admin
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s = socket.create_connection(('127.0.0.1', 5001), 2); s.close()"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

networks:
  security-research:
    name: security-research
    external: true
  ingress-admin:
    name: ingress-admin
    external: true

volumes:
  spiderfoot-data:
