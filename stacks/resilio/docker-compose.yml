services:
  resilio:
    image: lscr.io/linuxserver/resilio-sync:latest
    container_name: resilio
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 256
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    volumes:
      - resilio_config:/config
      - type: bind
        source: ${RESILIO_DOWNLOADS_PATH:-/mnt/unraid/media/downloads/resilio}
        target: /downloads
        bind:
          create_host_path: false
      - resilio_sync:/sync
    ports:
      - "55555:55555"
    networks:
      - proxy-ingress
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8888/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  proxy-ingress:
    name: proxy-ingress
    external: true

volumes:
  resilio_config:
    external: true
    name: resilio_config
  resilio_sync:
    external: true
    name: resilio_sync
