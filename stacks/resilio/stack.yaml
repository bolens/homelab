name: resilio
default_port: 8888
databases: []
health:
  endpoint: /
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: storage
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: resilio.yourdomain.com
data_profile:
  contains_pii: true
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://www.resilio.com/individuals/
  docs: https://docs.linuxserver.io/images/docker-resilio-sync/
  repo: https://github.com/linuxserver/docker-resilio-sync
backup:
  priority: medium
  schedule_hint: daily
volumes:
- name: resilio_config
  role: config
  critical: true
- name: /mnt/unraid/media/downloads/resilio
  role: media
  critical: false
- name: resilio_sync
  role: media
  critical: false
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: medium
  memory_profile: medium
  storage_profile: large
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
runtime_security:
  privileged_services: []
  host_network_services: []
  docker_socket_services: []
  floating_image_services: []
