services:
  postgres:
    image: postgres:18-alpine
    container_name: outline-postgres
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 384
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    environment:
      PGDATA: /var/lib/postgresql/data
    volumes:
      - outline_pg18_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 10s
      retries: 10

  redis:
    image: redis:alpine
    container_name: outline-redis
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 256
    cpu_shares: 256
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  outline:
    image: outlinewiki/outline:latest
    container_name: outline
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 256
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    volumes:
      - outline_data:/var/lib/outline
    networks:
      - default
      - ingress-sensitive
      - mail-clients

networks:
  ingress-sensitive:
    name: ingress-sensitive
    external: true
  mail-clients:
    name: mail-clients
    external: true

volumes:
  outline_pg18_data:
  outline_data:
