# Paperless-ngx with PostgreSQL. See https://docs.paperless-ngx.com/setup/
# Portainer-friendly: named volumes, private backend network, and proxy-only ingress.
services:
  broker:
    labels:
      logging: "true"
    image: docker.io/library/redis:8
    container_name: paperless-ngx-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - default

  db:
    labels:
      logging: "true"
    image: docker.io/library/postgres:18
    container_name: paperless-ngx-db
    restart: unless-stopped
    env_file:
      - stack.env
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paperless} -d ${POSTGRES_DB:-paperless}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  webserver:
    labels:
      logging: "true"
    image: ghcr.io/paperless-ngx/paperless-ngx:latest@sha256:65a4cabf0169ea7fbd90ab7bb28ba3f8b5909613635acda1a03ad606f34b456b
    container_name: paperless-ngx
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    # No host port: access via Caddy on ingress-sensitive.
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - export:/usr/src/paperless/export
      - consume:/usr/src/paperless/consume
    networks:
      - default
      - document-services
      - ingress-sensitive
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  default:
    driver: bridge
  document-services:
    name: document-services
    external: true
  ingress-sensitive:
    name: ingress-sensitive
    external: true

volumes:
  redisdata:
  pgdata:
  data:
  media:
  export:
  consume:
