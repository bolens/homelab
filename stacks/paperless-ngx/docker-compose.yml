# Paperless-ngx with PostgreSQL. See https://docs.paperless-ngx.com/setup/
# Portainer-friendly: named volumes for export/consume, env vars from stack.env, external monitor network.
services:
  broker:
    image: docker.io/library/redis:8
    container_name: paperless-ngx-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - default

  db:
    image: docker.io/library/postgres:18
    container_name: paperless-ngx-db
    restart: unless-stopped
    env_file:
      - stack.env
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paperless} -d ${POSTGRES_DB:-paperless}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-ngx
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    # No host port: access via Caddy (reverse proxy on monitor network)
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - export:/usr/src/paperless/export
      - consume:/usr/src/paperless/consume
    networks:
      - default
      - monitor
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  default:
    driver: bridge
  monitor:
    name: monitor
    external: true

volumes:
  redisdata:
  pgdata:
  data:
  media:
  export:
  consume:
