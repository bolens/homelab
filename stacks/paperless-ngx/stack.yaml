name: paperless-ngx
default_port: 8000
databases:
- postgres
- redis
health:
  endpoint: /
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: documents
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: paperless-ngx.yourdomain.com
data_profile:
  contains_pii: false
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://docs.paperless-ngx.com
  docs: https://docs.paperless-ngx.com
  repo: https://github.com/paperless-ngx/paperless-ngx
backup:
  priority: high
  schedule_hint: weekly
volumes:
- name: redisdata
  role: app_data
  critical: true
- name: pgdata
  role: app_data
  critical: true
- name: data
  role: app_data
  critical: true
- name: media
  role: app_data
  critical: true
- name: export
  role: app_data
  critical: true
- name: consume
  role: app_data
  critical: true
auth:
  mode: builtin
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: medium
  memory_profile: medium
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
