services:
  alloy-docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    container_name: alloy-docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      NETWORKS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    # Alloy's Docker API polling makes the proxy emit high-volume access logs.
    # Collecting those logs creates useless self-generated pipeline load.
    labels:
      logging: "false"
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  alloy:
    image: grafana/alloy:latest@sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308
    container_name: grafana-alloy
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    env_file:
      - stack.env
    volumes:
      - alloy_data:/var/lib/alloy
      - ${ALLOY_CONFIG_PATH}:/etc/alloy/config.alloy:ro
    depends_on:
      alloy-docker-socket-proxy:
        condition: service_healthy
    networks:
      - docker-api
      - telemetry
    labels:
      logging: "true"
      logging_sampling: "false"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
          pids: 256
    memswap_limit: 1g
    cpu_shares: 256
    healthcheck:
      test: ["CMD-SHELL", "/bin/alloy --version >/dev/null 2>&1 && kill -0 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  alloy-log-canary:
    image: busybox:1.38
    container_name: alloy-log-canary
    restart: unless-stopped
    command:
      - sh
      - -c
      - 'while true; do echo "alloy_pipeline_canary timestamp=$$(date -u +%FT%TZ)"; sleep "$${CANARY_INTERVAL_SECONDS:-60}"; done'
    env_file:
      - stack.env
    networks:
      - telemetry
    labels:
      logging: "true"
      logging_sampling: "true"
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 32M
          pids: 32
    memswap_limit: 64m
    cpu_shares: 64
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  docker-api:
    internal: true
  telemetry:
    name: telemetry
    external: true

volumes:
  alloy_data:
