services:
  alloy:
    image: grafana/alloy:latest
    container_name: grafana-alloy
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    env_file:
      - stack.env
    volumes:
      - alloy_data:/var/lib/alloy
      - ${ALLOY_CONFIG_PATH}:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitor
    labels:
      logging: "true"
      logging_sampling: "false"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
          pids: 256
    memswap_limit: 1g
    cpu_shares: 256
    healthcheck:
      test: ["CMD-SHELL", "/bin/alloy --version >/dev/null 2>&1 && kill -0 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  alloy-log-canary:
    image: busybox:1.38
    container_name: alloy-log-canary
    restart: unless-stopped
    command:
      - sh
      - -c
      - 'while true; do echo "alloy_pipeline_canary timestamp=$$(date -u +%FT%TZ)"; sleep "$${CANARY_INTERVAL_SECONDS:-60}"; done'
    env_file:
      - stack.env
    networks:
      - monitor
    labels:
      logging: "true"
      logging_sampling: "true"
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 32M
          pids: 32
    memswap_limit: 64m
    cpu_shares: 64
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  monitor:
    name: monitor
    external: true

volumes:
  alloy_data:
