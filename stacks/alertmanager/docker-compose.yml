# Config: copy alertmanager.yml.example to ~/.config/alertmanager/alertmanager.yml
# (create the directory if needed). Override path with ALERTMANAGER_CONFIG_PATH if desired.
services:
  alertmanager:
    labels:
      logging: "true"
    image: prom/alertmanager:latest@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
    container_name: alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - alertmanager_data:/alertmanager
      - ${ALERTMANAGER_CONFIG_PATH:-${HOME}/.config/alertmanager/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - ${ALERTMANAGER_TEMPLATES_PATH:-${HOME}/.config/alertmanager/templates}:/etc/alertmanager/templates:ro
    networks:
      - telemetry
      - ingress-admin
      - mail-clients
    cpu_shares: 128
    memswap_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
          pids: 256
    env_file:
      - stack.env
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  telemetry:
    name: telemetry
    external: true
  ingress-admin:
    name: ingress-admin
    external: true
  mail-clients:
    name: mail-clients
    external: true

volumes:
  alertmanager_data: {}
