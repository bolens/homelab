name: alertmanager
default_port: 9093
databases: []
health:
  endpoint: /-/healthy
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: monitoring
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: alertmanager.yourdomain.com
data_profile:
  contains_pii: false
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://prometheus.io/docs/alerting/latest/alertmanager/
  docs: https://prometheus.io/docs/alerting/latest/overview/
  repo: https://github.com/prometheus/alertmanager
backup:
  priority: medium
  schedule_hint: weekly
volumes:
- name: alertmanager_data
  role: app_data
  critical: true
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: small
  memory_profile: small
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: monitoring
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
runtime_security:
  privileged_services: []
  host_network_services: []
  docker_socket_services: []
  floating_image_services: []
