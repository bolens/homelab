# Secrets and DB URLs live only in stack.env (env_file). Compose does not
# interpolate them from the host, so `docker compose up -d` is enough.

services:
  postgres:
    image: postgres:16-alpine
    container_name: woodpecker-postgres
    restart: unless-stopped
    env_file:
      - stack.env
    volumes:
      - woodpecker_pg_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 10s
      retries: 10

  server:
    image: woodpeckerci/woodpecker-server:v3
    container_name: woodpecker-server
    restart: unless-stopped
    env_file:
      - stack.env
    # Non-secret defaults (override stack.env). This stack targets Gitea; without
    # this, v3 exits with "forge not configured" if stack.env omits WOODPECKER_GITEA.
    environment:
      WOODPECKER_GITEA: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - monitor

  agent:
    image: woodpeckerci/woodpecker-agent:v3
    container_name: woodpecker-agent
    restart: unless-stopped
    env_file:
      - stack.env
    depends_on:
      server:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default

networks:
  monitor:
    name: monitor
    external: true

volumes:
  woodpecker_pg_data:
