# Secrets and DB URLs live only in stack.env (env_file). Compose does not
# interpolate them from the host, so `docker compose up -d` is enough.

services:
  postgres:
    labels:
      logging: "true"
    image: postgres:18-alpine
    container_name: woodpecker-postgres
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 384
    env_file:
      - stack.env
    environment:
      PGDATA: /var/lib/postgresql/data
    volumes:
      - woodpecker_pg18_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 10s
      retries: 10

  server:
    labels:
      logging: "true"
    image: woodpeckerci/woodpecker-server:v3
    container_name: woodpecker-server
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 384
    env_file:
      - stack.env
    # Non-secret defaults (override stack.env). This stack targets Gitea; without
    # this, v3 exits with "forge not configured" if stack.env omits WOODPECKER_GITEA.
    environment:
      WOODPECKER_GITEA: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - ingress-admin

  agent:
    labels:
      logging: "true"
    image: woodpeckerci/woodpecker-agent:v3
    container_name: woodpecker-agent
    restart: unless-stopped
    cpus: 4.0
    mem_limit: 6g
    memswap_limit: 8g
    pids_limit: 1024
    cpu_shares: 512
    env_file:
      - stack.env
    depends_on:
      server:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default

networks:
  ingress-admin:
    name: ingress-admin
    external: true

volumes:
  woodpecker_pg18_data:
