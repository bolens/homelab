# Secrets and DB URLs live only in stack.env (env_file). Compose does not
# interpolate them from the host, so `docker compose up -d` is enough.

services:
  postgres:
    labels:
      logging: "true"
    image: postgres:18-alpine
    container_name: woodpecker-postgres
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 384
    env_file:
      - stack.env
    environment:
      PGDATA: /var/lib/postgresql/data
    volumes:
      - woodpecker_pg18_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 10s
      retries: 10

  server:
    labels:
      logging: "true"
    image: woodpeckerci/woodpecker-server:v3
    container_name: woodpecker-server
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 384
    env_file:
      - stack.env
    # Non-secret defaults (override stack.env). This stack targets Gitea; without
    # this, v3 exits with "forge not configured" if stack.env omits WOODPECKER_GITEA.
    environment:
      WOODPECKER_GITEA: "true"
      # Minutes. Repository defaults do not retroactively update existing repos.
      WOODPECKER_DEFAULT_PIPELINE_TIMEOUT: "30"
      WOODPECKER_MAX_PIPELINE_TIMEOUT: "60"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - ingress-admin

  agent:
    labels:
      logging: "true"
    image: woodpeckerci/woodpecker-agent:v3
    container_name: woodpecker-agent
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    cpu_shares: 128
    env_file:
      - stack.env
    # Builds are sibling containers: agent limits alone do not constrain them.
    # Explicit policy overrides stale/unbounded values in an existing stack.env.
    environment:
      WOODPECKER_BACKEND: docker
      WOODPECKER_MAX_WORKFLOWS: "1"
      WOODPECKER_BACKEND_DOCKER_LIMIT_CPU_QUOTA: "200000"
      WOODPECKER_BACKEND_DOCKER_LIMIT_CPU_SHARES: "128"
      WOODPECKER_BACKEND_DOCKER_LIMIT_MEM: "4294967296"
      # Docker interprets MemorySwap as RAM + swap; equality disables swap.
      WOODPECKER_BACKEND_DOCKER_LIMIT_MEM_SWAP: "4294967296"
      WOODPECKER_BACKEND_DOCKER_LIMIT_SHM_SIZE: "67108864"
    depends_on:
      server:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default

networks:
  ingress-admin:
    name: ingress-admin
    external: true

volumes:
  woodpecker_pg18_data:
