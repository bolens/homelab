<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Clark browser — stealth Chromium, shield/browser icon -->
  <circle cx="50" cy="50" r="48" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
  <!-- Chromium-style concentric circles -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="50" cy="50" r="18" fill="none" stroke="#38bdf8" stroke-width="4"/>
  <!-- Spokes -->
  <line x1="50" y1="18" x2="50" y2="2" stroke="#38bdf8" stroke-width="4"/>
  <line x1="50" y1="82" x2="50" y2="98" stroke="#38bdf8" stroke-width="4"/>
  <line x1="18" y1="50" x2="2" y2="50" stroke="#38bdf8" stroke-width="4"/>
  <line x1="82" y1="50" x2="98" y2="50" stroke="#38bdf8" stroke-width="4"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="6" fill="#38bdf8"/>
</svg>
