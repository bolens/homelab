name: paperless-gpt
default_port: 8080
databases: []
health:
  endpoint: /
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: ai
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: paperless-gpt.yourdomain.com
data_profile:
  contains_pii: false
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: null
  docs: null
  repo: null
backup:
  priority: high
  schedule_hint: weekly
volumes:
- name: paperless-gpt_paperless_gpt_prompts
  role: app_data
  critical: true
  external: true
- name: paperless-gpt_paperless_gpt_hocr
  role: app_data
  critical: true
  external: true
- name: paperless-gpt_paperless_gpt_pdf
  role: app_data
  critical: true
  external: true
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: small
  memory_profile: small
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: ai
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
