services:
  dbgate:
    labels:
      logging: "true"
    image: dbgate/dbgate:latest@sha256:232dd7cb37706ef96bc41aae9ac8564cde2ebe4dc63ea72f70ebeb47383ee450
    container_name: dbgate
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 256
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    volumes:
      - dbgate_data:/root/.dbgate
    networks:
      - ingress-admin
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  ingress-admin:
    name: ingress-admin
    external: true

volumes:
  dbgate_data:
