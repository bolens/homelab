services:
  dbgate:
    image: dbgate/dbgate:latest
    container_name: dbgate
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 256
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    volumes:
      - dbgate_data:/root/.dbgate
    networks:
      - monitor
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  monitor:
    name: monitor
    external: true

volumes:
  dbgate_data:
