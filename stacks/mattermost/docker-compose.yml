services:
  mattermost-db:
    image: postgres:18-alpine
    container_name: mattermost-db
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=false
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - stack.env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-mattermost}
      - POSTGRES_USER=${POSTGRES_USER:-mmuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - mattermost_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mmuser} -d ${POSTGRES_DB:-mattermost}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mattermost:
    image: mattermost/mattermost-team-edition:latest
    container_name: mattermost
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=false
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    environment:
      - MM_SQLSETTINGS_DRIVERNAME=postgres
      - MM_SQLSETTINGS_DATASOURCE=postgres://${POSTGRES_USER:-mmuser}:${POSTGRES_PASSWORD}@mattermost-db:5432/${POSTGRES_DB:-mattermost}?sslmode=disable&connect_timeout=10
      - MM_SERVICESETTINGS_SITEURL=${MM_SERVICESETTINGS_SITEURL}
      - MM_BLEVESETTINGS_INDEXDIR=/mattermost/bleve-indexes
    volumes:
      - mattermost_config:/mattermost/config
      - mattermost_data:/mattermost/data
      - mattermost_logs:/mattermost/logs
      - mattermost_plugins:/mattermost/plugins
      - mattermost_client_plugins:/mattermost/client/plugins
      - mattermost_bleve_indexes:/mattermost/bleve-indexes
    depends_on:
      mattermost-db:
        condition: service_healthy
    networks:
      - default
      - monitor
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8065/api/v4/system/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  monitor:
    name: monitor
    external: true

volumes:
  mattermost_db_data: {}
  mattermost_config: {}
  mattermost_data: {}
  mattermost_logs: {}
  mattermost_plugins: {}
  mattermost_client_plugins: {}
  mattermost_bleve_indexes: {}
