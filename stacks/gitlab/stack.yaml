name: gitlab
default_port: 80
databases: []
health:
  endpoint: /-/health
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: dev
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: gitlab.yourdomain.com
data_profile:
  contains_pii: true
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://about.gitlab.com
  docs: https://docs.gitlab.com/ee/install/docker.html
  repo: https://github.com/gitlabhq/gitlabhq
backup:
  priority: critical
  schedule_hint: daily
volumes:
  - name: gitlab_config
    role: config
    critical: true
  - name: gitlab_data
    role: app_data
    critical: true
  - name: gitlab_logs
    role: logs
    critical: false
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: large
  memory_profile: large
  storage_profile: large
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
