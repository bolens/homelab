name: rutorrent
default_port: 80
databases: []
health:
  endpoint: /
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources:
- ingress-admin
- torrents
type: web_app
category: downloads
exposure:
  behind_caddy: false
  public_by_default: false
  recommended_hostname: null
data_profile:
  contains_pii: false
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: null
  docs: null
  repo: null
backup:
  priority: medium
  schedule_hint: weekly
volumes:
- name: rutorrent_config
  role: app_data
  critical: true
- name: torrents_manual
  role: app_data
  critical: true
  external: true
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: small
  memory_profile: small
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: null
  notes: 'ruTorrent frontend option; use rtorrent for a standalone daemon or flood for the Flood UI.'
