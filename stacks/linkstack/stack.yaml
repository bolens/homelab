name: linkstack
default_port: 80
databases: []
health:
  endpoint: /
  internal_only: true
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: productivity
exposure:
  behind_caddy: false
  public_by_default: false
  recommended_hostname: linkstack.yourdomain.com
data_profile:
  contains_pii: false
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://linkstack.org
  docs: https://docs.linkstack.org
  repo: https://github.com/linkstackorg/linkstack
backup:
  priority: medium
  schedule_hint: weekly
volumes:
- name: linkstack-data
  role: app_data
  critical: true
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: small
  memory_profile: small
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
runtime_security:
  privileged_services: []
  host_network_services: []
  docker_socket_services: []
  floating_image_services: []
