# LinkStack – self-hosted link-in-bio / Linktree-style page.
# No host ports: access via Caddy (reverse proxy to linkstack:80).
# Docs: https://docs.linkstack.org/docker/setup
services:
  linkstack:
    labels:
      logging: "true"
    image: linkstackorg/linkstack:latest@sha256:1c8b05399ee459ac601bac3eede7fbe765d1b6b7be725663b57f3220610958bf
    container_name: linkstack
    restart: unless-stopped
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    volumes:
      - linkstack-data:/htdocs
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  default:
    name: ingress-public
    external: true

volumes:
  linkstack-data:
