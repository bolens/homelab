services:
  backrest:
    image: ghcr.io/garethgeorge/backrest:v1.14.1@sha256:b852979754281026230cc69fb11428e6d57c9a97784ab4a444ffc7934c53a215
    container_name: backrest
    restart: unless-stopped
    env_file:
    - stack.env
    labels:
      logging: 'true'
    volumes:
    - backrest_data:/data
    - backrest_config:/config
    - backrest_cache:/cache
    - backrest_restore:/restore
    tmpfs:
    - /tmp
    networks:
    - ingress-sensitive
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:9898/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 1g
    cpus: '1.00'
    pids_limit: 512
networks:
  ingress-sensitive:
    name: ingress-sensitive
    external: true
volumes:
  backrest_data: {}
  backrest_config: {}
  backrest_cache: {}
  backrest_restore: {}
