name: backrest
default_port: 9898
databases:
- sqlite
health:
  endpoint: /
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: backup
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: backrest.example.com
data_profile:
  contains_pii: true
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://garethgeorge.github.io/backrest/
  docs: https://garethgeorge.github.io/backrest/
  repo: https://github.com/garethgeorge/backrest
backup:
  priority: high
  schedule_hint: weekly
volumes:
- name: backrest_data
  role: app_data
  critical: true
- name: backrest_config
  role: app_data
  critical: true
- name: backrest_cache
  role: app_data
  critical: true
- name: backrest_restore
  role: app_data
  critical: true
auth:
  mode: app_local
  sso_provider: null
  access_policy: app_auth
resources:
  cpu_profile: small
  memory_profile: medium
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
runtime_security:
  privileged_services: []
  host_network_services: []
  docker_socket_services: []
  floating_image_services: []
