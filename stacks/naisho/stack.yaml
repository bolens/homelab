name: naisho
default_port: 3000
databases: []
health:
  endpoint: /up
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: productivity
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: naisho.yourdomain.com
data_profile:
  contains_pii: true
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://naisho.app
  docs: https://github.com/nshki/naisho#readme
  repo: https://github.com/nshki/naisho
backup:
  priority: high
  schedule_hint: weekly
volumes:
- name: naisho-data
  role: app_data
  critical: true
auth:
  mode: builtin
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: large
  memory_profile: large
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
