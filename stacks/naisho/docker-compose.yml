# Naisho – send personal data deletion request emails to data brokers via SMTP.
# No host ports: access via Caddy (reverse proxy to naisho:3000).
# Builds from GitHub; image exposes 3000. Docs: https://github.com/nshki/naisho
#
# First run: entrypoint runs db:prepare and Company.sync_all automatically.

name: naisho

services:
  naisho:
    build:
      context: https://github.com/nshki/naisho.git#3611214b70cef8ee00a5f7166f4e1d4703a9fb26
      dockerfile: Dockerfile
    image: naisho:latest
    container_name: naisho
    restart: unless-stopped
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    environment:
      # Hardcoded: Rails runtime constants (not user-configurable)
      - RAILS_ENV=production
      - DATABASE_URL=sqlite3:///data/production.sqlite3
    volumes:
      - naisho-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ingress-public
      - mail-clients

networks:
  ingress-public:
    name: ingress-public
    external: true
  mail-clients:
    name: mail-clients
    external: true

volumes:
  naisho-data:
