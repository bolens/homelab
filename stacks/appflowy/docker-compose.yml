services:
  appflowy:
    image: appflowyinc/appflowy_cloud:latest@sha256:de5e3e1eaaa7482c85cfce6adeb9e8e2a7f41b65c1e7301d5ce06d33b6c80b1e
    container_name: appflowy
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=false
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    networks:
      - ingress-public

networks:
  ingress-public:
    name: ingress-public
    external: true
