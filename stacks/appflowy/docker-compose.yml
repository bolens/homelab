services:
  appflowy:
    image: appflowyinc/appflowy_cloud:latest@sha256:c21a0465250ea784b978922a29ec9cae5932540eb9c4ea6b5dc649c970804879
    container_name: appflowy
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=false
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    networks:
      - ingress-public

networks:
  ingress-public:
    name: ingress-public
    external: true
