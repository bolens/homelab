services:
  appflowy:
    image: appflowyinc/appflowy_cloud:latest@sha256:bb81616541813e8a17565bf1509ea1681c682d7fc3dfb10660a0921770adfded
    container_name: appflowy
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=false
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    networks:
      - ingress-public

networks:
  ingress-public:
    name: ingress-public
    external: true
