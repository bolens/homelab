services:
  komodo-mongo:
    image: mongo:8@sha256:e16e606f792ea89d2b4907b54e5e31eb86a7a23e27231dce3a982cc8f2d73cd2
    container_name: komodo-mongo
    restart: unless-stopped
    command:
    - --quiet
    - --wiredTigerCacheSizeGB
    - '0.25'
    labels:
      komodo.skip: ''
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DATABASE_USERNAME:-komodo}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DATABASE_PASSWORD:?set database password}
    volumes:
    - komodo_mongo:/data/db
    - komodo_mongo_config:/data/configdb
    networks:
    - default
    healthcheck:
      test:
      - CMD
      - mongosh
      - --quiet
      - --eval
      - 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 1g
    cpus: '1.00'
    pids_limit: 512
  komodo-core:
    image: ghcr.io/moghtech/komodo-core:2.3.4@sha256:91b2afd7b3bb2abea0ebd3046d65ec457eb1f3d505868d1d60cb0f8562490ef9
    container_name: komodo-core
    init: true
    restart: unless-stopped
    labels:
      komodo.skip: ''
      logging: 'true'
    env_file:
    - stack.env
    depends_on:
      komodo-mongo:
        condition: service_healthy
    volumes:
    - komodo_keys:/config/keys
    - komodo_backups:/backups
    networks:
    - default
    - ingress-admin
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:9120/version
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 512m
    cpus: '1.00'
    pids_limit: 512
  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.4@sha256:fb4b52961fcce7a31e3776930e422967b6640f653de876f59f26dea243e29beb
    container_name: komodo-periphery
    init: true
    restart: unless-stopped
    labels:
      komodo.skip: ''
      logging: 'true'
    env_file:
    - stack.env
    depends_on:
      komodo-core:
        condition: service_healthy
    volumes:
    - komodo_keys:/config/keys
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - type: bind
      source: ${PERIPHERY_ROOT_DIRECTORY:?set an application-local management root}
      target: ${PERIPHERY_ROOT_DIRECTORY:?set an application-local management root}
      bind:
        create_host_path: false
    networks:
    - default
    mem_limit: 512m
    cpus: '1.00'
    pids_limit: 512
networks:
  default: {}
  ingress-admin:
    name: ingress-admin
    external: true
volumes:
  komodo_mongo: {}
  komodo_mongo_config: {}
  komodo_keys: {}
  komodo_backups: {}
