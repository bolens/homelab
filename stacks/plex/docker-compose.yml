services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    cpus: 6.0
    mem_limit: 8g
    memswap_limit: 10g
    pids_limit: 1024
    cpu_shares: 384
    env_file:
      - stack.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Denver}
    volumes:
      - plex_config:/config
      - plex_transcode:/transcode
      - "${PLEX_TV_PATH:-/mnt/unraid/media/tv}:/data/tv"
      - "${PLEX_MOVIES_PATH:-/mnt/unraid/media/movies}:/data/movies"
      - "${PLEX_MUSIC_PATH:-/mnt/unraid/media/music}:/data/music"
    # Plex native Remote Access requires a direct TCP path. Keep the web UI
    # available through Caddy, but do not relay media through Cloudflare.
    ports:
      - "${PLEX_REMOTE_PORT:-32400}:32400/tcp"
    networks:
      - monitor
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:32400/identity"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  monitor:
    name: monitor
    external: true

volumes:
  plex_config:
  plex_transcode:
