services:
  plex:
    image: lscr.io/linuxserver/plex:latest@sha256:d8b3417b9173bab8bb79b167119b6b69a85558f2127e7fa810a045654e3dbe7f
    container_name: plex
    restart: unless-stopped
    cpus: 6.0
    mem_limit: 8g
    memswap_limit: 10g
    pids_limit: 1024
    cpu_shares: 384
    env_file:
      - stack.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Denver}
    volumes:
      - plex_config:/config
      - plex_transcode:/transcode
      - ./config/10-fix-volume-ownership.sh:/custom-cont-init.d/10-fix-volume-ownership.sh:ro
      - "${PLEX_TV_PATH:-/mnt/unraid/media/tv}:/data/tv"
      - "${PLEX_MOVIES_PATH:-/mnt/unraid/media/movies}:/data/movies"
      - "${PLEX_MUSIC_PATH:-/mnt/unraid/media/music}:/data/music"
    # Plex native Remote Access requires a direct TCP path. Keep the web UI
    # available through Caddy, but do not relay media through Cloudflare.
    ports:
      - "${PLEX_REMOTE_PORT:-32400}:32400/tcp"
    networks:
      - media-services
      - ingress-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:32400/identity"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  media-services:
    name: media-services
    external: true
  ingress-public:
    name: ingress-public
    external: true

volumes:
  plex_config:
  plex_transcode:
