services:
  plex:
    labels:
      logging: "true"
    image: lscr.io/linuxserver/plex:latest@sha256:d8b3417b9173bab8bb79b167119b6b69a85558f2127e7fa810a045654e3dbe7f
    container_name: plex
    restart: unless-stopped
    cpus: 6.0
    mem_limit: 8g
    memswap_limit: 10g
    pids_limit: 1024
    cpu_shares: 384
    env_file:
      - stack.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Denver}
    # Plex needs the host's LAN interface for correct discovery and Remote
    # Access advertisement. Bridge mode makes Plex publish a container-only IP.
    network_mode: host
    volumes:
      - plex_config:/config
      - plex_transcode:/transcode
      - ./config/10-fix-volume-ownership.sh:/custom-cont-init.d/10-fix-volume-ownership.sh:ro
      - "${PLEX_TV_PATH:-/mnt/unraid/media/tv}:/data/tv"
      - "${PLEX_MOVIES_PATH:-/mnt/unraid/media/movies}:/data/movies"
      - "${PLEX_MUSIC_PATH:-/mnt/unraid/media/music}:/data/music"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:32400/identity"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  plex-network-proxy:
    labels:
      logging: "true"
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: plex-network-proxy
    restart: unless-stopped
    command: ["caddy", "reverse-proxy", "--from", ":32400", "--to", "host.docker.internal:32400"]
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 192m
    pids_limit: 128
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      ingress-public:
        aliases: [plex]
      media-services:
        aliases: [plex]
    depends_on:
      plex:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:32400/identity"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  media-services:
    name: media-services
    external: true
  ingress-public:
    name: ingress-public
    external: true

volumes:
  plex_config:
  plex_transcode:
