services:
  plex:
    labels:
      logging: "true"
    image: lscr.io/linuxserver/plex:latest@sha256:d6e045dac4ea2ccb94e0aa4441e02dbec9c9d306d650814eb33d20ad497a2107
    container_name: plex
    restart: unless-stopped
    cpus: 6.0
    mem_limit: 8g
    memswap_limit: 10g
    pids_limit: 1024
    cpu_shares: 384
    env_file:
      - stack.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Denver}
      - VERSION=${PLEX_VERSION:-latest}
    # Plex needs the host's LAN interface for correct discovery and Remote
    # Access advertisement. Bridge mode makes Plex publish a container-only IP.
    network_mode: host
    volumes:
      - plex_config:/config
      - plex_transcode:/transcode
      - ./config/10-fix-volume-ownership.sh:/custom-cont-init.d/10-fix-volume-ownership.sh:ro
      - "${PLEX_TV_PATH:-/mnt/unraid/media/tv}:/data/tv"
      - "${PLEX_MOVIES_PATH:-/mnt/unraid/media/movies}:/data/movies"
      - "${PLEX_MUSIC_PATH:-/mnt/unraid/media/music}:/data/music"
      - "${PLEX_AUDIOBOOKS_PATH:-/mnt/unraid/media/audiobooks}:/data/audiobooks:ro"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:32400/identity"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  plex-network-proxy:
    labels:
      logging: "true"
    image: caddy:2.11.8-alpine@sha256:f6228111e5fafa1a5238258d0858e103f10599b8d1659a146e7726681a002bb9
    container_name: plex-network-proxy
    restart: unless-stopped
    command: ["caddy", "reverse-proxy", "--from", ":32400", "--to", "host.docker.internal:32400"]
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 192m
    pids_limit: 128
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      ingress-public:
        aliases: [plex]
      media-services:
        aliases: [plex]
    depends_on:
      plex:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:32400/identity"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  media-services:
    name: media-services
    external: true
  ingress-public:
    name: ingress-public
    external: true

volumes:
  plex_config:
  plex_transcode:
