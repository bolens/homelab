services:
  ntopng:
    labels:
      logging: "true"
    image: ntop/ntopng:latest@sha256:4f3e78ae42559bbc3972bb7cd08aecf1bcd9118085cbf2bda79805e99b907ddd
    container_name: ntopng
    restart: unless-stopped
    # ntopng inspects host network traffic; host networking is recommended.
    network_mode: host
    volumes:
      - ntopng_data:/var/lib/ntopng
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    environment:
      # The image ships C.utf8 only. Redis 8 exits when shared.env requests an
      # unavailable locale such as en_US.UTF-8.
      LANG: C.utf8
      LC_ALL: C.utf8
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  ntopng_data: {}
