services:
  ntopng:
    labels:
      logging: "true"
    image: ntop/ntopng:latest@sha256:286ab781b54490b091e8f5b203def10039196df8c75382b58e2ff65dabedf1a3
    container_name: ntopng
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 128
    cpu_shares: 256
    # ntopng inspects host network traffic; host networking is recommended.
    network_mode: host
    volumes:
      - ntopng_data:/var/lib/ntopng
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    environment:
      # The image ships C.utf8 only. Redis 8 exits when shared.env requests an
      # unavailable locale such as en_US.UTF-8.
      LANG: C.utf8
      LC_ALL: C.utf8
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  ntopng_data: {}
