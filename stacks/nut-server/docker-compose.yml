# NUT server (upsd) for network UPS monitoring.
# Publishes TCP 3493 on the host so upsc/upsmon on the host or LAN can reach the UPS.
# The hostname "nut-server" only resolves inside Docker networks; from the host use
# ups@127.0.0.1:3493 or add nut-server to /etc/hosts (see README).
services:
  nut-server:
    image: instantlinux/nut-upsd:latest@sha256:ab2f9988309ee8a47934e03eb836fa5313cc34234f50ea5400ec65c71dd4e0b2
    container_name: nut-server
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=true
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    security_opt:
      - no-new-privileges:true
    privileged: true
    entrypoint:
      - /bin/sh
      - -ec
      - |
        for file in ups.conf upsd.conf upsd.users upsmon.conf; do
          if [ ! -s "/etc/nut/$$file" ]; then
            echo "Required NUT configuration missing or empty: /etc/nut/$$file" >&2
            exit 1
          fi
        done
        chgrp ${GROUP:-nut} /etc/nut/* || true
        chmod 640 /etc/nut/* || true
        mkdir -p -m 2750 /dev/shm/nut
        chown nut:${GROUP:-nut} /dev/shm/nut
        [ -e /var/run/nut ] || ln -s /dev/shm/nut /var/run
        echo 0 > /var/run/nut/upsd.pid && chown nut:${GROUP:-nut} /var/run/nut/upsd.pid
        echo 0 > /var/run/upsmon.pid
        ulimit -n ${ULIMIT:-2048}
        /usr/sbin/upsdrvctl -u root start &
        i=0
        while [ "$$i" -lt 90 ]; do
          [ -S /var/run/nut/usbhid-ups-ups ] && break
          i=$$((i + 1))
          sleep 1
        done
        /usr/sbin/upsd -u nut
        exec /usr/sbin/upsmon -F
    ports:
      - "3493:3493"
    volumes:
      - ${NUT_CONFIG_DIR:-/home/youruser/.config/nut-server}:/etc/nut
    devices:
      - /dev/bus/usb:/dev/bus/usb
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(upsc -l 127.0.0.1:3493 2>/dev/null)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - ingress-admin
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ingress-admin:
    name: ingress-admin
    external: true
