services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
      - "/mnt/dev/ai/ollama-models:/root/.ollama/models:rw"
    environment:
      OLLAMA_HOST: "${OLLAMA_HOST:-0.0.0.0:11434}"
    env_file:
      - path: ../../shared.env
        required: false
      - path: stack.env
        required: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitor
    labels:
      - logging=true
      - logging_sampling=true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    mem_limit: 8g
    cpus: "4.00"
    gpus: all

networks:
  monitor:
    name: monitor
    external: true

volumes:
  ollama_data: {}
