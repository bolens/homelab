# Ollama - Local LLM runtime (NVIDIA GPU via `deploy` below; comment that block out on CPU-only hosts without the toolkit)
# Models: configurable via OLLAMA_MODELS_PATH. Other data: Docker volume ollama_data.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ${OLLAMA_MODELS_PATH:-./models}:/root/.ollama/models:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitor
    labels:
      - logging=true
      - logging_sampling=true
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:11434/api/tags"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    mem_limit: 8g
    cpus: "4.00"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  monitor:
    name: monitor
    external: true

volumes:
  ollama_data: {}
