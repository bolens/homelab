services:
  ollama:
    image: ollama/ollama:latest@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    container_name: ollama
    restart: unless-stopped
    # Caddy and peer AI stacks reach the API over dedicated networks.
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
      - "/mnt/dev/ai/ollama-models:/root/.ollama/models:rw"
    environment:
      OLLAMA_HOST: "${OLLAMA_HOST:-0.0.0.0:11434}"
    env_file:
      - path: ../../shared.env
        required: false
      - path: stack.env
        required: true
    networks:
      - ai-backend
      - ingress-admin
    labels:
      - logging=true
      - logging_sampling=true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    mem_limit: 8g
    cpus: "4.00"
    gpus: all

networks:
  ai-backend:
    name: ai-backend
    external: true
  ingress-admin:
    name: ingress-admin
    external: true

volumes:
  ollama_data: {}
