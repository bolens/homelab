name: ollama
default_port: 11434
databases: []
health:
  endpoint: /api/tags
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: ai
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: ollama.yourdomain.com
data_profile:
  contains_pii: false
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: true
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://ollama.com
  docs: https://ollama.com/docs
  repo: https://github.com/ollama/ollama
backup:
  priority: medium
  schedule_hint: weekly
volumes:
- name: ollama_data
  role: app_data
  critical: true
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: large
  memory_profile: large
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: ai
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
