name: social-hunt
default_port: 8000
databases: []
health:
  endpoint: /
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: osint
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: social-hunt.yourdomain.com
data_profile:
  contains_pii: false
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://socialhunt.org
  docs: https://github.com/AfterPacket/Social-Hunt#readme
  repo: https://github.com/AfterPacket/Social-Hunt
backup:
  priority: medium
  schedule_hint: weekly
volumes:
- name: social-hunt-data
  role: app_data
  critical: true
- name: social-hunt-plugins
  role: app_data
  critical: true
- name: social-hunt-temp-uploads
  role: app_data
  critical: true
auth:
  mode: builtin
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: small
  memory_profile: small
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
