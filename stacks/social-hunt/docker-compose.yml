# Social-Hunt – OSINT framework: homelab-user search, breach lookups (HIBP/Snusbase/etc.), face matching, reverse image.
# No host ports: access via Caddy (reverse proxy to social-hunt:8000).
# Docs: https://github.com/AfterPacket/Social-Hunt | https://socialhunt.org
services:
  social-hunt:
    labels:
      logging: "true"
    image: harbor.bolens.dev/homelab/social-hunt:latest@sha256:0fab1ba5fe403898070e86233753f8f3bc4e746a214063ecb4a362e78f4d626f
    container_name: social-hunt
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    memswap_limit: 4g
    pids_limit: 512
    cpu_shares: 256
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    environment:
      # Hardcoded: internal listen address
      - SOCIAL_HUNT_HOST=0.0.0.0
      - SOCIAL_HUNT_PORT=8000
      - SOCIAL_HUNT_SETTINGS_PATH=/app/data/settings.json
    volumes:
      - social-hunt-data:/app/data
      - social-hunt-plugins:/app/plugins
      - social-hunt-temp-uploads:/app/web/temp_uploads
    networks:
      - internal
      - security-research
      - ingress-admin
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=4).read(1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s

  social-hunt-proxy:
    labels:
      logging: "true"
    image: ajoergensen/tinyproxy:latest@sha256:ab5be3120573a3bb6b1d238b6f43940a587cbbc3ea83c3d18f0900e60461a5c4
    container_name: social-hunt-proxy
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 256
    cpu_shares: 256
    environment:
      - PORT=8888
      - ALLOWED=0.0.0.0/0
      - LISTEN=0.0.0.0
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8888 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  social-hunt-tor:
    labels:
      logging: "true"
    image: peterdavehello/tor-socks-proxy:latest@sha256:0cc12d36d31265ce828c8422a7e163a0bf46755e90531f4c7d38a6149f071729
    container_name: social-hunt-tor
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 256
    cpu_shares: 256
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9150 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

networks:
  internal:
    driver: bridge
  security-research:
    name: security-research
    external: true
  ingress-admin:
    name: ingress-admin
    external: true

volumes:
  social-hunt-data:
  social-hunt-plugins:
  social-hunt-temp-uploads:
