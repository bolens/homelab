name: auto-identity-remove
default_port: 5000
databases: []
health:
  endpoint: /docs
  internal_only: true
monitoring:
  prometheus: false
  uptime_kuma:
    external: false
    internal: true
  blackbox_exporter: false
  grafana_dashboard: false
shared_resources: []
type: api
category: ai
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: null
data_profile:
  contains_pii: true
  contains_logs_only: false
  recommended_backup: false
host_requirements:
  needs_gpu: true
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://github.com/stephenlthorn/auto-identity-remove
  docs: https://github.com/stephenlthorn/auto-identity-remove
  repo: https://github.com/stephenlthorn/auto-identity-remove
backup:
  priority: low
  schedule_hint: null
volumes:
- name: air_output
  role: app_data
  critical: false
auth:
  mode: none
  sso_provider: null
  access_policy: internal_only
resources:
  cpu_profile: large
  memory_profile: large
  storage_profile: small
  gpu_profile: required
placement:
  preferred_node: null
  colocation_group: ai
lifecycle:
  status: stable
  replacement_for: null
  notes: 'Requires NVIDIA GPU + Container Toolkit. Uses Ollama for PII detection (default:
    shared ollama stack). contains_pii=true because uploaded documents may contain
    sensitive data.'
runtime_security:
  privileged_services: []
  host_network_services: []
  docker_socket_services: []
  floating_image_services:
  - auto-identity-remove
