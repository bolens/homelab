# Open WebUI - Extensible, feature-rich, user-friendly self-hosted AI platform
# Supports Ollama and OpenAI-compatible APIs
# Compose reads `.env` (copy of stack.env from `./prepare-stack.sh`) for `${VAR}` substitution.
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=true
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    volumes:
      - open_webui_data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitor
    mem_limit: 4g
    cpus: "3.00"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  monitor:
    name: monitor
    external: true

volumes:
  open_webui_data:
