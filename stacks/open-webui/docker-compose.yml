# Open WebUI - Extensible, feature-rich, user-friendly self-hosted AI platform
# Supports Ollama and OpenAI-compatible APIs
# Compose reads `.env` (copy of stack.env from `./prepare-stack.sh`) for `${VAR}` substitution.
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main@sha256:8afd2d774834c618a75411b3491cdc5da7396dc464f56a160b937ff2992eb6e4
    container_name: open-webui
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=true
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    volumes:
      - open_webui_data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-backend
      - ingress-public
    mem_limit: 4g
    cpus: "3.00"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:$${PORT:-8080}/health | jq -ne 'input.status == true' || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ai-backend:
    name: ai-backend
    external: true
  ingress-public:
    name: ingress-public
    external: true

volumes:
  open_webui_data:
