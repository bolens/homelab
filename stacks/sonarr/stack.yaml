name: sonarr
default_port: 8989
databases: []
health:
  endpoint: /
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: media
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: sonarr.yourdomain.com
data_profile:
  contains_pii: false
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://sonarr.tv/
  docs: https://wiki.servarr.com/sonarr
  repo: https://github.com/Sonarr/Sonarr
backup:
  priority: medium
  schedule_hint: weekly
volumes:
- name: sonarr_config
  role: app_data
  critical: true
- name: torrents_downloads
  role: app_data
  critical: true
  external: true
# TV library + usenet downloads are host bind mounts (see SONARR_*_PATH)
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: small
  memory_profile: small
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: media
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
