# Unified media bind mount: SONARR_MEDIA_PATH in stack.env.
#   docker compose --env-file stack.env up -d
services:
  sonarr:
    labels:
      logging: "true"
    image: lscr.io/linuxserver/sonarr:latest@sha256:24acea2956a0ccb11f103877d9f4f8576600fb34bff34820ed749c2256dab89f
    container_name: sonarr
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    memswap_limit: 4g
    pids_limit: 512
    cpu_shares: 256
    env_file:
      - stack.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Denver}
    volumes:
      - sonarr_config:/config
      - "${SONARR_MEDIA_PATH:-/mnt/unraid/media}:/data"
    networks:
      - media-automation
      - ingress-admin
      - usenet
      - torrents
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8989/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  media-automation:
    name: media-automation
    external: true
  ingress-admin:
    name: ingress-admin
    external: true
  usenet:
    name: usenet
    external: true
  torrents:
    name: torrents
    external: true

volumes:
  sonarr_config:
