# Kavita – comics, manga, and eBook server. Web reader, OPDS, reading progress.
# Access via Caddy only (no host port).

services:
  kavita:
    labels:
      logging: "true"
    image: lscr.io/linuxserver/kavita:latest@sha256:9ab54dfa133ca038992cea019490c951843712dcb66fec518a01f25d076ef335
    container_name: kavita
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    memswap_limit: 4g
    pids_limit: 512
    cpu_shares: 256
    env_file:
      - stack.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Denver}
    volumes:
      - kavita_config:/config
      - "${KAVITA_BOOKS_PATH:-/mnt/unraid/media/books}:/data/books:ro"
      - "${KAVITA_CALIBRE_EXPORT_PATH:-/mnt/unraid/media/kavita-books}:/data/calibre-books:ro"
      - "${KAVITA_COMICS_PATH:-/mnt/unraid/media/comics}:/data/comics:ro"
      - "${KAVITA_MANGA_PATH:-/mnt/unraid/media/manga}:/data/manga:ro"
    networks:
      - ingress-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s

networks:
  ingress-public:
    name: ingress-public
    external: true

volumes:
  kavita_config:
