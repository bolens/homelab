# Kavita – comics, manga, and eBook server. Web reader, OPDS, reading progress.
# Access via Caddy only (no host port).

services:
  kavita:
    image: lscr.io/linuxserver/kavita:latest
    container_name: kavita
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    memswap_limit: 4g
    pids_limit: 512
    cpu_shares: 256
    env_file:
      - stack.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Denver}
    volumes:
      - kavita_config:/config
      - "${KAVITA_BOOKS_PATH:-/mnt/unraid/media/books}:/data/books"
      - "${KAVITA_COMICS_PATH:-/mnt/unraid/media/comics}:/data/comics"
    networks:
      - monitor
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s

networks:
  monitor:
    name: monitor
    external: true

volumes:
  kavita_config:
