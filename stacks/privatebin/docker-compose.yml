services:
  privatebin:
    labels:
      logging: "true"
    image: privatebin/nginx-fpm-alpine:latest@sha256:7b10825eb4cdcbb0bb5afb82af5a7f30e83af990480e3da9351ad88a9985d96f
    container_name: privatebin
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1536m
    pids_limit: 256
    cpu_shares: 256
    # No host port: access via Caddy on the dedicated ingress network.
    volumes:
      - privatebin_data:/srv/data
    networks:
      - ingress-sensitive
    env_file:
      - stack.env
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  ingress-sensitive:
    name: ingress-sensitive
    external: true

volumes:
  privatebin_data: {}
