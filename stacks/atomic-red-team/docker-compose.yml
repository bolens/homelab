services:
  atomic-red-team:
    build:
      context: .
    image: homelab/atomic-red-team:local
    profiles: ["tools"]
    stdin_open: true
    tty: true
    cpus: 4.0
    mem_limit: 4g
    memswap_limit: 6g
    pids_limit: 1024
    cpu_shares: 256
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    volumes:
      - ${ATOMIC_WORKSPACE_PATH:-${HOME}/security-lab/atomic-red-team}:/workspace
    working_dir: /workspace
    command: ["pwsh"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"
