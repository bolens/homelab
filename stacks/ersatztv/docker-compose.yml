services:
  ersatztv:
    labels:
      logging: "true"
    image: ghcr.io/ersatztv/legacy:v26.11.5@sha256:9d82593791d78d20b7d3673dd10dc4bc0a060ede27eada7e2487d5226e91abda
    container_name: ersatztv
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 4.0
    mem_limit: 6g
    memswap_limit: 8g
    pids_limit: 1024
    cpu_shares: 512
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    volumes:
      - ersatztv_config:/config
      - type: bind
        source: ${ERSATZTV_MEDIA_PATH:?Set ERSATZTV_MEDIA_PATH to an existing mounted library}
        target: /media
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /transcode:size=2g
    networks:
      - ingress-admin
      - media-services
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8409/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  ingress-admin:
    name: ingress-admin
    external: true
  media-services:
    name: media-services
    external: true

volumes:
  ersatztv_config:
