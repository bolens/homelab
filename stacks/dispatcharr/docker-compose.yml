services:
  dispatcharr:
    labels:
      logging: "true"
    image: ghcr.io/dispatcharr/dispatcharr:latest@sha256:96bc548978c68e684677da7895692eeeefb7f0b2edfa38311dac2b702c61d236
    container_name: dispatcharr
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    memswap_limit: 4g
    pids_limit: 1024
    cpu_shares: 256
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    environment:
      # aio keeps PostgreSQL, Redis and workers inside this service. Preserve
      # the complete /data volume when backing up or changing image versions.
      DISPATCHARR_ENV: aio
      REDIS_HOST: localhost
      CELERY_BROKER_URL: redis://localhost:6379/0
    volumes:
      - dispatcharr_data:/data
    networks:
      - ingress-admin
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          response = urllib.request.urlopen('http://127.0.0.1:9191/api/accounts/initialize-superuser/', timeout=5);
          assert isinstance(json.load(response).get('superuser_exists'), bool)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  ingress-admin:
    name: ingress-admin
    external: true

volumes:
  dispatcharr_data:
