services:
  lubelogger:
    image: ghcr.io/hargata/lubelogger:v1.7.4@sha256:483a9d7582c4e6258615fd822b3de4193b4fcc4230d0a92432c6d407faf75af2
    container_name: lubelogger
    restart: unless-stopped
    env_file:
    - stack.env
    labels:
      logging: 'true'
    volumes:
    - lubelogger_data:/App/data
    - lubelogger_keys:/root/.aspnet/DataProtection-Keys
    networks:
    - ingress-sensitive
    healthcheck:
      test:
      - CMD
      - bash
      - -ec
      - 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET / HTTP/1.1\r\nHost: localhost\r\nConnection:
        close\r\n\r\n" >&3; read -r response <&3; [[ "$$response" =~ ^HTTP/1.[01]\
        [23][0-9][0-9] ]]'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
networks:
  ingress-sensitive:
    name: ingress-sensitive
    external: true
volumes:
  lubelogger_data: {}
  lubelogger_keys: {}
