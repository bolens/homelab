name: tailscale-exporter

services:
  tailscale-exporter:
    labels:
      logging: "true"
    image: adinhodovic/tailscale-exporter:latest@sha256:317db08482da5f9d08ba8978806aba25b9ac0ea1aec56996d6aec32de708d3b7
    container_name: tailscale-exporter
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 256
    cpu_shares: 256
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    networks:
      - telemetry

networks:
  telemetry:
    name: telemetry
    external: true
