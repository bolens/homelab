name: tailscale-exporter

services:
  tailscale-exporter:
    labels:
      logging: "true"
    image: adinhodovic/tailscale-exporter:latest@sha256:e65d9d3a5bc3ac3ee12bfdb62960b1918a6e8ecd386bbb8ddef2a68bc2b7eafd
    container_name: tailscale-exporter
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 256
    cpu_shares: 256
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    networks:
      - telemetry

networks:
  telemetry:
    name: telemetry
    external: true
