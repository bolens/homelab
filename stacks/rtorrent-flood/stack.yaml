name: rtorrent-flood
default_port: 3000
databases: []
health:
  endpoint: /
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: downloads
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: rtorrent-flood.yourdomain.com
data_profile:
  contains_pii: false
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://github.com/jesec/flood
  docs: https://github.com/jesec/flood/wiki
  repo: https://github.com/jesec/flood
backup:
  priority: medium
  schedule_hint: weekly
volumes:
- name: rtorrent_flood_config
  role: app_data
  critical: true
- name: rtorrent_sock
  role: app_data
  critical: true
- name: rutorrent_config
  role: app_data
  critical: true
- name: torrents_manual
  role: app_data
  critical: true
  external: true
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: small
  memory_profile: small
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: media
lifecycle:
  status: stable
  replacement_for: null
  notes: Bundled rTorrent/Flood image; flood provides a split-service alternative.
runtime_security:
  privileged_services: []
  host_network_services: []
  docker_socket_services: []
  floating_image_services: []
