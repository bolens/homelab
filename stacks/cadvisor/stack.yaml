name: cadvisor
default_port: 8080
databases: []
health:
  endpoint: /healthz
  internal_only: true
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: monitoring
exposure:
  behind_caddy: false
  public_by_default: false
  recommended_hostname: cadvisor.yourdomain.com
data_profile:
  contains_pii: false
  contains_logs_only: false
  recommended_backup: false
host_requirements:
  needs_gpu: false
  needs_privileged: true
  uses_host_network: false
links:
  homepage: https://github.com/google/cadvisor
  docs: https://github.com/google/cadvisor/tree/master/docs
  repo: https://github.com/google/cadvisor
backup:
  priority: low
  schedule_hint: manual
volumes: []
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: medium
  memory_profile: medium
  storage_profile: small
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: monitoring
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
