services:
  enclosed:
    image: corentinth/enclosed:latest@sha256:e65f73b085823ceeab1a39c515614c1a24e9b5c69b8e1221d3d7071a4f8bc4a8
    container_name: enclosed
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=false
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    volumes:
      - enclosed_data:/app/.data
    networks:
      - ingress-sensitive
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8787/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    mem_limit: 512m
    cpus: "0.5"

networks:
  ingress-sensitive:
    name: ingress-sensitive
    external: true

volumes:
  enclosed_data: {}
