name: sublist3r

# Sublist3r reaches Caddy's optional HTTP forward proxy over security-research.
# Results: default ~/.config/sublist3r/results. Override with SUBLIST3R_RESULTS_PATH (e.g. in Portainer).

services:
  sublist3r:
    image: opendevsecops/sublist3r:latest@sha256:080535e98a4acf07ddee24c25c0f4705e0e10c7eeceb2a25d94a30eaf6256f06
    container_name: sublist3r
    restart: "no"
    env_file:
      - stack.env
    environment:
      - TZ=${TZ:-America/Denver}
    volumes:
      - ${SUBLIST3R_RESULTS_PATH:-${HOME}/.config/sublist3r/results}:/results
    networks:
      - security-research
    stdin_open: true
    tty: true

networks:
  security-research:
    name: security-research
    external: true
