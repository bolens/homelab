services:
  it-tools:
    labels:
      logging: "true"
    image: ghcr.io/sharevb/it-tools:2026.10.25@sha256:c6e68a94af10c73cb4e53eaa78726d8abbbb4ad1a89a3f127a69f85a9ae029ab
    container_name: it-tools
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 256
    cpu_shares: 256
    # No host port: access via Caddy on the dedicated ingress network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ingress-admin
    env_file:
      - stack.env
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  ingress-admin:
    name: ingress-admin
    external: true
