name: jellyfin
default_port: 8096
databases: []
health:
  endpoint: /health
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: media
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: jellyfin.yourdomain.com
data_profile:
  contains_pii: false
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: true
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://jellyfin.org/
  docs: https://jellyfin.org/docs/
  repo: https://github.com/jellyfin/jellyfin
backup:
  priority: medium
  schedule_hint: weekly
volumes:
- name: jellyfin_config
  role: app_data
  critical: true
- name: jellyfin_cache
  role: app_data
  critical: true
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: small
  memory_profile: small
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: media
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
runtime_security:
  privileged_services: []
  host_network_services: []
  docker_socket_services: []
  floating_image_services: []
