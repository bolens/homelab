services:
  jellyfin:
    labels:
      logging: "true"
    image: lscr.io/linuxserver/jellyfin:latest@sha256:b8dcc7b71d0ea872b74314da4b995c0cf282b1778438c295996e7be88c70fdda
    container_name: jellyfin
    restart: unless-stopped
    cpus: 6.0
    mem_limit: 8g
    memswap_limit: 10g
    pids_limit: 1024
    cpu_shares: 384
    env_file:
      - stack.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Denver}
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - ./config/10-fix-volume-ownership.sh:/custom-cont-init.d/10-fix-volume-ownership.sh:ro
      - "${JELLYFIN_TV_PATH:-/mnt/unraid/media/tv}:/data/tv"
      - "${JELLYFIN_MOVIES_PATH:-/mnt/unraid/media/movies}:/data/movies"
      - "${JELLYFIN_MUSIC_PATH:-/mnt/unraid/media/music}:/data/music"
    networks:
      - media-services
      - ingress-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8096/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  media-services:
    name: media-services
    external: true
  ingress-public:
    name: ingress-public
    external: true

volumes:
  jellyfin_config:
  jellyfin_cache:
