# BookStack – wiki and documentation (books, chapters, pages).
# No host ports; access via Caddy (e.g. https://bookstack.yourdomain.com → bookstack:80).
# Requires MariaDB; set APP_URL and preserve the APP_KEY supplied by stack.env
# or existing /config/www/.env. Never rotate the key during an image update.
services:
  mariadb:
    labels:
      logging: "true"
    image: lscr.io/linuxserver/mariadb:latest@sha256:dfd0f601cedf95381781c1b9b27424c608a78ddd97faa484da678873240f65e6
    container_name: bookstack-mariadb
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - MYSQL_DATABASE=bookstack
      - MYSQL_USER=bookstack
    volumes:
      - bookstack_mariadb:/config
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --silent -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  bookstack:
    labels:
      logging: "true"
    image: lscr.io/linuxserver/bookstack:latest@sha256:f9de4213499f892570a93368aded13836c421b0f166f9d85be4d7b223071f7fd
    container_name: bookstack
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    env_file:
      - stack.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Denver}
      - APP_URL=${APP_URL}
      - DB_HOST=mariadb
      - DB_DATABASE=bookstack
      - DB_USERNAME=bookstack
    volumes:
      - bookstack_data:/config
    networks:
      - default
      - ingress-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

networks:
  ingress-public:
    name: ingress-public
    external: true

volumes:
  bookstack_mariadb:
  bookstack_data:
