# BookStack – wiki and documentation (books, chapters, pages).
# No host ports; access via Caddy (e.g. https://bookstack.yourdomain.com → bookstack:80).
# Requires MariaDB; set APP_URL to your Caddy hostname.
services:
  mariadb:
    labels:
      logging: "true"
    image: lscr.io/linuxserver/mariadb:latest@sha256:e1533463effa51906009471d281eb9ea602e5fb6dfc52e2eeb0215b5bc8ecd40
    container_name: bookstack-mariadb
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - MYSQL_DATABASE=bookstack
      - MYSQL_USER=bookstack
    volumes:
      - bookstack_mariadb:/config
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --silent -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  bookstack:
    labels:
      logging: "true"
    image: lscr.io/linuxserver/bookstack:latest@sha256:90a3df3108fe4471a9ed89625020cc321c5354255900c34309727320f2e65367
    container_name: bookstack
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    env_file:
      - stack.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Denver}
      - APP_URL=${APP_URL}
      - DB_HOST=mariadb
      - DB_DATABASE=bookstack
      - DB_USERNAME=bookstack
    volumes:
      - bookstack_data:/config
    networks:
      - default
      - ingress-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

networks:
  ingress-public:
    name: ingress-public
    external: true

volumes:
  bookstack_mariadb:
  bookstack_data:
