# qBittorrent + Gluetun VPN – torrent client for *arr automation (Sonarr/Radarr/Lidarr/Readarr).
# All qBittorrent traffic goes through the VPN. Gluetun container is reachable as "qbittorrent" on the
# torrents network so *arr stacks can use http://qbittorrent:8080. No host port for Web UI; use Caddy.
# See README for shared network/volume setup and Gluetun VPN configuration.
# Start: docker compose up -d

name: qbittorrent

services:
  gluetun:
    labels:
      logging: "true"
    image: qmcgaw/gluetun:latest@sha256:688bd15396f7f47b56351f645d8c8d24e5da935a9ff86c89bcd1e51ea287da3e
    container_name: qbittorrent
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - stack.env
    networks:
      - torrents
      - ingress-admin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    # No host ports: Web UI (8080) is reached only via Caddy. Torrent port 6881 is internal;
    # for incoming peers use your VPN provider's port forwarding (Gluetun) and set that port in qBittorrent.

  qbittorrent:
    labels:
      logging: "true"
    image: lscr.io/linuxserver/qbittorrent:latest@sha256:a00b6a597a3832a1814cde0ef60abc55c94644f3f80902c3432f6af6de8d4a96
    network_mode: service:gluetun
    env_file:
      - stack.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Denver}
    volumes:
      - qbittorrent_config:/config
      - "${QBITTORRENT_MEDIA_PATH:-/mnt/unraid/media}:/data"
    restart: unless-stopped
    depends_on:
      - gluetun

networks:
  torrents:
    name: torrents
    external: true
  ingress-admin:
    name: ingress-admin
    external: true

volumes:
  qbittorrent_config:
