name: holehe

services:
  holehe-web:
    build:
      context: ./repo
      dockerfile: Dockerfile
    image: holehe-web:local
    container_name: holehe-web
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1536m
    pids_limit: 256
    cpu_shares: 256
    env_file:
      - stack.env
    environment:
      - TZ=${TZ:-America/Denver}
    networks:
      - proxy-ingress

networks:
  proxy-ingress:
    name: proxy-ingress
    external: true
