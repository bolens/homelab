name: holehe

services:
  holehe-web:
    labels:
      logging: "true"
    build:
      context: ./repo
      dockerfile: Dockerfile
    image: holehe-web:local
    container_name: holehe-web
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1536m
    pids_limit: 256
    cpu_shares: 256
    env_file:
      - stack.env
    environment:
      - TZ=${TZ:-America/Denver}
    networks:
      - security-research
      - ingress-admin

networks:
  security-research:
    name: security-research
    external: true
  ingress-admin:
    name: ingress-admin
    external: true
