services:
  pocketbase:
    image: coollabsio/pocketbase:latest
    container_name: pocketbase
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1536m
    pids_limit: 256
    cpu_shares: 256
    env_file:
      - path: ../../shared.env
        required: false
      - path: stack.env
        required: false
    volumes:
      - pocketbase-data:/pb/pb_data
    networks:
      - monitor
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- http://127.0.0.1:8080/api/health | grep -q 'API is healthy'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  monitor:
    name: monitor
    external: true

volumes:
  pocketbase-data:
