# Kokoro FastAPI — Kokoro-82M TTS with web UI + OpenAI-compatible speech API.
# Docs: https://github.com/remsky/Kokoro-FastAPI
# Web UI: http://kokoro-tts:8880/web — API: /v1, docs: /docs
# No host ports; Caddy uses `ingress-public`, while AI clients use `ai-backend`.
# Compose reads `.env` (copy of stack.env from `./prepare-stack.sh`) for `${VAR}` substitution.
services:
  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:${KOKORO_IMAGE_TAG:-latest}
    container_name: kokoro-tts
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=true
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    volumes:
      - kokoro_tts_cache:/root/.cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-backend
      - ingress-public
    mem_limit: 6g
    cpus: "2.00"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8880/docs', timeout=15).status==200 else 1)",
        ]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 180s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ai-backend:
    name: ai-backend
    external: true
  ingress-public:
    name: ingress-public
    external: true

volumes:
  kokoro_tts_cache: {}
