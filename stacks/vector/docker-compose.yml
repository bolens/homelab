services:
  vector:
    image: timberio/vector:latest-debian
    container_name: vector
    restart: unless-stopped
    command: ["vector", "-c", "/etc/vector/vector.toml"]
    env_file:
      - stack.env
    volumes:
      - ./vector.toml:/etc/vector/vector.toml:ro
      - /var/log:/var/log:ro
      - /run/log/journal:/run/log/journal:ro
    networks:
      - monitor
    healthcheck:
      test: ["CMD", "vector", "validate", "--no-environment", "/etc/vector/vector.toml"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  monitor:
    name: monitor
    external: true
