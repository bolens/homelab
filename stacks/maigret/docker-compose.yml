# Maigret – OSINT: collect a dossier on a person by homelab-user from thousands of sites.
# Web UI on port 5000; no host ports: access via Caddy (reverse proxy to maigret:5000).
# Docs: https://github.com/soxoj/maigret  |  Web: maigret --web 5000
services:
  maigret:
    labels:
      logging: "true"
    image: soxoj/maigret:latest@sha256:f2a8da62c2bc6c4a69be22aa2768119704d0c5c4fc37147ce322c21a13167e38
    container_name: maigret
    restart: unless-stopped
    command: ["--web", "5000"]
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    volumes:
      - maigret-reports:/app/reports
    networks:
      - security-research
      - ingress-admin

networks:
  security-research:
    name: security-research
    external: true
  ingress-admin:
    name: ingress-admin
    external: true

volumes:
  maigret-reports:
