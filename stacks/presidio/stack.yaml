name: presidio
default_port: 5002
databases: []
health:
  endpoint: /
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources:
- ingress-admin
type: web_app
category: security
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: presidio.yourdomain.com
data_profile:
  contains_pii: false
  contains_logs_only: false
  recommended_backup: false
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://microsoft.github.io/presidio/
  docs: null
  repo: https://github.com/microsoft/presidio
backup:
  priority: low
  schedule_hint: manual
volumes: []
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: large
  memory_profile: medium
  storage_profile: small
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
runtime_security:
  privileged_services: []
  host_network_services: []
  docker_socket_services: []
  floating_image_services: []
