services:
  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    container_name: presidio-anonymizer
    restart: unless-stopped
    environment:
      - PORT=5001
      - WORKERS=1
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:5001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    env_file:
      - path: ../../shared.env
        required: false
      - path: stack.env
        required: false
    networks:
      - monitor

  presidio-image-redactor:
    image: mcr.microsoft.com/presidio-image-redactor:latest
    container_name: presidio-image-redactor
    restart: unless-stopped
    environment:
      - PORT=5003
      - WORKERS=1
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5003/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    env_file:
      - path: ../../shared.env
        required: false
      - path: stack.env
        required: false
    networks:
      - monitor

networks:
  monitor:
    name: monitor
    external: true
