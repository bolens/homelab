services:
  tika:
    image: apache/tika:latest-full
    container_name: tika
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    memswap_limit: 4g
    pids_limit: 512
    cpu_shares: 256
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    networks:
      - ingress-public
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9998/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  ingress-public:
    name: ingress-public
    external: true
