services:
  bazarr:
    labels:
      logging: "true"
    image: lscr.io/linuxserver/bazarr:latest@sha256:e464484e7e6cff8ee189036c9ba96977ab054104ea18067ecf6171d0f3f3f8f2
    container_name: bazarr
    restart: unless-stopped
    # Audio extraction for subtitle synchronization invokes ffmpeg with
    # automatic threading. Keep background work from consuming multiple cores.
    cpus: 1.0
    mem_limit: 3g
    memswap_limit: 4g
    pids_limit: 512
    cpu_shares: 256
    env_file:
      - stack.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Denver}
    volumes:
      - bazarr_config:/config
      - "${BAZARR_TV_PATH:-/mnt/unraid/media/tv}:/data/tv"
      - "${BAZARR_MOVIES_PATH:-/mnt/unraid/media/movies}:/data/movies"
    networks:
      - media-automation
      - ingress-admin
    extra_hosts:
      # Plex uses host networking in this repository.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:6767/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  media-automation:
    name: media-automation
    external: true
  ingress-admin:
    name: ingress-admin
    external: true

volumes:
  bazarr_config:
