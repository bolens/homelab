services:
  web-check:
    labels:
      logging: "true"
    image: lissy93/web-check:latest@sha256:a4e021c0f6a9382d9b3dbab7217eb33b8e1f09dd005ab82ff9131b85692f5a6a
    container_name: web-check
    restart: unless-stopped
    # No host port: access via Caddy on the dedicated ingress network.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - security-research
      - ingress-admin
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    environment:
      # Hardcoded: Puppeteer/Chromium paths (not user-configurable)
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

networks:
  security-research:
    name: security-research
    external: true
  ingress-admin:
    name: ingress-admin
    external: true
