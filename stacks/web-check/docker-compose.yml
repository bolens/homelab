services:
  web-check:
    labels:
      logging: "true"
    image: lissy93/web-check:latest@sha256:9095e9a81223e329785a6255cca449ec61d274890ccaa02b5b82a85043ace29b
    container_name: web-check
    restart: unless-stopped
    # No host port: access via Caddy on the dedicated ingress network.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - security-research
      - ingress-admin
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    environment:
      # Hardcoded: Puppeteer/Chromium paths (not user-configurable)
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=1
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

networks:
  security-research:
    name: security-research
    external: true
  ingress-admin:
    name: ingress-admin
    external: true
