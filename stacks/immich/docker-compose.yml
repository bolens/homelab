# Immich – self-hosted photo and video backup. See https://immich.app/docs/install/docker-compose
# Portainer-friendly: named volumes, env from stack.env, external monitor network for Caddy.
# For the latest compose from upstream: https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml

name: immich

services:
  immich-server:
    container_name: immich-server
    cpus: 4.0
    mem_limit: 6g
    memswap_limit: 8g
    pids_limit: 1024
    cpu_shares: 384
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - library:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:2283:2283"
    depends_on:
      - redis
      - database
    restart: unless-stopped
    healthcheck:
      disable: false
    networks:
      - default
      - monitor

  immich-machine-learning:
    container_name: immich-machine-learning
    cpus: 4.0
    mem_limit: 8g
    memswap_limit: 10g
    pids_limit: 1024
    cpu_shares: 256
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    environment:
      - TZ=${TZ:-America/Denver}
    volumes:
      - model-cache:/cache
    restart: unless-stopped
    healthcheck:
      disable: false
    networks:
      - default
      - monitor

  redis:
    container_name: immich-redis
    image: docker.io/valkey/valkey:9@sha256:3acc0687f2a2e1091fae6450d7842dd658c941338cf0a873ddd9e14b9e4ea4dd
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1536m
    pids_limit: 256
    cpu_shares: 256
    volumes:
      - redisdata:/data
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped
    networks:
      - default

  database:
    container_name: immich-postgres
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0@sha256:1a078b237c1d9b420b0ee59147386b4aa60d3a07a8e6a402fc84a57e41b043a4
    cpus: 2.0
    mem_limit: 4g
    memswap_limit: 6g
    pids_limit: 512
    cpu_shares: 384
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    environment:
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      disable: false
    networks:
      - default

networks:
  monitor:
    name: monitor
    external: true

volumes:
  library:
  model-cache:
  pgdata:
  redisdata:
