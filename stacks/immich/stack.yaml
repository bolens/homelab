name: immich
default_port: 2283
databases:
- postgres
- redis
health:
  endpoint: /
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: media
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: immich.yourdomain.com
data_profile:
  contains_pii: true
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://immich.app
  docs: https://immich.app/docs
  repo: https://github.com/immich-app/immich
backup:
  priority: high
  schedule_hint: weekly
volumes:
- name: library
  role: app_data
  critical: true
- name: model-cache
  role: app_data
  critical: true
- name: pg16data
  role: app_data
  critical: true
- name: redisdata
  role: app_data
  critical: true
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: medium
  memory_profile: medium
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: media
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
