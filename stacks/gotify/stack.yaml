name: gotify
default_port: 80
databases:
- sqlite
health:
  endpoint: /health
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: utility
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: notify.example.com
data_profile:
  contains_pii: true
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://gotify.net/
  docs: https://gotify.net/docs/
  repo: https://github.com/gotify/server
backup:
  priority: medium
  schedule_hint: weekly
volumes:
- name: gotify_data
  role: app_data
  critical: true
auth:
  mode: app_local
  sso_provider: null
  access_policy: app_auth
resources:
  cpu_profile: small
  memory_profile: small
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: ntfy
  notes: ''
runtime_security:
  privileged_services: []
  host_network_services: []
  docker_socket_services: []
  floating_image_services: []
