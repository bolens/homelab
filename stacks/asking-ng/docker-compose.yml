services:
  asking-db:
    image: postgres:16-alpine
    container_name: asking-ng-db
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    expose:
      - "5432"
    volumes:
      - asking_ng_pg_data:/var/lib/postgresql/data
    healthcheck:
      # Expand at runtime inside the container (env from env_file), not at compose parse time.
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  asking-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: asking-ng-api
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    depends_on:
      asking-db:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=false
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-S", "http://localhost:3001/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 1g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    pids_limit: 256
    networks:
      - backend
      # Same external network as stacks/ollama (and other homelab services) so
      # OLLAMA_BASE_URL=http://ollama:11434 resolves when Ollama runs in that stack.
      - monitor

  asking-frontend:
    build:
      context: .
      dockerfile: client/Dockerfile.prod
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
        VITE_PUBLIC_ORIGIN: ${VITE_PUBLIC_ORIGIN:-}
        VITE_SITE_FOOTER: ${VITE_SITE_FOOTER:-}
        VITE_ATTRIBUTION_URL: ${VITE_ATTRIBUTION_URL:-}
        VITE_UMAMI_SCRIPT_URL: ${VITE_UMAMI_SCRIPT_URL:-}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
        VITE_UMAMI_DOMAINS: ${VITE_UMAMI_DOMAINS:-}
        VITE_PLAUSIBLE_SCRIPT_URL: ${VITE_PLAUSIBLE_SCRIPT_URL:-}
        VITE_PLAUSIBLE_DOMAIN: ${VITE_PLAUSIBLE_DOMAIN:-}
        VITE_MATOMO_BASE_URL: ${VITE_MATOMO_BASE_URL:-}
        VITE_MATOMO_SITE_ID: ${VITE_MATOMO_SITE_ID:-}
        VITE_LEGAL_CONTACT_EMAIL: ${VITE_LEGAL_CONTACT_EMAIL:-}
        VITE_LEGAL_CONTACT_URL: ${VITE_LEGAL_CONTACT_URL:-}
        VITE_LEGAL_JURISDICTION: ${VITE_LEGAL_JURISDICTION:-}
        VITE_LEGAL_LAST_UPDATED: ${VITE_LEGAL_LAST_UPDATED:-}
        VITE_LEGAL_SECURITY_EMAIL: ${VITE_LEGAL_SECURITY_EMAIL:-}
    container_name: asking-ng-frontend
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    depends_on:
      asking-api:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=false
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    cpus: 0.5
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /config
      - /data
    networks:
      - backend
      - monitor

networks:
  backend:
    internal: true
  monitor:
    name: monitor
    external: true

volumes:
  asking_ng_pg_data:
