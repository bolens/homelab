services:
  asking-db:
    image: postgres:16-alpine
    container_name: asking-ng-db
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    expose:
      - "5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - asking_ng_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - monitor

  asking-api:
    build: ./api
    container_name: asking-ng-api
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    depends_on:
      asking-db:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=false
    expose:
      - "3001"
    environment:
      - DATABASE_URI=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@asking-db:5432/${POSTGRES_DB}
      - PORT=3001
    healthcheck:
      test: ["CMD", "wget", "--spider", "-S", "http://localhost:3001/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 1g
    cpus: 1.0
    networks:
      - default
      - monitor

  asking-frontend:
    build:
      context: ./client
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile.dev}
      args:
        - VITE_API_BASE=${VITE_API_BASE:-/api}
    container_name: asking-ng-frontend
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    depends_on:
      asking-api:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=false
    expose:
      - "${FRONTEND_EXPOSE_PORT:-3000}"
    environment:
      - VITE_API_BASE=${VITE_API_BASE:-/api}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${FRONTEND_EXPOSE_PORT:-3000}/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    cpus: 0.5
    networks:
      - default
      - monitor

networks:
  monitor:
    name: monitor
    external: true

volumes:
  asking_ng_pg_data:
