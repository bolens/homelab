<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <!-- Approximate CVD simulation (sRGB); for awareness / testing, not clinical calibration. -->
    <filter id="cv-protanopia" color-interpolation-filters="sRGB">
      <feColorMatrix
        type="matrix"
        values="0.367 0.861 -0.228 0 0
                0.280 0.673 0.047 0 0
               -0.012 0.043 0.969 0 0
                0 0 0 1 0"
      />
    </filter>
    <filter id="cv-deuteranopia" color-interpolation-filters="sRGB">
      <feColorMatrix
        type="matrix"
        values="0.625 0.375 0 0 0
                0.7 0.3 0 0 0
                0 0.3 0.7 0 0
                0 0 0 1 0"
      />
    </filter>
    <filter id="cv-tritanopia" color-interpolation-filters="sRGB">
      <feColorMatrix
        type="matrix"
        values="0.95 0.05 0 0 0
                0 0.433 0.567 0 0
                0 0.475 0.525 0 0
                0 0 0 1 0"
      />
    </filter>
  </defs>
</svg>
