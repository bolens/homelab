name: asking-ng client

on:
  push:
    paths:
      - "client/**"
      - "packages/contracts/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - "biome.json"
      - ".github/workflows/client.yml"
  pull_request:
    paths:
      - "client/**"
      - "packages/contracts/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - "biome.json"
      - ".github/workflows/client.yml"

concurrency:
  group: asking-ng-client-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Biome (CI)
        run: pnpm run check:ci

      - name: Verify client (turbo)
        run: pnpm exec turbo run verify --filter=client

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @asking-ng/contracts run build

      - name: Install Playwright Chromium and WebKit
        run: pnpm --filter client exec playwright install --with-deps chromium webkit

      - name: End-to-end tests
        env:
          E2E_ADMIN_TOKEN: ${{ secrets.E2E_ADMIN_TOKEN }}
        run: pnpm --filter client run e2e:webkit
