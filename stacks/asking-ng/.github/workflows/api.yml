name: asking-ng api

on:
  push:
    paths:
      - "api/**"
      - "packages/contracts/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - "biome.json"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "api/**"
      - "packages/contracts/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - "biome.json"
      - ".github/workflows/api.yml"

concurrency:
  group: asking-ng-api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Biome (CI)
        run: pnpm run check:ci

      - name: Verify api (turbo)
        run: pnpm exec turbo run verify --filter=api
