services:
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest@sha256:4fb4db4d49a217bed6d0204f454ce809febc565bbe051b85c556ee2bcef73d8c
    container_name: zigbee2mqtt
    restart: unless-stopped
    volumes:
      - zigbee2mqtt_data:/app/data
    devices:
      # Adjust device path for your Zigbee adapter (e.g. /dev/ttyUSB0, /dev/ttyACM0)
      - /dev/ttyUSB0:/dev/ttyUSB0
    networks:
      - ingress-admin
    env_file:
      - stack.env
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  ingress-admin:
    name: ingress-admin
    external: true

volumes:
  zigbee2mqtt_data: {}
