name: ghunt

# GHunt reaches Caddy's optional HTTP forward proxy over security-research.

services:
  ghunt:
    labels:
      logging: "true"
    image: ${GHUNT_IMAGE:-harbor.yourdomain.com/homelab/ghunt:latest}
    container_name: ghunt
    restart: "no"
    env_file:
      - stack.env
    environment:
      - TZ=${TZ:-America/Denver}
    volumes:
      # GHunt config (cookies, settings) – persisted between runs
      - ghunt-config:/root/.config/ghunt
      # Optional: place JSON exports and other outputs here
      - ghunt-data:/data
    networks:
      - security-research
    stdin_open: true
    tty: true

networks:
  security-research:
    name: security-research
    external: true

volumes:
  ghunt-config:
  ghunt-data:
