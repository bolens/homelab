# Lanraragi – tag-based comic/manga archive manager. CBR, CBZ, PDF; plugins for metadata.
# Access via Caddy only (no host port).

services:
  lanraragi:
    labels:
      logging: "true"
    image: difegue/lanraragi:latest@sha256:6376a3de75c8a4045aadeb252eee9661ee9baf27965cec7a405a2b246d2937b3
    container_name: lanraragi
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    memswap_limit: 4g
    pids_limit: 512
    cpu_shares: 256
    env_file:
      - stack.env
    environment:
      - TZ=${TZ:-America/Denver}
      - LRR_UID=${LRR_UID:-9001}
      - LRR_GID=${LRR_GID:-9001}
    volumes:
      - lanraragi_content:/home/koyomi/lanraragi/content
      - lanraragi_database:/home/koyomi/lanraragi/database
      - lanraragi_thumb:/home/koyomi/lanraragi/thumb
    networks:
      - ingress-public
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  ingress-public:
    name: ingress-public
    external: true

volumes:
  lanraragi_content:
  lanraragi_database:
  lanraragi_thumb:
