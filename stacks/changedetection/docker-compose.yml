services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:0.70.3@sha256:47b1e9cc3eff820e6022b655e3fcc948625f60c1770ae8b9c30aa3bf104dc255
    container_name: changedetection
    restart: unless-stopped
    env_file:
    - stack.env
    labels:
      logging: 'true'
    volumes:
    - changedetection_data:/datastore
    networks:
    - ingress-admin
    - telemetry
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/',timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
networks:
  ingress-admin:
    name: ingress-admin
    external: true
  telemetry:
    name: telemetry
    external: true
volumes:
  changedetection_data: {}
