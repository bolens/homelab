services:
  changedetection:
    environment:
      PLAYWRIGHT_DRIVER_URL: ws://changedetection-browser:3000
    networks:
    - ingress-admin
    - telemetry
    - browser
    depends_on:
      changedetection-browser:
        condition: service_started
  changedetection-browser:
    image: dgtlmoon/sockpuppetbrowser:latest@sha256:1d8f72d2ce2085faed4232e5ae1e65c02efe5b831a18e127829b267c260b4fb2
    container_name: changedetection-browser
    restart: unless-stopped
    environment:
      SCREEN_WIDTH: '1920'
      SCREEN_HEIGHT: '1080'
      SCREEN_DEPTH: '24'
      MAX_CONCURRENT_CHROME_PROCESSES: '2'
    networks:
    - browser
    shm_size: 1gb
    mem_limit: 2g
networks:
  browser: {}
