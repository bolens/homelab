name: navidrome

services:
  navidrome:
    container_name: navidrome
    image: deluan/navidrome:latest
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 256
    env_file:
      - stack.env
    environment:
      - TZ=${TZ:-America/Denver}
    volumes:
      - navidrome_data:/data
      - "${NAVIDROME_MUSIC_PATH:-/mnt/unraid/media/music}:/music"
    restart: unless-stopped
    networks:
      - proxy-ingress
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4533/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  proxy-ingress:
    name: proxy-ingress
    external: true

volumes:
  navidrome_data:
