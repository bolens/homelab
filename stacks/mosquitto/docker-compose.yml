services:
  mosquitto:
    labels:
      logging: "true"
    image: eclipse-mosquitto:latest@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - mosquitto_config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - ingress-admin
    env_file:
      - stack.env
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/version", "-C", "1", "-W", "3"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  ingress-admin:
    name: ingress-admin
    external: true

volumes:
  mosquitto_config: {}
  mosquitto_data: {}
  mosquitto_log: {}
