services:
  mosquitto:
    labels:
      logging: "true"
    image: eclipse-mosquitto:latest@sha256:860aeb5d63ce509508f6dcfb2bc8a1c1dd2bc60555b562b45ce90e52d8dabb0f
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - mosquitto_config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - ingress-admin
    env_file:
      - stack.env
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/version", "-C", "1", "-W", "3"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  ingress-admin:
    name: ingress-admin
    external: true

volumes:
  mosquitto_config: {}
  mosquitto_data: {}
  mosquitto_log: {}
