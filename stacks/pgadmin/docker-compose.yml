services:
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: pgadmin
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 1536m
    memswap_limit: 2g
    pids_limit: 256
    cpu_shares: 256
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    environment:
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_LISTEN_PORT: "5050"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - monitor
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/misc/ping', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  monitor:
    name: monitor
    external: true

volumes:
  pgadmin_data:
