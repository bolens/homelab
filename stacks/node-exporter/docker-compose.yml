# Node Exporter – host metrics (CPU, memory, disk, etc.) for Prometheus.
# No host port; Prometheus scrapes node-exporter:9100 on the telemetry network.
# Reads host filesystem via mounted root; add a scrape job in prometheus.yml.
services:
  node-exporter:
    labels:
      logging: "true"
    image: prom/node-exporter:latest@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: node-exporter
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 256
    cpu_shares: 256
    command:
      - --path.rootfs=/host
      # This host exposes NVMe namespace attributes that intermittently return
      # EIO; Scrutiny handles disk health, so avoid a failed collector per scrape.
      - --no-collector.nvme
    volumes:
      - /:/host:ro,rslave
      - /run/udev/data:/run/udev/data:ro
    networks:
      - telemetry
    env_file:
      - stack.env
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/metrics"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  telemetry:
    name: telemetry
    external: true
