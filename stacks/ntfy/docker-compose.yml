# ntfy – push notifications (HTTP pub/sub, Android/iOS app, optional auth).
# No host ports; access via Caddy (e.g. https://ntfy.yourdomain.com → ntfy:80).
# Uses only external ingress-admin network to avoid Docker address pool exhaustion.
services:
  ntfy:
    labels:
      logging: "true"
    image: binwiederhier/ntfy:latest@sha256:6ef4b819f722fccdc036af611c4774cfdc2de821ab74fdd48bbf4c9d6f8973da
    container_name: ntfy
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      - TZ=${TZ:-America/Denver}
      - NTFY_BASE_URL=${NTFY_BASE_URL:-}
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
    command: ["serve"]
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_config:/etc/ntfy
    networks:
      - telemetry
      - ingress-admin
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  telemetry:
    name: telemetry
    external: true
  ingress-admin:
    name: ingress-admin
    external: true

volumes:
  ntfy_cache:
  ntfy_config:
