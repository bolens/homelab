services:
  # Init container: fix volume ownership so rTorrent (uid 1001) can write.
  rtorrent-init:
    labels:
      logging: "true"
    image: alpine:latest@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: rtorrent-init
    restart: "no"
    user: root
    command: >
      sh -c "mkdir -p /data/session &&
      chown -R 1001:1001 /data /downloads &&
      echo 'Volume layout and ownership ready.'"
    volumes:
      - rtorrent_data:/data
      - torrents_manual:/downloads

  rtorrent:
    labels:
      logging: "true"
    build:
      context: .
      dockerfile: Dockerfile.rtorrent
    image: ${FLOOD_RTORRENT_IMAGE:-ghcr.io/bolens/homelab-flood-rtorrent:latest}
    container_name: rtorrent
    restart: unless-stopped
    cpus: 3.0
    mem_limit: 4g
    memswap_limit: 6g
    pids_limit: 768
    cpu_shares: 256
    user: "1001:1001"
    # Foreground ncurses needs a PTY.
    tty: true
    stdin_open: true
    environment:
      TERM: xterm
    depends_on:
      rtorrent-init:
        condition: service_completed_successfully
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    command: -n -o import=/home/download/rtorrent.rc
    volumes:
      - rtorrent_data:/home/download/.local/share/rtorrent
      - ./rtorrent.rc:/home/download/rtorrent.rc:ro
      - torrents_manual:/downloads
    networks:
      - torrents
    ports:
      - "49160:49160"
      - "49160:49160/udp"

  flood:
    labels:
      logging: "true"
    # :master is the upstream *dev* image (Node 24) and currently crashes on
    # createRequire(undefined). Use release tag for production.
    image: jesec/flood:latest@sha256:2e18f1fa2578082da70f8917bb733b1ee6593aaf9a79ded91f2890d82daca3c1
    container_name: flood
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1536m
    pids_limit: 256
    cpu_shares: 256
    user: "1001:1001"
    depends_on:
      - rtorrent
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    # No --rtorrent flag: connect to external rTorrent via socket.
    # Socket path = rTorrent's basedir default: basedir/rtorrent.sock
    command:
      - --rtsocket=/rtorrent_data/rtorrent.sock
      - --allowedpath=/downloads
      - --host=0.0.0.0
      - --port=3000
    volumes:
      - flood_data:/data
      - rtorrent_data:/rtorrent_data
      - torrents_manual:/downloads
    networks:
      - ingress-admin
      - torrents
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  ingress-admin:
    name: ingress-admin
    external: true
  torrents:
    name: torrents
    external: true

volumes:
  rtorrent_data:
  flood_data:
  torrents_manual:
    external: true
