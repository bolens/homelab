# Stoat – self-hosted chat platform (API, web app, media, voice).
# This stack follows the upstream `stoatchat/self-hosted` compose.yml but:
# - Does NOT publish any host ports (Caddy handles ingress).
# - Attaches Stoat's Caddy to `ingress-public` so the main Caddy can reverse-proxy to it.
#
# Upstream repo: https://github.com/stoatchat/self-hosted
# Docs: https://docs.stoat.dev/docs/installation
#
# Before first run, generate config in this directory (see README).

name: stoat

services:
  # MongoDB: database
  database:
    labels:
      logging: "true"
    image: docker.io/mongo
    container_name: stoat-database
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 384
    volumes:
      - stoat_db_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - stoat

  # Valkey: maintained Redis-compatible KV and message broker
  redis:
    labels:
      logging: "true"
    image: docker.io/valkey/valkey:9-alpine
    container_name: stoat-redis
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 256
    cpu_shares: 256
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - stoat

  # RabbitMQ: internal message broker
  rabbit:
    labels:
      logging: "true"
    image: docker.io/rabbitmq:4
    container_name: stoat-rabbit
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1536m
    pids_limit: 512
    cpu_shares: 384
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-rabbituser}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-rabbitpass}
    volumes:
      - stoat_rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - stoat

  # MinIO: S3-compatible storage (attachments, avatars, etc.)
  minio:
    labels:
      logging: "true"
    image: docker.io/minio/minio
    container_name: stoat-minio
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 384
    command: server /data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - stoat_minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioautumn}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioautumn}
      - MINIO_DOMAIN=minio
    networks:
      stoat:
        aliases:
          - revolt-uploads.minio
          # legacy support:
          - attachments.minio
          - avatars.minio
          - backgrounds.minio
          - icons.minio
          - banners.minio
          - emojis.minio

  # Stoat Caddy: internal web router (API, websockets, media, livekit).
  # No host ports; main Caddy reverse-proxies to this on `ingress-public`.
  stoat-caddy:
    labels:
      logging: "true"
    image: docker.io/caddy
    container_name: stoat-caddy
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1536m
    pids_limit: 512
    cpu_shares: 512
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:2019/config/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    env_file:
      - ${STOAT_CONFIG_DIR:-/home/youruser/.config/stoat}/.env.web
    volumes:
      - ${STOAT_CONFIG_DIR:-/home/youruser/.config/stoat}/Caddyfile:/etc/caddy/Caddyfile:ro
      - stoat_caddy_data:/data
      - stoat_caddy_config:/config
    networks:
      - stoat
      - ingress-public

  # API server
  api:
    labels:
      logging: "true"
    image: ghcr.io/stoatchat/api:v0.15.4
    container_name: stoat-api
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 384
    healthcheck:
      disable: true
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbit:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${STOAT_CONFIG_DIR:-/home/youruser/.config/stoat}/Revolt.toml
        target: /Revolt.toml
    networks:
      - stoat

  # Events service (websocket)
  events:
    labels:
      logging: "true"
    image: ghcr.io/stoatchat/events:v0.15.4
    container_name: stoat-events
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1536m
    pids_limit: 512
    cpu_shares: 384
    healthcheck:
      disable: true
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${STOAT_CONFIG_DIR:-/home/youruser/.config/stoat}/Revolt.toml
        target: /Revolt.toml
    networks:
      - stoat

  # File server (Autumn)
  autumn:
    labels:
      logging: "true"
    image: ghcr.io/stoatchat/file-server:v0.15.4
    container_name: stoat-autumn
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 256
    healthcheck:
      disable: true
    depends_on:
      database:
        condition: service_healthy
      createbuckets:
        condition: service_started
    volumes:
      - type: bind
        source: ${STOAT_CONFIG_DIR:-/home/youruser/.config/stoat}/Revolt.toml
        target: /Revolt.toml
    networks:
      - stoat

  # Metadata and image proxy (January)
  january:
    labels:
      logging: "true"
    image: ghcr.io/stoatchat/proxy:v0.15.4
    container_name: stoat-january
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1536m
    pids_limit: 256
    cpu_shares: 256
    healthcheck:
      disable: true
    volumes:
      - type: bind
        source: ${STOAT_CONFIG_DIR:-/home/youruser/.config/stoat}/Revolt.toml
        target: /Revolt.toml
    networks:
      - stoat

  # Tenor proxy
  gifbox:
    labels:
      logging: "true"
    image: ghcr.io/stoatchat/gifbox:v0.15.4
    container_name: stoat-gifbox
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1536m
    pids_limit: 256
    cpu_shares: 256
    healthcheck:
      disable: true
    volumes:
      - type: bind
        source: ${STOAT_CONFIG_DIR:-/home/youruser/.config/stoat}/Revolt.toml
        target: /Revolt.toml
    networks:
      - stoat

  # Regular task daemon
  crond:
    labels:
      logging: "true"
    image: ghcr.io/stoatchat/crond:v0.15.4
    container_name: stoat-crond
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1536m
    pids_limit: 256
    cpu_shares: 256
    healthcheck:
      disable: true
    depends_on:
      database:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - type: bind
        source: ${STOAT_CONFIG_DIR:-/home/youruser/.config/stoat}/Revolt.toml
        target: /Revolt.toml
    networks:
      - stoat

  # Push notification daemon
  pushd:
    labels:
      logging: "true"
    image: ghcr.io/stoatchat/pushd:v0.15.4
    container_name: stoat-pushd
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1536m
    pids_limit: 256
    cpu_shares: 256
    healthcheck:
      disable: true
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbit:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${STOAT_CONFIG_DIR:-/home/youruser/.config/stoat}/Revolt.toml
        target: /Revolt.toml
    networks:
      - stoat

  # Voice ingress daemon
  voice-ingress:
    labels:
      logging: "true"
    image: ghcr.io/stoatchat/voice-ingress:v0.15.4
    container_name: stoat-voice-ingress
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 384
    healthcheck:
      disable: true
    depends_on:
      database:
        condition: service_healthy
      rabbit:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${STOAT_CONFIG_DIR:-/home/youruser/.config/stoat}/Revolt.toml
        target: /Revolt.toml
    networks:
      - stoat

  # LiveKit – voice/video SFU.
  # NOTE: This stack does NOT publish 7881 or UDP 50000-50100 on the host.
  # Voice may require exposing those ports or additional tunnelling; see README.
  # Config is sourced from STOAT_CONFIG_DIR on the host (read-only).
  livekit:
    labels:
      logging: "true"
    image: ghcr.io/stoatchat/livekit-server:v1.9.14
    container_name: stoat-livekit
    restart: unless-stopped
    cpus: 4.0
    mem_limit: 4g
    memswap_limit: 6g
    pids_limit: 1024
    cpu_shares: 512
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7880 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: --config /etc/livekit-config/livekit.yml
    volumes:
      - ${STOAT_CONFIG_DIR:-/home/youruser/.config/stoat}/livekit.yml:/etc/livekit-config/livekit.yml:ro
    networks:
      - stoat

  # MinIO client: create buckets
  createbuckets:
    labels:
      logging: "true"
    image: docker.io/minio/mc
    container_name: stoat-createbuckets
    restart: "no"
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 384m
    pids_limit: 128
    cpu_shares: 128
    healthcheck:
      disable: true
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      while ! /usr/bin/mc ready minio; do
        /usr/bin/mc alias set minio http://minio:9000 minioautumn minioautumn;
        echo 'Waiting minio...' && sleep 1;
      done;
      /usr/bin/mc mb minio/revolt-uploads;
      exit 0;
      "
    networks:
      - stoat

  # Web App (frontend)
  web:
    labels:
      logging: "true"
    image: ghcr.io/stoatchat/for-web:addb6b7
    container_name: stoat-web
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1536m
    pids_limit: 256
    cpu_shares: 256
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    env_file:
      - ${STOAT_CONFIG_DIR:-/home/youruser/.config/stoat}/.env.web
    networks:
      - stoat

networks:
  stoat:
    driver: bridge
  ingress-public:
    name: ingress-public
    external: true

volumes:
  stoat_db_data:
  stoat_rabbit_data:
  stoat_minio_data:
  stoat_caddy_data:
  stoat_caddy_config:
