# Actual Budget – envelope-style budgeting (sync server).
# No host ports; access via Caddy (e.g. https://actual-budget.yourdomain.com → actual-budget:5006).
services:
  actual-budget:
    labels:
      logging: "true"
    image: actualbudget/actual-server:latest@sha256:06cf186569cf58d93e12659ff1a517b65b5b0ebee7050a3991d4bd8a1d398da6
    container_name: actual-budget
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1536m
    pids_limit: 256
    cpu_shares: 256
    env_file:
      - stack.env
    environment:
      - TZ=${TZ:-America/Denver}
    volumes:
      - actual_budget_data:/data
    networks:
      - ingress-sensitive
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5006/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  ingress-sensitive:
    name: ingress-sensitive
    external: true

volumes:
  actual_budget_data:
