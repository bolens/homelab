services:
  kali:
    labels:
      logging: "true"
    image: kalilinux/kali-rolling:latest@sha256:c6d78f57ebfdd9fec428a8b04f74876e66fddd08dfd328c076224a552e7332a3
    profiles: ["tools"]
    stdin_open: true
    tty: true
    cpus: 4.0
    mem_limit: 6g
    memswap_limit: 8g
    pids_limit: 2048
    cpu_shares: 256
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    volumes:
      - ${KALI_WORKSPACE_PATH:-${HOME}/security-lab/kali}:/workspace
    working_dir: /workspace
    command: ["bash"]
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "2"
