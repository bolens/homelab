services:
  syncthing:
    labels:
      logging: "true"
    image: syncthing/syncthing:latest@sha256:4d0281bdcb4ed9baf503d251d0544ddd856f49fce3f114056257ae172b7fb670
    container_name: syncthing
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    memswap_limit: 4g
    pids_limit: 512
    cpu_shares: 256
    env_file:
      - stack.env
    environment:
      - TZ=${TZ:-America/Denver}
    volumes:
      - syncthing_config:/var/syncthing/config
      # Bind-mount or named volumes for folders you want to sync; adjust as needed.
      - syncthing_data:/var/syncthing/data
    # The web UI is exposed through Caddy; peer and discovery traffic is direct.
    ports:
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    networks:
      - ingress-admin

networks:
  ingress-admin:
    name: ingress-admin
    external: true

volumes:
  syncthing_config:
  syncthing_data:
