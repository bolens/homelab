services:
  emby:
    image: lscr.io/linuxserver/emby:latest
    container_name: emby
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Denver}
    volumes:
      - emby_config:/config
      - "${EMBY_TV_PATH:-/mnt/unraid/media/tv}:/data/tv"
      - "${EMBY_MOVIES_PATH:-/mnt/unraid/media/movies}:/data/movies"
      - "${EMBY_MUSIC_PATH:-/mnt/unraid/media/music}:/data/music"
    networks:
      - monitor
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8096/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  monitor:
    name: monitor
    external: true

volumes:
  emby_config:
