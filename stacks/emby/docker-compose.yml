services:
  emby:
    labels:
      logging: "true"
    image: lscr.io/linuxserver/emby:latest@sha256:cddebc1cf3220fd73649331eae1d4412e90da4a73069782ea66fee9b3de2b6c4
    container_name: emby
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Denver}
    volumes:
      - emby_config:/config
      - "${EMBY_TV_PATH:-/mnt/unraid/media/tv}:/data/tv"
      - "${EMBY_MOVIES_PATH:-/mnt/unraid/media/movies}:/data/movies"
      - "${EMBY_MUSIC_PATH:-/mnt/unraid/media/music}:/data/music"
      - "${EMBY_AUDIOBOOKS_PATH:-/mnt/unraid/media/audiobooks}:/data/audiobooks:ro"
      - "${EMBY_BOOKS_PATH:-/mnt/unraid/media/kavita-books}:/data/books:ro"
    networks:
      - media-services
      - ingress-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8096/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  media-services:
    name: media-services
    external: true
  ingress-public:
    name: ingress-public
    external: true

volumes:
  emby_config:
