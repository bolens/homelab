services:
  explo:
    image: ghcr.io/lumepart/explo:latest@sha256:680eac0592d013aac8768e2c3bae02345f74083f3a4585337420446764eb66fc
    container_name: explo
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=true
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    volumes:
      # Explo expects a dotenv config at /opt/explo/.env.
      - ./stack.env:/opt/explo/.env:ro
      # Use the same host music library path Navidrome reads from.
      - "${MUSIC_LIBRARY_PATH:-/mnt/unraid/media/music}:/data"
      # Source path for completed slskd downloads (to migrate into /data).
      - "${SLSKD_DOWNLOADS_PATH:-/mnt/unraid/media/downloads/soulseek}:/slskd"
    networks:
      - default
      - media-services
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    driver: bridge
  media-services:
    name: media-services
    external: true
