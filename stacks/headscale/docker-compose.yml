# Headscale – self-hosted Tailscale control server. See https://headscale.net
# Config is bind-mounted from HEADSCALE_CONFIG_PATH; external monitor network for Caddy.
# Official docs: https://headscale.net/stable/setup/install/container/

name: headscale

services:
  headscale:
    container_name: headscale
    image: docker.io/headscale/headscale:latest
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1536m
    pids_limit: 256
    cpu_shares: 512
    read_only: true
    tmpfs:
      - /var/run/headscale
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    volumes:
      - ${HEADSCALE_CONFIG_PATH:?Set HEADSCALE_CONFIG_PATH in stack.env}:/etc/headscale/config.yaml:ro
      - headscale_data:/var/lib/headscale
    command: serve
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - monitor

networks:
  monitor:
    name: monitor
    external: true

volumes:
  headscale_data:
