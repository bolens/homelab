name: netboot.xyz
default_port: 3000
databases: []
health:
  endpoint: /
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: networking
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: netboot.yourdomain.com
data_profile:
  contains_pii: false
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://netboot.xyz
  docs: https://netboot.xyz/docs/
  repo: https://github.com/netbootxyz/netboot.xyz
backup:
  priority: low
  schedule_hint: manual
volumes:
  - name: netbootxyz_config
    role: config
    critical: true
  - name: netbootxyz_assets
    role: media
    critical: false
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: medium
  memory_profile: medium
  storage_profile: large
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
