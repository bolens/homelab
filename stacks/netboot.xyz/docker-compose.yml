services:
  netbootxyz:
    image: ghcr.io/netbootxyz/netbootxyz:latest
    container_name: netbootxyz
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 256
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      NGINX_PORT: "80"
      WEB_APP_PORT: "3000"
      PORT_RANGE: "30000:30010"
    volumes:
      - netbootxyz_config:/config
      - netbootxyz_assets:/assets
    ports:
      - "${NETBOOTXYZ_TFTP_PORT:-69}:69/udp"
      - "${NETBOOTXYZ_ASSET_PORT:-8080}:80"
      - "30000-30010:30000-30010/udp"
    networks:
      - monitor
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  monitor:
    name: monitor
    external: true

volumes:
  netbootxyz_assets:
  netbootxyz_config:
