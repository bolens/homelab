services:
  picard:
    image: jlesage/musicbrainz-picard:latest@sha256:a466259affae6a2434b6b33a734f4696fdc6f311a9c5b1cfab24bb5e0c8dff7c
    container_name: picard
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    memswap_limit: 4g
    pids_limit: 512
    cpu_shares: 256
    labels:
      - logging=true
      - logging_sampling=true
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    volumes:
      - picard_config:/config
      - "${PICARD_MEDIA_PATH:-/mnt/unraid/media}:/data"
    networks:
      - ingress-public
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5800/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ingress-public:
    name: ingress-public
    external: true

volumes:
  picard_config:
