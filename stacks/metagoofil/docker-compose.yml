name: metagoofil

# Metagoofil reaches Caddy's optional HTTP forward proxy over security-research.
# No upstream image; build from Dockerfile. Data: default ~/.config/metagoofil/data.
# Override with METAGOOFIL_DATA_PATH (e.g. in Portainer).

services:
  metagoofil:
    build:
      context: .
      args:
        METAGOOFIL_COMMIT: ${METAGOOFIL_COMMIT:-8d50624f1534e63c8bb64ee132d8c2298dba6724}
    image: ${METAGOOFIL_IMAGE:-metagoofil:latest}
    container_name: metagoofil
    restart: "no"
    env_file:
      - stack.env
    environment:
      - TZ=${TZ:-America/Denver}
    volumes:
      - ${METAGOOFIL_DATA_PATH:-${HOME}/.config/metagoofil/data}:/data
    networks:
      - security-research
    stdin_open: true
    tty: true

networks:
  security-research:
    name: security-research
    external: true
