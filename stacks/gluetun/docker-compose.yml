# Gluetun – outbound VPN client for other containers.
# Other stacks can use:  network_mode: service:gluetun
# No HTTP ports; Caddy does not front this stack.
# Start: docker compose up -d

name: gluetun

services:
  gluetun:
    labels:
      logging: "true"
    image: qmcgaw/gluetun:latest@sha256:2733bb22b27e3efa7a9f2cef9057ec12791b8b225793fcd3dbfd0508404dfc25
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - stack.env
    volumes:
      - gluetun_config:/gluetun
    restart: unless-stopped

volumes:
  gluetun_config: {}
