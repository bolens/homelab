# Gluetun – outbound VPN client for other containers.
# Other stacks can use:  network_mode: service:gluetun
# No HTTP ports; Caddy does not front this stack.
# Start: docker compose up -d

name: gluetun

services:
  gluetun:
    labels:
      logging: "true"
    image: qmcgaw/gluetun:latest@sha256:c2ee4191762fca6b6a3c3359a731198a95d9c9af4db32d466e223bf3a84e779b
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - stack.env
    volumes:
      - gluetun_config:/gluetun
    restart: unless-stopped

volumes:
  gluetun_config: {}
