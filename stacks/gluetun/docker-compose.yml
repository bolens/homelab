# Gluetun – outbound VPN client for other containers.
# Other stacks can use:  network_mode: service:gluetun
# No HTTP ports; Caddy does not front this stack.
# Start: docker compose up -d

name: gluetun

services:
  gluetun:
    labels:
      logging: "true"
    image: qmcgaw/gluetun:latest@sha256:e3272b29a4bc177b389fbdcb54cf9716ccbfc30f04d8b7a35b0a5be9cdb58461
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - stack.env
    volumes:
      - gluetun_config:/gluetun
    restart: unless-stopped

volumes:
  gluetun_config: {}
