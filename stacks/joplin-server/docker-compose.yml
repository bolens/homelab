services:
  postgres:
    image: postgres:18-alpine
    container_name: joplin-postgres
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 384
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-joplin}
      - POSTGRES_USER=${POSTGRES_USER:-joplin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - joplin_pg18_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-joplin} -d ${POSTGRES_DB:-joplin}"]
      interval: 5s
      timeout: 10s
      retries: 10

  joplin-server:
    image: joplin/server:latest@sha256:0877bfba41a943017c42c58e90db9d8d548bfe699b5e410248b5b879371734f9
    container_name: joplin-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - stack.env
    environment:
      - APP_PORT=22300
      - APP_BASE_URL=${APP_BASE_URL}
      - DB_CLIENT=pg
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DB:-joplin}
      - POSTGRES_USER=${POSTGRES_USER:-joplin}
      - POSTGRES_PORT=5432
      - POSTGRES_HOST=postgres
      - TZ=${TZ:-America/Denver}
    networks:
      - default
      - ingress-public
      - mail-clients

networks:
  ingress-public:
    name: ingress-public
    external: true
  mail-clients:
    name: mail-clients
    external: true

volumes:
  joplin_pg18_data:
