name: terminus
default_port: null
databases:
- postgres
- redis
health:
  endpoint: /
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: utility
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: terminus.yourdomain.com
data_profile:
  contains_pii: true
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: null
  docs: null
  repo: https://github.com/usetrmnl/terminus
backup:
  priority: high
  schedule_hint: weekly
volumes:
- name: terminus_pg_data
  role: app_data
  critical: true
- name: terminus_keyvalue_data
  role: app_data
  critical: true
- name: terminus_web_uploads
  role: app_data
  critical: true
- name: terminus-certificates
  role: app_data
  critical: true
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: large
  memory_profile: large
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
