services:
  tubearchivist:
    restart: unless-stopped
    labels: &id001
      logging: 'true'
    logging: &id002
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    pids_limit: 512
    image: bbilly1/tubearchivist:v0.6.0@sha256:0cbc18aa953c72ec7dfdd6f8fa7c2fe89b5d04489857d7baa354fecbd6181e69
    container_name: tubearchivist
    env_file:
    - stack.env
    environment:
      ES_URL: http://tubearchivist-es:9200
      REDIS_CON: redis://tubearchivist-redis:6379
      TA_HOST: ${TA_HOST:?set the complete browser origins}
      TA_USERNAME: ${TA_USERNAME:-admin}
      TA_PASSWORD: ${TA_PASSWORD:?set a unique application password}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set a unique Elasticsearch password}
    volumes:
    - tubearchivist_media:/youtube
    - tubearchivist_cache:/cache
    networks:
    - backend
    - ingress-sensitive
    depends_on:
      tubearchivist-es:
        condition: service_healthy
      tubearchivist-redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8000/api/health/
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 2g
    cpus: '2.00'
  tubearchivist-redis:
    restart: unless-stopped
    labels: *id001
    logging: *id002
    pids_limit: 512
    image: redis:8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    container_name: tubearchivist-redis
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - tubearchivist_redis:/data
    networks:
    - backend
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    mem_limit: 256m
    cpus: '0.50'
  tubearchivist-es:
    restart: unless-stopped
    labels: *id001
    logging: *id002
    pids_limit: 512
    image: bbilly1/tubearchivist-es:9.5.5@sha256:9513a22cd332402cb6fd6ef69844f4f78717190ba9e2e08cb72b3288839d84fa
    container_name: tubearchivist-es
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set a unique Elasticsearch password}
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      xpack.security.enabled: 'true'
      discovery.type: single-node
      path.repo: /usr/share/elasticsearch/data/snapshot
    volumes:
    - tubearchivist_es:/usr/share/elasticsearch/data
    networks:
    - backend
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
      - CMD-SHELL
      # Runtime environment expansion only; no credential value is committed.
      - curl -fsS -u "elastic:$$ELASTIC_PASSWORD" "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null # gitleaks:allow
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 3g
    cpus: '2.00'
networks:
  backend:
    internal: true
  ingress-sensitive:
    name: ingress-sensitive
    external: true
volumes:
  tubearchivist_media: {}
  tubearchivist_cache: {}
  tubearchivist_redis: {}
  tubearchivist_es: {}
