services:
  wallos:
    image: bellamy/wallos:5.11.1@sha256:182d4be4dae26834cc5cec3686bb142e78b0a139a0eb1059355d061d8c0de3e5
    container_name: wallos
    restart: unless-stopped
    env_file:
    - stack.env
    labels:
      logging: 'true'
    volumes:
    - wallos_db:/var/www/html/db
    - wallos_logos:/var/www/html/images/uploads/logos
    networks:
    - ingress-sensitive
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1/health.php
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
networks:
  ingress-sensitive:
    name: ingress-sensitive
    external: true
volumes:
  wallos_db: {}
  wallos_logos: {}
