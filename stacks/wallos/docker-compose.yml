services:
  wallos:
    image: bellamy/wallos:5.10.4@sha256:78b73a32ae24bcca67d6f4b96ca76fe29ee8da5e8df1769df1e612a4e776c904
    container_name: wallos
    restart: unless-stopped
    env_file:
    - stack.env
    labels:
      logging: 'true'
    volumes:
    - wallos_db:/var/www/html/db
    - wallos_logos:/var/www/html/images/uploads/logos
    networks:
    - ingress-sensitive
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1/health.php
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
networks:
  ingress-sensitive:
    name: ingress-sensitive
    external: true
volumes:
  wallos_db: {}
  wallos_logos: {}
