services:
  openspeedtest:
    image: openspeedtest/latest:latest
    container_name: openspeedtest
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 1g
    memswap_limit: 1536m
    pids_limit: 256
    cpu_shares: 256
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    networks:
      - monitor
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  monitor:
    name: monitor
    external: true
