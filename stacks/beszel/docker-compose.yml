services:
  beszel:
    image: henrygd/beszel:latest@sha256:8514a69d9bbbcb74f371a3205561ee231fc0289739cea64e8131f341d695b770
    container_name: beszel
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=false
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    # No host port: access via Caddy (beszel.home / beszel.example.com on ingress-admin network)
    environment:
      APP_URL: ${BESZEL_APP_URL}
    volumes:
      - ${BESZEL_DATA_DIR:-${HOME}/.local/share/beszel}:/beszel_data
    networks:
      - ingress-admin
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://127.0.0.1:8090"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 15s

    mem_limit: 512m
    cpus: "0.50"

networks:
  ingress-admin:
    name: ingress-admin
    external: true
