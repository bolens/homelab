# Audiobookshelf – self-hosted podcasts (and audiobooks). See https://www.audiobookshelf.org/
# App state stays in local named volumes; media comes from the shared host tree.
# Official example: https://github.com/advplyr/audiobookshelf/blob/master/docker-compose.yml
services:
  audiobookshelf:
    labels:
      logging: "true"
    container_name: audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:latest@sha256:3528a93b6442ffe54bd46771bbbab7c97084e1101071586d9dc2254f30bb4358
    env_file:
      - stack.env
    volumes:
      - abs_config:/config
      - abs_metadata:/metadata
      - "${AUDIOBOOKSHELF_AUDIOBOOKS_PATH:-/mnt/unraid/media/audiobooks}:/audiobooks:ro"
      - abs_podcasts:/podcasts
    restart: unless-stopped
    networks:
      - ingress-public
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:80/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  ingress-public:
    name: ingress-public
    external: true

volumes:
  abs_config:
  abs_metadata:
  abs_podcasts:
