# Audiobookshelf – self-hosted podcasts (and audiobooks). See https://www.audiobookshelf.org/
# Portainer-friendly: named volumes and dedicated Caddy ingress network.
# Official example: https://github.com/advplyr/audiobookshelf/blob/master/docker-compose.yml
services:
  audiobookshelf:
    labels:
      logging: "true"
    container_name: audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:latest@sha256:180acad33d69c99ed208676465d8edcb268fa46967735579a7810859885b1a8e
    env_file:
      - stack.env
    volumes:
      - abs_config:/config
      - abs_metadata:/metadata
      - abs_audiobooks:/audiobooks
      - abs_podcasts:/podcasts
    restart: unless-stopped
    networks:
      - ingress-public
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:80/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  ingress-public:
    name: ingress-public
    external: true

volumes:
  abs_config:
  abs_metadata:
  abs_audiobooks:
  abs_podcasts:
