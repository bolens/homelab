# OWASP ZAP (Zed Attack Proxy) – web/API security scanner (Webswing UI + proxy/API).
# No host ports: access via Caddy (reverse_proxy zap:8080 on ingress-admin network).
# Docs: https://www.zaproxy.org/docs/  |  Docker: https://github.com/zaproxy/zaproxy/blob/main/docker/README.md
#
# Start:  docker compose up -d
# Use:    Open https://zap.home (or your Caddy host) for the ZAP UI; run baseline/active scans against your apps.

services:
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: zed-attack-proxy
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=false
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    command: zap-webswing.sh
    environment: []
    networks:
      - security-research
      - ingress-admin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 45s

    mem_limit: 1g
    cpus: 1.0

# volumes:
#   zap-data:

networks:
  security-research:
    name: security-research
    external: true
  ingress-admin:
    name: ingress-admin
    external: true
