# Unified media bind mount: READARR_MEDIA_PATH in stack.env.
#   docker compose --env-file stack.env up -d
services:
  readarr:
    labels:
      logging: "true"
    # Hardcover metadata is incompatible with existing Readarr databases.
    image: ghcr.io/pennydreadful/bookshelf:hardcover-v0.4.20.129
    container_name: readarr
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    memswap_limit: 4g
    pids_limit: 512
    cpu_shares: 256
    env_file:
      - stack.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Denver}
      - METADATA_URL=http://rreading-glasses:8788
    volumes:
      - bookshelf_config:/config
      - "${READARR_MEDIA_PATH:-/mnt/unraid/media}:/data"
    networks:
      - media-automation
      - ingress-admin
      - usenet
      - torrents
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8787/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  rreading-glasses:
    labels:
      logging: "true"
    image: readarr-rreading-glasses:hardcover-compatible
    build:
      context: .
      dockerfile: rreading-glasses.Dockerfile
    container_name: rreading-glasses
    restart: unless-stopped
    depends_on:
      rreading-glasses-db:
        condition: service_healthy
    entrypoint: ["/main", "serve"]
    cpus: 1.0
    mem_limit: 256m
    memswap_limit: 512m
    pids_limit: 256
    environment:
      HARDCOVER_AUTH: ${HARDCOVER_AUTH:?Set HARDCOVER_AUTH in stack.env}
      POSTGRES_HOST: rreading-glasses-db
      POSTGRES_DATABASE: rreading-glasses
      POSTGRES_USER: rreading-glasses
      POSTGRES_PASSWORD: ${RREADING_GLASSES_POSTGRES_PASSWORD:?Set RREADING_GLASSES_POSTGRES_PASSWORD in stack.env}
    networks:
      - media-automation

  rreading-glasses-db:
    labels:
      logging: "true"
    image: postgres:18
    container_name: rreading-glasses-db
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 1g
    pids_limit: 256
    environment:
      POSTGRES_DB: rreading-glasses
      POSTGRES_USER: rreading-glasses
      POSTGRES_PASSWORD: ${RREADING_GLASSES_POSTGRES_PASSWORD:?Set RREADING_GLASSES_POSTGRES_PASSWORD in stack.env}
    volumes:
      - rreading_glasses_data:/var/lib/postgresql/data
    networks:
      - media-automation
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rreading-glasses -d rreading-glasses"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  media-automation:
    name: media-automation
    external: true
  ingress-admin:
    name: ingress-admin
    external: true
  usenet:
    name: usenet
    external: true
  torrents:
    name: torrents
    external: true

volumes:
  bookshelf_config:
  rreading_glasses_data:
