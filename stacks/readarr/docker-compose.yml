# Bind mounts: READARR_*_PATH in stack.env. For compose volume substitution use:
#   docker compose --env-file stack.env up -d
services:
  readarr:
    # `nightly` currently has no amd64 manifest; pin a tagged nightly that does.
    image: lscr.io/linuxserver/readarr:0.4.19-nightly
    container_name: readarr
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    memswap_limit: 4g
    pids_limit: 512
    cpu_shares: 256
    env_file:
      - stack.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Denver}
    volumes:
      - readarr_config:/config
      - "${READARR_BOOKS_PATH:-/mnt/unraid/media/books}:/books"
      - "${READARR_USENET_DOWNLOADS_PATH:-/mnt/unraid/media/downloads/usenet}:/downloads"
      - torrents_downloads:/torrents
    networks:
      - monitor
      - usenet
      - torrents
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8787/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  monitor:
    name: monitor
    external: true
  usenet:
    name: usenet
    external: true
  torrents:
    name: torrents
    external: true

volumes:
  readarr_config:
  torrents_downloads:
    external: true
