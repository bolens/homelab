# Unified media bind mount: READARR_MEDIA_PATH in stack.env.
#   docker compose --env-file stack.env up -d
services:
  readarr:
    # `nightly` currently has no amd64 manifest; pin a tagged nightly that does.
    image: lscr.io/linuxserver/readarr:0.4.18-nightly
    container_name: readarr
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    memswap_limit: 4g
    pids_limit: 512
    cpu_shares: 256
    env_file:
      - stack.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Denver}
    volumes:
      - readarr_config:/config
      - "${READARR_MEDIA_PATH:-/mnt/unraid/media}:/data"
    networks:
      - monitor
      - usenet
      - torrents
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8787/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  monitor:
    name: monitor
    external: true
  usenet:
    name: usenet
    external: true
  torrents:
    name: torrents
    external: true

volumes:
  readarr_config:
