# Baserow – self-hosted Airtable/Notion-like database (tables, views, API).
# No host ports; access via Caddy (e.g. https://baserow.yourdomain.com → baserow:80).
# Uses Baserow's embedded PostgreSQL database.
services:
  baserow:
    image: baserow/baserow:latest@sha256:41adb3493379403946a493f30873f743bb65b19b5f387d630ec75f41e25d5b5b
    container_name: baserow
    restart: unless-stopped
    # Allow Celery and the embedded PostgreSQL server to shut down cleanly.
    stop_grace_period: 2m
    cpus: 3.0
    mem_limit: 6g
    memswap_limit: 8g
    pids_limit: 1024
    cpu_shares: 384
    env_file:
      - stack.env
    environment:
      - BASEROW_PUBLIC_URL=${BASEROW_PUBLIC_URL}
      - TZ=${TZ:-America/Denver}
    volumes:
      - baserow_data:/baserow/data
    networks:
      - ingress-public
    healthcheck:
      test: ["CMD", "/bin/bash", "/baserow/backend/docker/docker-entrypoint.sh", "backend-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  ingress-public:
    name: ingress-public
    external: true

volumes:
  baserow_data:
