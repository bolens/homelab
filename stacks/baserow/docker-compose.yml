# Baserow – self-hosted Airtable/Notion-like database (tables, views, API).
# No host ports; access via Caddy (e.g. https://baserow.yourdomain.com → baserow:80).
# Uses embedded database (SQLite) for simplicity; for production consider Postgres (see upstream docs).
services:
  baserow:
    image: baserow/baserow:latest
    container_name: baserow
    restart: unless-stopped
    cpus: 3.0
    mem_limit: 6g
    memswap_limit: 8g
    pids_limit: 1024
    cpu_shares: 384
    env_file:
      - stack.env
    environment:
      - BASEROW_PUBLIC_URL=${BASEROW_PUBLIC_URL}
      - TZ=${TZ:-America/Denver}
    volumes:
      - baserow_data:/baserow/data
    networks:
      - proxy-ingress
    healthcheck:
      test: ["CMD", "/bin/bash", "/baserow/backend/docker/docker-entrypoint.sh", "backend-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  proxy-ingress:
    name: proxy-ingress
    external: true

volumes:
  baserow_data:
