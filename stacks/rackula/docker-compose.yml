services:
  rackula:
    labels:
      logging: "true"
    build:
      context: .
    image: ${RACKULA_IMAGE:-ghcr.io/bolens/homelab-rackula:latest}
    profiles: ["tools"]
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 128
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    volumes:
      - ${RACKULA_SOURCE_PATH:-${HOME}/dev/rackula-source}:/source:ro
      - ${RACKULA_OUTPUT_PATH:-${HOME}/dev/rackula-output}:/output
    working_dir: /source
    command: ["--help"]
    network_mode: none
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "2"
