name: dawarich
default_port: 3000
databases:
- postgres
- redis
health:
  endpoint: /api/v1/health
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: productivity
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: dawarich.example.com
data_profile:
  contains_pii: true
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://dawarich.app/
  docs: https://dawarich.app/docs/
  repo: https://github.com/Freika/dawarich
backup:
  priority: medium
  schedule_hint: weekly
volumes:
- name: dawarich_public
  role: app_data
  critical: true
- name: dawarich_watched
  role: app_data
  critical: true
- name: dawarich_storage
  role: app_data
  critical: true
- name: dawarich_db
  role: database
  critical: true
- name: dawarich_redis
  role: app_data
  critical: true
auth:
  mode: app_local
  sso_provider: null
  access_policy: app_auth
resources:
  cpu_profile: small
  memory_profile: large
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
runtime_security:
  privileged_services: []
  host_network_services: []
  docker_socket_services: []
  floating_image_services: []
