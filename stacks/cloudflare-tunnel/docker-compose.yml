services:
  cloudflared:
    labels:
      logging: "true"
    image: cloudflare/cloudflared:latest@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
    container_name: cloudflare-tunnel
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 256
    cpu_shares: 512
    command: tunnel run
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    networks:
      - edge-services
    # Alternative: use config file instead of token (uncomment if preferred)
    # volumes:
    #   - ./config.yml:/etc/cloudflared/config.yml
    # command: tunnel --config /etc/cloudflared/config.yml run

networks:
  edge-services:
    name: edge-services
    external: true

volumes: {}
