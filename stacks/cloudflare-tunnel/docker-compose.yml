services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel run
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    networks:
      - monitor
    # Alternative: use config file instead of token (uncomment if preferred)
    # volumes:
    #   - ./config.yml:/etc/cloudflared/config.yml
    # command: tunnel --config /etc/cloudflared/config.yml run

networks:
  monitor:
    name: monitor
    external: true

volumes: {}
