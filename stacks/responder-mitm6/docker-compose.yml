services:
  responder-mitm6:
    labels:
      logging: "true"
    build:
      context: .
    image: ${RESPONDER_MITM6_IMAGE:-ghcr.io/bolens/homelab-responder-mitm6:latest}
    profiles: ["tools"]
    stdin_open: true
    tty: true
    network_mode: host
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 128
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    volumes:
      - ${RESPONDER_OUTPUT_PATH:-${HOME}/security-lab/responder-mitm6}:/workspace
    working_dir: /workspace
    command: ["bash"]
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "2"
