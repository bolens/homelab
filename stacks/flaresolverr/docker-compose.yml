# FlareSolverr – HTTP API proxy that solves Cloudflare / DDoS-GUARD challenges (Chrome/Selenium).
# No host ports; *arr applications reach FlareSolverr on `media-automation`.
# Heavy RAM when busy (each request may spawn a browser). See stack README.
services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
    container_name: flaresolverr
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=false
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    volumes:
      - flaresolverr_config:/config
    networks:
      - media-automation
      - ingress-sensitive
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

    mem_limit: 2g
    cpus: "1.0"

networks:
  media-automation:
    name: media-automation
    external: true
  ingress-sensitive:
    name: ingress-sensitive
    external: true

volumes:
  flaresolverr_config:
