# Unified media bind mount: LIDARR_MEDIA_PATH in stack.env.
#   docker compose --env-file stack.env up -d
services:
  lidarr:
    labels:
      logging: "true"
    image: homelab/lidarr:3.1.0.4875-null-metadata-guards.4
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lidarr
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    memswap_limit: 4g
    pids_limit: 512
    cpu_shares: 256
    env_file:
      - stack.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Denver}
    volumes:
      - lidarr_config:/config
      - "${LIDARR_MEDIA_PATH:-/mnt/unraid/media}:/data"
    networks:
      - media-automation
      - ingress-admin
      - usenet
      - torrents
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8686/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  media-automation:
    name: media-automation
    external: true
  ingress-admin:
    name: ingress-admin
    external: true
  usenet:
    name: usenet
    external: true
  torrents:
    name: torrents
    external: true

volumes:
  lidarr_config:
