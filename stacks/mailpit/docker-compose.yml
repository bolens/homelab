# Mailpit – local SMTP catcher for dev/testing.
# Receives mail on port 1025; web UI on 8025. No external delivery.
# Use with Postfix: set RELAYHOST=mailpit:1025 for internal-only mailing.
# Image docs: https://mailpit.axllent.org/docs/install/docker/

services:
  mailpit:
    labels:
      logging: "true"
    image: axllent/mailpit:latest@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    container_name: mailpit
    restart: unless-stopped
    env_file:
      - stack.env
    networks:
      - mail-clients
      - ingress-admin
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  mail-clients:
    name: mail-clients
    external: true
  ingress-admin:
    name: ingress-admin
    external: true
