# Mailpit – local SMTP catcher for dev/testing.
# Receives mail on port 1025; web UI on 8025. No external delivery.
# Use with Postfix: set RELAYHOST=mailpit:1025 for internal-only mailing.
# Image docs: https://mailpit.axllent.org/docs/install/docker/

services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    env_file:
      - stack.env
    networks:
      - mail-services
      - proxy-ingress
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  mail-services:
    name: mail-services
    external: true
  proxy-ingress:
    name: proxy-ingress
    external: true
