services:
  gitlab-runner:
    labels:
      logging: "true"
    image: gitlab/gitlab-runner:latest@sha256:77d03a5c881ff8f97381de4f96a66c080733eeab9c9cf502bd19916a18969113
    container_name: gitlab-runner
    restart: unless-stopped
    cpus: 4.0
    mem_limit: 6g
    memswap_limit: 8g
    pids_limit: 2048
    cpu_shares: 512
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    volumes:
      - gitlab_runner_config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  gitlab_runner_config:
