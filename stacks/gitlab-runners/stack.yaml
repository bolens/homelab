name: gitlab-runners
default_port: null
databases: []
health:
  endpoint: /
  internal_only: true
monitoring:
  prometheus: false
  uptime_kuma:
    external: false
    internal: false
  blackbox_exporter: false
  grafana_dashboard: false
shared_resources: []
type: service
category: dev
exposure:
  behind_caddy: false
  public_by_default: false
  recommended_hostname: null
data_profile:
  contains_pii: true
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://docs.gitlab.com/runner/
  docs: https://docs.gitlab.com/runner/install/docker.html
  repo: https://github.com/gitlabhq/gitlab-runner
backup:
  priority: low
  schedule_hint: manual
volumes:
  - name: gitlab_runner_config
    role: config
    critical: true
auth:
  mode: none
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: large
  memory_profile: large
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
