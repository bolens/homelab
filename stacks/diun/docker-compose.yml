# Diun – Docker image update notifier. No web UI; notifications via Telegram, Discord, etc.
# Portainer-friendly: named volume; env from stack.env (see stack.env.example).
services:
  diun-docker-socket-proxy:
    labels:
      logging: "false"
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    container_name: diun-docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      INFO: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  diun:
    labels:
      logging: "false"
    image: crazymax/diun:latest@sha256:e324b793eb32dfb7f74d3a39421ebf090141caaadee69b8f78da63112408ee25
    container_name: diun
    env_file:
      - stack.env
    command: serve
    restart: unless-stopped
    volumes:
      - diun_data:/data
    environment:
      - TZ=America/Denver
      - LANG=en_US.UTF-8
      - LC_ALL=en_US.UTF-8
      - LC_CTYPE=en_US.UTF-8
      - DIUN_WATCH_WORKERS=10
      - DIUN_WATCH_SCHEDULE=0 */6 * * *
      - DIUN_WATCH_JITTER=30s
      - DIUN_WATCH_RUNONSTARTUP=true
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_ENDPOINT=tcp://diun-docker-socket-proxy:2375
      # Notifiers are enabled only when their variables are present in stack.env.

    depends_on:
      diun-docker-socket-proxy:
        condition: service_healthy
    networks:
      - docker-api
      - mail-clients
      - telemetry
    healthcheck:
      test: ["CMD", "diun", "healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  docker-api:
    internal: true
  mail-clients:
    name: mail-clients
    external: true
  telemetry:
    name: telemetry
    external: true

volumes:
  diun_data: {}
