services:
  calcom-db:
    image: postgres:18-alpine
    container_name: calcom-db
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 384
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    environment:
      PGDATA: /var/lib/postgresql/data
    volumes:
      - calcom_pg18_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d \"$${DATABASE_URL}\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  calcom-redis:
    image: redis:7-alpine
    container_name: calcom-redis
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 256
    cpu_shares: 256
    volumes:
      - calcom_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  calcom:
    image: calcom/cal.com:latest
    container_name: calcom
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 4g
    memswap_limit: 6g
    pids_limit: 768
    cpu_shares: 384
    depends_on:
      calcom-db:
        condition: service_healthy
      calcom-redis:
        condition: service_healthy
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    entrypoint: ["docker-entrypoint.sh"]
    command: ["/bin/sh", "/calcom/scripts/homelab-entrypoint.sh"]
    volumes:
      - ./homelab-entrypoint.sh:/calcom/scripts/homelab-entrypoint.sh
    networks:
      - default
      - proxy-ingress
      - mail-services
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  proxy-ingress:
    name: proxy-ingress
    external: true
  mail-services:
    name: mail-services
    external: true

volumes:
  calcom_pg18_data:
    name: calcom_calcom_pg18_data
    external: true
  calcom_redis_data:
    name: calcom_calcom_redis_data
    external: true
