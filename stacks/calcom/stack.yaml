name: calcom
default_port: 3000
databases:
- postgres
- redis
health:
  endpoint: /
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: utility
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: calcom.yourdomain.com
data_profile:
  contains_pii: true
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: null
  docs: null
  repo: null
backup:
  priority: high
  schedule_hint: weekly
volumes:
- name: calcom_calcom_pg18_data
  role: database
  critical: true
  external: true
- name: calcom_calcom_redis_data
  role: cache
  critical: true
  external: true
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: medium
  memory_profile: medium
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
runtime_security:
  privileged_services: []
  host_network_services: []
  docker_socket_services: []
  floating_image_services: []
