services:
  db:
    labels:
      logging: "true"
    image: mariadb:12.3
    container_name: seafile-mariadb
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_LOG_CONSOLE=true
      - MYSQL_DATABASE=${SEAFILE_DB_NAME:-seafile}
      - MYSQL_USER=${SEAFILE_DB_USER:-seafile}
      - MYSQL_PASSWORD=${SEAFILE_DB_PASSWORD}
    volumes:
      - seafile_db12:/var/lib/mysql
    networks:
      - default
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  memcached:
    labels:
      logging: "true"
    image: memcached:alpine
    container_name: seafile-memcached
    restart: unless-stopped
    networks:
      - default

  seafile:
    labels:
      logging: "true"
    image: seafileltd/seafile-mc:13.0-latest
    container_name: seafile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_started
    env_file:
      - stack.env
    environment:
      - DB_HOST=db
      - DB_ROOT_PASSWD=${MYSQL_ROOT_PASSWORD}
      - SEAFILE_DB_NAME=${SEAFILE_DB_NAME:-seafile}
      - SEAFILE_DB_USER=${SEAFILE_DB_USER:-seafile}
      - SEAFILE_DB_PASSWORD=${SEAFILE_DB_PASSWORD}
      # Seafile 12+ environment names.
      - SEAFILE_MYSQL_DB_HOST=db
      - SEAFILE_MYSQL_DB_PORT=3306
      - SEAFILE_MYSQL_DB_USER=${SEAFILE_DB_USER:-seafile}
      - SEAFILE_MYSQL_DB_PASSWORD=${SEAFILE_DB_PASSWORD}
      - SEAFILE_MYSQL_DB_CCNET_DB_NAME=ccnet_db
      - SEAFILE_MYSQL_DB_SEAFILE_DB_NAME=seafile_db
      - SEAFILE_MYSQL_DB_SEAHUB_DB_NAME=seahub_db
      - INIT_SEAFILE_MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - SEAFILE_SERVER_HOSTNAME=${SEAFILE_SERVER_HOSTNAME}
      - TIME_ZONE=${TIME_ZONE:-America/Denver}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - CACHE_PROVIDER=memcached
      - MEMCACHED_HOST=memcached
      - MEMCACHED_PORT=11211
    volumes:
      - seafile_data:/shared
    networks:
      - default
      - ingress-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  ingress-public:
    name: ingress-public
    external: true

volumes:
  seafile_db12:
  seafile_data:
