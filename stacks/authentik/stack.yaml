name: authentik
default_port: null
databases:
- postgres
- redis
health:
  endpoint: /
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: monitoring
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: authentik.yourdomain.com
data_profile:
  contains_pii: true
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://goauthentik.io/
  docs: https://goauthentik.io/docs/
  repo: null
backup:
  priority: high
  schedule_hint: weekly
volumes:
- name: authentik_pg18_data
  role: app_data
  critical: true
- name: authentik_media
  role: app_data
  critical: true
- name: authentik_templates
  role: app_data
  critical: true
auth:
  mode: sso_only
  sso_provider: authentik
  access_policy: access_full_site
resources:
  cpu_profile: medium
  memory_profile: medium
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: monitoring
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
runtime_security:
  privileged_services: []
  host_network_services: []
  docker_socket_services:
  - worker
  floating_image_services: []
