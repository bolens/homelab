services:
  postgres:
    image: postgres:18-alpine
    container_name: authentik-postgres
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 384
    environment:
      - POSTGRES_DB=${PG_DB:-authentik}
      - POSTGRES_USER=${PG_USER:-authentik}
      - POSTGRES_PASSWORD=${PG_PASS}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - authentik_pg18_data:/var/lib/postgresql/data
    networks:
      - authentik
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-authentik} -d ${PG_DB:-authentik}"]
      interval: 5s
      timeout: 10s
      retries: 10

  redis:
    image: redis:alpine
    container_name: authentik-redis
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 256
    cpu_shares: 256
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - authentik

  server:
    image: ghcr.io/goauthentik/server:latest
    container_name: authentik-server
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    memswap_limit: 4g
    pids_limit: 512
    cpu_shares: 384
    command: ["server"]
    env_file:
      - stack.env
    environment:
      - AUTHENTIK_POSTGRESQL__NAME=${PG_DB:-authentik}
      - AUTHENTIK_POSTGRESQL__USER=${PG_USER:-authentik}
      - AUTHENTIK_POSTGRESQL__PASSWORD=${PG_PASS}
      - TZ=${TZ:-America/Denver}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
    networks:
      - authentik
      - proxy-ingress
      - mail-services

  worker:
    image: ghcr.io/goauthentik/server:latest
    container_name: authentik-worker
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    memswap_limit: 4g
    pids_limit: 512
    cpu_shares: 256
    command: ["worker"]
    env_file:
      - stack.env
    environment:
      - AUTHENTIK_POSTGRESQL__NAME=${PG_DB:-authentik}
      - AUTHENTIK_POSTGRESQL__USER=${PG_USER:-authentik}
      - AUTHENTIK_POSTGRESQL__PASSWORD=${PG_PASS}
      - TZ=${TZ:-America/Denver}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - authentik_media:/media
      - authentik_templates:/templates
    networks:
      - authentik
      - mail-services

networks:
  authentik:
    driver: bridge
  proxy-ingress:
    name: proxy-ingress
    external: true
  mail-services:
    name: mail-services
    external: true

volumes:
  authentik_pg18_data:
  authentik_media:
  authentik_templates:
