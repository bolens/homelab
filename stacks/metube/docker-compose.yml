# MeTube – self-hosted YouTube/yt-dlp web UI.
# Image docs: https://github.com/alexta69/metube

name: metube

services:
  metube-init:
    labels:
      logging: "true"
    image: ghcr.io/alexta69/metube:latest@sha256:397778fccf13d83adf9325fe813b260617a082d1772aff6d678c5b9256dd01fb
    container_name: metube-init
    user: "${PUID:-1000}:${PGID:-1000}"
    network_mode: none
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /downloads/audio /downloads/.metube /downloads/tmp"]
    restart: "no"
    healthcheck:
      disable: true
    volumes:
      - type: bind
        source: ${METUBE_DOWNLOADS_PATH:-/mnt/unraid/media/downloads/metube}
        target: /downloads
        bind:
          create_host_path: false

  metube:
    labels:
      logging: "true"
    image: ghcr.io/alexta69/metube:latest@sha256:397778fccf13d83adf9325fe813b260617a082d1772aff6d678c5b9256dd01fb
    container_name: metube
    restart: unless-stopped
    depends_on:
      metube-init:
        condition: service_completed_successfully
    env_file:
      - stack.env
    environment:
      - TZ=${TZ:-America/Denver}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - UMASK=${UMASK:-022}
    volumes:
      # Main download directory (videos, audio, state, temp files).
      - type: bind
        source: ${METUBE_DOWNLOADS_PATH:-/mnt/unraid/media/downloads/metube}
        target: /downloads
        bind:
          create_host_path: false
    networks:
      - ingress-public
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  ingress-public:
    name: ingress-public
    external: true
