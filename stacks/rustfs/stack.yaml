name: rustfs
default_port: 9000
databases: []
health:
  endpoint: /health
  internal_only: true
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: api
category: storage
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: s3.yourdomain.com
data_profile:
  contains_pii: true
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://rustfs.com
  docs: https://docs.rustfs.com/installation/docker/
  repo: https://github.com/rustfs/rustfs
backup:
  priority: high
  schedule_hint: daily
volumes:
  - name: rustfs_data
    role: app_data
    critical: true
  - name: rustfs_logs
    role: logs
    critical: false
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: large
  memory_profile: large
  storage_profile: large
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
