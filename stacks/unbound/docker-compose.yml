services:
  unbound:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${UNBOUND_IMAGE:-ghcr.io/bolens/homelab-unbound:latest}
    container_name: unbound
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=false
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    volumes:
      - unbound_data:/opt/unbound/etc/unbound
    networks:
      - dns-services
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 128m
    cpus: '0.25'
    # unbound-control needs control-enable: yes + remote-control in unbound.conf; this image ships with control disabled.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          dns_reply="$$(dig +time=5 +tries=1 +dnssec +noall +comments +answer @127.0.0.1 cloudflare.com A)" &&
          printf '%s\n' "$$dns_reply" | grep -Eq 'status: NOERROR,' &&
          printf '%s\n' "$$dns_reply" | grep -Eq 'flags:.* ad[; ]' &&
          printf '%s\n' "$$dns_reply" | grep -Eq '[[:space:]]IN[[:space:]]+A[[:space:]]'
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  unbound_data: {}

networks:
  dns-services:
    name: dns-services
    external: true
