services:
  ombi:
    labels:
      logging: "true"
    image: lscr.io/linuxserver/ombi:latest@sha256:ea8248433a3d37eaf46a59e4cb5160814d35a5b5ba35eac47a5018747acf2632
    container_name: ombi
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 1536m
    memswap_limit: 2g
    pids_limit: 256
    cpu_shares: 256
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    volumes:
      - ombi_config:/config
    networks:
      - ingress-public
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3579/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  ingress-public:
    name: ingress-public
    external: true

volumes:
  ombi_config:
