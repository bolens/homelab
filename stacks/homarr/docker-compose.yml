# Homarr 1.x – homelab dashboard (links, widgets, optional integrations).
# No host ports; access via Caddy (https://homarr.example.com → homarr:7575).
services:
  homarr-docker-socket-proxy:
    labels:
      logging: "false"
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    container_name: homarr-docker-socket-proxy
    restart: unless-stopped
    environment:
      ALLOW_RESTARTS: "1"
      ALLOW_START: "1"
      ALLOW_STOP: "1"
      CONTAINERS: "1"
      EVENTS: "1"
      IMAGES: "1"
      INFO: "1"
      PING: "1"
      POST: "1"
      VERSION: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  homarr:
    labels:
      logging: "false"
    image: ghcr.io/homarr-labs/homarr:latest@sha256:72f98c87dbd556736a3f25f7d19fefa77a7e48eb76c4d7929e5535f7e3c0fdd0
    container_name: homarr
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 256
    env_file:
      - stack.env
    environment:
      - TZ=${TZ:-America/Denver}
      - DOCKER_HOSTNAMES=homarr-docker-socket-proxy
      - DOCKER_PORTS=2375
    volumes:
      - homarr_appdata:/appdata
    depends_on:
      homarr-docker-socket-proxy:
        condition: service_healthy
    networks:
      - media-automation
      - media-services
      - ingress-admin
      - docker-api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7575/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  docker-api:
    internal: true
  media-automation:
    name: media-automation
    external: true
  media-services:
    name: media-services
    external: true
  ingress-admin:
    name: ingress-admin
    external: true

volumes:
  homarr_appdata:
