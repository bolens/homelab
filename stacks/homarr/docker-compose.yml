# Homarr 1.x – homelab dashboard (links, widgets, optional integrations).
# No host ports; access via Caddy (https://homarr.example.com → homarr:7575).
services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 256
    env_file:
      - stack.env
    environment:
      - TZ=${TZ:-America/Denver}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - homarr_appdata:/appdata
    networks:
      - monitor
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7575/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  monitor:
    name: monitor
    external: true

volumes:
  homarr_appdata:
