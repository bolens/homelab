name: homarr
default_port: 7575
databases: []
health:
  endpoint: /
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: dashboard
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: homarr.yourdomain.com
data_profile:
  contains_pii: false
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://homarr.dev/
  docs: https://homarr.dev/docs/
  repo: https://github.com/ajnart/homarr
backup:
  priority: medium
  schedule_hint: weekly
volumes:
- name: homarr_config
  role: app_data
  critical: true
- name: homarr_data
  role: app_data
  critical: true
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: small
  memory_profile: small
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
