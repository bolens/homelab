name: vaultwarden
default_port: 80
databases: []
health:
  endpoint: /alive
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: security
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: vaultwarden.yourdomain.com
data_profile:
  contains_pii: true
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://vaultwarden.github.io
  docs: https://github.com/dani-garcia/vaultwarden/wiki
  repo: https://github.com/dani-garcia/vaultwarden
backup:
  priority: high
  schedule_hint: weekly
volumes:
- name: vw_data
  role: app_data
  critical: true
auth:
  mode: builtin
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: small
  memory_profile: small
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
runtime_security:
  privileged_services: []
  host_network_services: []
  docker_socket_services: []
  floating_image_services: []
