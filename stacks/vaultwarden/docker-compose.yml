# Vaultwarden – lightweight, Bitwarden-compatible password manager. See https://github.com/dani-garcia/vaultwarden
# Portainer-friendly: named volume and dedicated Caddy ingress network.
# Official wiki: https://github.com/dani-garcia/vaultwarden/wiki/Using-Docker-Compose

name: vaultwarden

services:
  vaultwarden:
    container_name: vaultwarden
    image: docker.io/vaultwarden/server:latest@sha256:ebdfe70701c60ac0c28c697e787cea767d7972940b786037b29fe0d507f821e8
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    volumes:
      - vw_data:/data
    restart: unless-stopped
    networks:
      - ingress-sensitive
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  ingress-sensitive:
    name: ingress-sensitive
    external: true

volumes:
  vw_data:
