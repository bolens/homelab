# Vaultwarden – lightweight, Bitwarden-compatible password manager. See https://github.com/dani-garcia/vaultwarden
# Portainer-friendly: named volume and dedicated Caddy ingress network.
# Official wiki: https://github.com/dani-garcia/vaultwarden/wiki/Using-Docker-Compose

name: vaultwarden

services:
  vaultwarden:
    labels:
      logging: "true"
    container_name: vaultwarden
    image: docker.io/vaultwarden/server:latest@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    volumes:
      - vw_data:/data
    restart: unless-stopped
    networks:
      - ingress-sensitive
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  ingress-sensitive:
    name: ingress-sensitive
    external: true

volumes:
  vw_data:
