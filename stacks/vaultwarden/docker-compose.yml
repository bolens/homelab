# Vaultwarden – lightweight, Bitwarden-compatible password manager. See https://github.com/dani-garcia/vaultwarden
# Portainer-friendly: named volumes, external monitor network for Caddy.
# Official wiki: https://github.com/dani-garcia/vaultwarden/wiki/Using-Docker-Compose

name: vaultwarden

services:
  vaultwarden:
    container_name: vaultwarden
    image: docker.io/vaultwarden/server:latest
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    volumes:
      - vw_data:/data
    restart: unless-stopped
    networks:
      - monitor
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  monitor:
    name: monitor
    external: true

volumes:
  vw_data:
