# OWASP Dependency-Track – SBOM / dependency vulnerability tracking (API + frontend + Postgres).
# No host ports: access via Caddy (reverse proxy to dtrack-frontend:8080 and dtrack-apiserver:8080).
# Set POSTGRES_PASSWORD and API_BASE_URL in stack.env (or Portainer Environment)
# to the values the browser and API should use (e.g. API_BASE_URL=https://dtrack.home/api).
# Docs: https://docs.dependencytrack.org/  |  https://dependencytrack.org/
#
# Start:  docker compose up -d
# First run: create admin user in the UI; upload SBOMs (CycloneDX, SPDX) or use the API.

name: dependency-track

services:
  dtrack-postgres:
    labels:
      logging: "true"
    image: postgres:18-alpine
    container_name: dtrack-postgres
    env_file:
      - stack.env
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-dtrack}
      - POSTGRES_USER=${POSTGRES_USER:-dtrack}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - dtrack-pg18-data:/var/lib/postgresql/data
    networks:
      - dtrack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dtrack} -d ${POSTGRES_DB:-dtrack}"]
      interval: 5s
      timeout: 3s
      retries: 5

  dtrack-apiserver:
    labels:
      logging: "true"
    image: dependencytrack/apiserver:latest@sha256:f1da63ed610a076eebb3e324e6d4669be9e13302a887f4884b5f8b3c8767cf46
    container_name: dtrack-apiserver
    env_file:
      - stack.env
    restart: unless-stopped
    memswap_limit: 6g
    cpu_shares: 256
    depends_on:
      dtrack-postgres:
        condition: service_healthy
    environment:
      - TZ=${TZ:-America/Denver}
      - ALPINE_DATABASE_MODE=external
      - ALPINE_DATABASE_URL=jdbc:postgresql://dtrack-postgres:5432/${POSTGRES_DB:-dtrack}
      - ALPINE_DATABASE_DRIVER=org.postgresql.Driver
      - ALPINE_DATABASE_USERNAME=${POSTGRES_USER:-dtrack}
      - ALPINE_DATABASE_PASSWORD=${POSTGRES_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
          pids: 1024
        reservations:
          memory: 2g
    volumes:
      - dtrack-data:/data
    networks:
      - dtrack
      - ingress-admin

  dtrack-frontend:
    labels:
      logging: "true"
    image: dependencytrack/frontend:latest@sha256:8854a8320475b9992cd5b30c42b937b48f19c9b914ec6b9a22ffd079c4247279
    container_name: dtrack-frontend
    env_file:
      - stack.env
    restart: unless-stopped
    depends_on:
      - dtrack-apiserver
    environment:
      - TZ=${TZ:-America/Denver}
      # Must be the URL the browser uses to reach the API (see README for Caddy path/subdomain setup)
      - API_BASE_URL=${API_BASE_URL}
    networks:
      - dtrack
      - ingress-admin

networks:
  dtrack:
    driver: bridge
  ingress-admin:
    name: ingress-admin
    external: true

volumes:
  dtrack-data:
  dtrack-pg18-data:
