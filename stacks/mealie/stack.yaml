name: mealie
default_port: 9000
databases: []
health:
  endpoint: /api/app/about
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: lifestyle
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: mealie.yourdomain.com
data_profile:
  contains_pii: false
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://mealie.io
  docs: https://docs.mealie.io/
  repo: https://github.com/mealie-recipes/mealie
backup:
  priority: high
  schedule_hint: weekly
volumes:
- name: mealie_data
  role: app_data
  critical: true
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: small
  memory_profile: small
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
