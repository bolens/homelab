# Mealie – self-hosted recipe manager and meal planner. See https://mealie.io
# Portainer-friendly: named volumes, external monitor network for Caddy.
# Image: https://github.com/mealie-recipes/mealie/pkgs/container/mealie

name: mealie

services:
  mealie:
    container_name: mealie
    image: ghcr.io/mealie-recipes/mealie:latest
    restart: unless-stopped
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    volumes:
      - mealie_data:/app/data
    networks:
      - monitor
    healthcheck:
      test: ["CMD-SHELL", "$$MEALIE_HOME/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  monitor:
    name: monitor
    external: true

volumes:
  mealie_data:
