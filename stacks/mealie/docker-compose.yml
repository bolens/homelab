# Mealie – self-hosted recipe manager and meal planner. See https://mealie.io
# Portainer-friendly: named volumes, external ingress-public network for Caddy.
# Image: https://github.com/mealie-recipes/mealie/pkgs/container/mealie

name: mealie

services:
  mealie:
    labels:
      logging: "true"
    container_name: mealie
    image: ghcr.io/mealie-recipes/mealie:latest@sha256:8b02290f4d1806f02acac6f25f6d48a3c965612fda1f8e914d5af533276f8688
    restart: unless-stopped
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    volumes:
      - mealie_data:/app/data
    networks:
      - ingress-public
    healthcheck:
      test: ["CMD-SHELL", "$$MEALIE_HOME/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ingress-public:
    name: ingress-public
    external: true

volumes:
  mealie_data:
