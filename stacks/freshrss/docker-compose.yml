# FreshRSS – self-hosted RSS feed reader (Feedly-like). See https://freshrss.org/
# Portainer-friendly: named volume, dedicated Caddy ingress network.
# Image: https://docs.linuxserver.io/images/docker-freshrss
services:
  freshrss:
    labels:
      logging: "true"
    container_name: freshrss
    image: lscr.io/linuxserver/freshrss:latest@sha256:ad3ebe2553250edcecf74995c051b6426fc85b7ca18e744991cb1ca99c8d943d
    env_file:
      - stack.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Denver}
    volumes:
      - freshrss_config:/config
    restart: unless-stopped
    networks:
      - ingress-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  ingress-public:
    name: ingress-public
    external: true

volumes:
  freshrss_config:
