name: firecrawl
default_port: 3002
databases:
- redis
health:
  endpoint: /health
  internal_only: true
monitoring:
  prometheus: false
  uptime_kuma:
    external: false
    internal: true
  blackbox_exporter: false
  grafana_dashboard: false
shared_resources: []
type: api
category: ai
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: firecrawl.yourdomain.com
data_profile:
  contains_pii: false
  contains_logs_only: false
  recommended_backup: false
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://firecrawl.dev
  docs: https://docs.firecrawl.dev
  repo: https://github.com/firecrawl/firecrawl
backup:
  priority: low
  schedule_hint: null
volumes:
- name: redisdata
  role: cache
  critical: false
auth:
  mode: api_key
  sso_provider: null
  access_policy: api_only
resources:
  cpu_profile: medium
  memory_profile: medium
  storage_profile: small
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: ai
lifecycle:
  status: stable
  replacement_for: null
  notes: 'USE_DB_AUTHENTICATION=false by default; set TEST_API_KEY. Enable Supabase for multi-user.'
