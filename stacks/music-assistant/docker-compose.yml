services:
  music-assistant:
    image: ghcr.io/music-assistant/server:2.10.9@sha256:4ac0d5844363fbbefd6a61251df09d96cd546e05e01b8c1cc1a28803f0935e07
    container_name: music-assistant
    restart: unless-stopped
    env_file:
    - stack.env
    labels:
      logging: 'true'
    volumes:
    - music_assistant_data:/data
    network_mode: host
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/',timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
volumes:
  music_assistant_data: {}
