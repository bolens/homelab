services:
  music-assistant:
    image: ghcr.io/music-assistant/server:2.10.12@sha256:7eb272e2e13da9a5d61dcbc4e1fcfc734776222b23f2825a9b5690d4427cfafb
    container_name: music-assistant
    restart: unless-stopped
    env_file:
    - stack.env
    labels:
      logging: 'true'
    volumes:
    - music_assistant_data:/data
    network_mode: host
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/',timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
volumes:
  music_assistant_data: {}
