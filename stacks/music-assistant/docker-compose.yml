services:
  music-assistant:
    image: ghcr.io/music-assistant/server:2.10.13@sha256:7510aaa7ee5fc85b34fd0de17992bd14473895b23ce3eb9b310092743f4dbb84
    container_name: music-assistant
    restart: unless-stopped
    env_file:
    - stack.env
    labels:
      logging: 'true'
    volumes:
    - music_assistant_data:/data
    network_mode: host
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/',timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
volumes:
  music_assistant_data: {}
