name: shlink
default_port: 8080
databases:
- mysql
health:
  endpoint: /rest/v3/health
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: documents
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: shlink.yourdomain.com
data_profile:
  contains_pii: true
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://shlink.io
  docs: https://shlink.io/documentation
  repo: https://github.com/shlinkio/shlink
backup:
  priority: high
  schedule_hint: weekly
volumes:
- name: shlink_data
  role: app_data
  critical: true
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: medium
  memory_profile: medium
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
