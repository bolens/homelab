services:
  archivebox:
    image: archivebox/archivebox:latest
    container_name: archivebox
    restart: unless-stopped
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    volumes:
      - archivebox-data:/data
    environment:
      # Hardcoded: internal listen address (behind Caddy) and Sonic service hostname
      - LISTEN_HOST=0.0.0.0:8000
      - SEARCH_BACKEND_HOST_NAME=sonic
    networks:
      - monitor
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s

  archivebox_scheduler:
    image: archivebox/archivebox:latest
    container_name: archivebox_scheduler
    restart: unless-stopped
    command: schedule --foreground --update --every=day
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    volumes:
      - archivebox-data:/data
    environment:
      - SEARCH_BACKEND_HOST_NAME=sonic
    networks:
      - monitor

  sonic:
    image: archivebox/sonic:latest
    container_name: archivebox-sonic
    restart: unless-stopped
    expose:
      - "1491"
    env_file:
      - stack.env
    volumes:
      - archivebox-sonic-data:/var/lib/sonic/store
    networks:
      - monitor

networks:
  # Use external monitor only – do not create a stack default network (avoids subnet exhaustion)
  monitor:
    name: monitor
    external: true

volumes:
  archivebox-data:
  archivebox-sonic-data:
