services:
  archivebox:
    image: archivebox/archivebox:latest@sha256:1a5a37331091d9df865ead2b9c231aa5a892fc26fe0422ce6140d9e2d9532327
    container_name: archivebox
    restart: unless-stopped
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    volumes:
      - archivebox-data:/data
    environment:
      # Hardcoded: internal listen address (behind Caddy) and Sonic service hostname
      - LISTEN_HOST=0.0.0.0:8000
      - SEARCH_BACKEND_HOST_NAME=sonic
    networks:
      - internal
      - ingress-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s

  archivebox_scheduler:
    image: archivebox/archivebox:latest@sha256:1a5a37331091d9df865ead2b9c231aa5a892fc26fe0422ce6140d9e2d9532327
    container_name: archivebox_scheduler
    restart: unless-stopped
    command: schedule --foreground --update --every=day
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    volumes:
      - archivebox-data:/data
    environment:
      - SEARCH_BACKEND_HOST_NAME=sonic
    networks:
      - internal

  sonic:
    image: archivebox/sonic:latest@sha256:452064bfdab535fb8a6019937f1d753e0dfb2c94d2a87ebd166e2d556de78692
    container_name: archivebox-sonic
    restart: unless-stopped
    expose:
      - "1491"
    env_file:
      - stack.env
    volumes:
      - archivebox-sonic-data:/var/lib/sonic/store
    networks:
      - internal

networks:
  internal:
    driver: bridge
  ingress-public:
    name: ingress-public
    external: true

volumes:
  archivebox-data:
  archivebox-sonic-data:
