services:
  archivebox:
    labels:
      logging: "true"
    image: archivebox/archivebox:latest@sha256:56057dbe5ab387441e96c25a531d8934768bc977f94b9a91428f6913945e9b0d
    container_name: archivebox
    restart: unless-stopped
    # Keep the listener aligned with health checks and Caddy across image defaults.
    command: server --init 0.0.0.0:8000
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    volumes:
      - archivebox-data:/data
    environment:
      # Hardcoded: internal listen address (behind Caddy) and Sonic service hostname
      - LISTEN_HOST=0.0.0.0:8000
      - SEARCH_BACKEND_HOST_NAME=sonic
    networks:
      - internal
      - ingress-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s

  archivebox_scheduler:
    labels:
      logging: "true"
    image: archivebox/archivebox:latest@sha256:56057dbe5ab387441e96c25a531d8934768bc977f94b9a91428f6913945e9b0d
    container_name: archivebox_scheduler
    restart: unless-stopped
    command: schedule --foreground
    # This worker has no web listener; the image's server probe does not apply.
    healthcheck:
      disable: true
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    volumes:
      - archivebox-data:/data
    environment:
      - SEARCH_BACKEND_HOST_NAME=sonic
    networks:
      - internal

  sonic:
    labels:
      logging: "true"
    image: archivebox/sonic:latest@sha256:452064bfdab535fb8a6019937f1d753e0dfb2c94d2a87ebd166e2d556de78692
    container_name: archivebox-sonic
    restart: unless-stopped
    expose:
      - "1491"
    env_file:
      - stack.env
    volumes:
      - archivebox-sonic-data:/var/lib/sonic/store
    networks:
      - internal

networks:
  internal:
    driver: bridge
  ingress-public:
    name: ingress-public
    external: true

volumes:
  archivebox-data:
  archivebox-sonic-data:
