name: affine
default_port: 3010
databases:
- postgres
- redis
health:
  endpoint: /
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: utility
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: affine.yourdomain.com
data_profile:
  contains_pii: false
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://affine.pro/
  docs: https://docs.affine.pro/self-host-affine
  repo: https://github.com/toeverything/AFFiNE
backup:
  priority: medium
  schedule_hint: weekly
volumes:
- name: affine_storage
  role: app_data
  critical: true
- name: affine_config
  role: config
  critical: true
- name: affine_postgres
  role: database
  critical: true
- name: affine_redis
  role: cache
  critical: false
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: medium
  memory_profile: medium
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: affine-self-hosted
  notes: Replaced the retired single-container image with the current AFFiNE, migration-job,
    PostgreSQL/pgvector, and Redis architecture.
runtime_security:
  privileged_services: []
  host_network_services: []
  docker_socket_services: []
  floating_image_services: []
