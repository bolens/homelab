name: affine

services:
  affine:
    image: ghcr.io/toeverything/affine:stable@sha256:b649f5ce2384ffdf13c23bccf81d759e15973d59d0b0058af65d895a84373099
    container_name: affine
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=false
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      affine-migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    environment:
      REDIS_SERVER_HOST: redis
      DATABASE_URL: postgresql://${DB_USERNAME:?set DB_USERNAME}:${DB_PASSWORD:?set DB_PASSWORD}@postgres:5432/${DB_DATABASE:-affine}
      AFFINE_INDEXER_ENABLED: "false"
    volumes:
      - affine_storage:/root/.affine/storage
      - affine_config:/root/.affine/config
    networks:
      - backend
      - ingress-public
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3010/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  affine-migration:
    labels:
      logging: "true"
    image: ghcr.io/toeverything/affine:stable@sha256:b649f5ce2384ffdf13c23bccf81d759e15973d59d0b0058af65d895a84373099
    container_name: affine-migration
    command: ["sh", "-c", "node ./scripts/self-host-predeploy.js"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    environment:
      REDIS_SERVER_HOST: redis
      DATABASE_URL: postgresql://${DB_USERNAME:?set DB_USERNAME}:${DB_PASSWORD:?set DB_PASSWORD}@postgres:5432/${DB_DATABASE:-affine}
      AFFINE_INDEXER_ENABLED: "false"
    volumes:
      - affine_storage:/root/.affine/storage
      - affine_config:/root/.affine/config
    networks:
      - backend

  postgres:
    labels:
      logging: "true"
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    container_name: affine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-affine}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - affine_postgres:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:?set DB_USERNAME} -d ${DB_DATABASE:-affine}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    labels:
      logging: "true"
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    container_name: affine-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - affine_redis:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend:
    internal: true
  ingress-public:
    name: ingress-public
    external: true

volumes:
  affine_storage:
  affine_config:
  affine_postgres:
  affine_redis:
