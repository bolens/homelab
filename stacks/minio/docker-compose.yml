services:
  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - stack.env
    environment:
      - TZ=${TZ:-America/Denver}
    volumes:
      - minio_data:/data
    # No host ports; Caddy uses ingress-admin and Restic uses backup.
    networks:
      - ingress-admin
      - backup
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  backup:
    name: backup
    external: true
  ingress-admin:
    name: ingress-admin
    external: true

volumes:
  minio_data:
