services:
  infisical:
    image: infisical/infisical:latest
    container_name: infisical
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    memswap_limit: 4g
    pids_limit: 512
    cpu_shares: 384
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No host port: access via Caddy on proxy-ingress.
    env_file:
      - stack.env
    networks:
      - infisical
      - proxy-ingress
      - mail-services

  redis:
    image: redis:alpine
    container_name: infisical-redis
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 256
    cpu_shares: 256
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - infisical
    volumes:
      - infisical_redis_data:/data

  db:
    image: postgres:18-alpine
    container_name: infisical-db
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 384
    env_file:
      - stack.env
    environment:
      PGDATA: /var/lib/postgresql/data
    volumes:
      - infisical_pg18_data:/var/lib/postgresql/data
    networks:
      - infisical
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infisical} -d ${POSTGRES_DB:-infisical}"]
      interval: 5s
      timeout: 10s
      retries: 10

networks:
  infisical:
    driver: bridge
  proxy-ingress:
    name: proxy-ingress
    external: true
  mail-services:
    name: mail-services
    external: true

volumes:
  infisical_pg18_data:
  infisical_redis_data:
