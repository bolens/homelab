# Config: copy promtail-config.yml.example to ~/.config/promtail/promtail-config.yml
# (create the directory if needed). Override with PROMTAIL_CONFIG_PATH if desired (e.g. in Portainer).
# Requires Loki on the monitor network (e.g. stacks/loki) at http://loki:3100.
services:
  promtail:
    image: grafana/promtail:2.9.8
    container_name: promtail
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /run/log/journal:/run/log/journal:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${PROMTAIL_CONFIG_PATH:-${HOME}/.config/promtail/promtail-config.yml}:/etc/promtail/config.yml:ro
      - promtail_positions:/var/lib/promtail
    networks:
      - monitor
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    healthcheck:
      # promtail image has no wget or curl; check TCP port via /proc/net/tcp6
      # 0x2378 = port 9080 in hex (uppercase in kernel output)
      test: ["CMD-SHELL", "grep -q ':2378 ' /proc/net/tcp6 || grep -q ':2378 ' /proc/net/tcp"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  monitor:
    name: monitor
    external: true

volumes:
  promtail_positions:
