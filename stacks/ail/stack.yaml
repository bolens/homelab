name: ail
default_port: 7000
databases: []
health:
  endpoint: /
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: utility
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: ail.yourdomain.com
data_profile:
  contains_pii: false
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://www.ail-project.org
  docs: https://github.com/ail-project/ail-framework/tree/master/doc
  repo: https://github.com/ail-project/ail-framework
backup:
  priority: medium
  schedule_hint: weekly
volumes:
- name: ail-pastes
  role: app_data
  critical: true
- name: ail-screenshots
  role: app_data
  critical: true
- name: ail-kvrocks
  role: app_data
  critical: true
- name: ail-indexdir
  role: app_data
  critical: true
- name: ail-hashs
  role: app_data
  critical: true
- name: ail-logs
  role: app_data
  critical: true
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: large
  memory_profile: large
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: null
  notes: 'Primary AIL deployment; ail-framework is retained as an alternate upstream-layout integration.'
