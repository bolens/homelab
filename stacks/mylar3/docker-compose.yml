# Mylar3 – automated comic downloader (Usenet/torrents). Like Sonarr for comics.
# Activity history and workflow controls persist in the existing Mylar config volume.
# Configure NZBGet, qBittorrent, Prowlarr in the UI. Point /comics at a folder Komga can scan.
# Access via Caddy only (no host port).
# Unified media bind mount: MYLAR3_MEDIA_PATH in stack.env.
#   docker compose --env-file stack.env up -d

services:
  mylar3:
    labels:
      logging: "true"
    image: ${MYLAR3_IMAGE:-ghcr.io/bolens/homelab-mylar3:latest}
    container_name: mylar3
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    memswap_limit: 4g
    pids_limit: 512
    cpu_shares: 256
    env_file:
      - stack.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Denver}
    volumes:
      - mylar3_config:/config
      - "${MYLAR3_MEDIA_PATH:-/mnt/unraid/media}:/data"
    networks:
      - media-automation
      - ingress-admin
      - usenet
      - torrents
    healthcheck:
      test: ["CMD", "python3", "/opt/mylar3-fixes/health.py"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s

networks:
  media-automation:
    name: media-automation
    external: true
  ingress-admin:
    name: ingress-admin
    external: true
  usenet:
    name: usenet
    external: true
  torrents:
    name: torrents
    external: true

volumes:
  mylar3_config:
