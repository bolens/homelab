<section><h2>Native component states</h2><form id="example_form"><label for="example_input">Issue ID</label><input id="example_input" type="text"><button type="submit">Apply example</button><button id="example_disabled" type="button" disabled>Disabled action</button></form><p id="example_result" role="status">No example submitted.</p><button id="example_toggle" type="button">Enable disabled action</button><button id="example_add" type="button">Add dynamic action</button><div id="example_dynamic"></div><p><a href="importProblems" data-mylar-component="button">Navigation link</a></p><p><button id="example_late" type="button">Add native widget</button> <button id="example_dialog_open" type="button">Open example dialog</button></p><div id="example_dialog" title="Component example" style="display:none"><label for="example_password">Password field</label><input id="example_password" type="password" autocomplete="off"><p>Native dialog with themed controls.</p><button type="button">Dialog action</button></div></section><script>document.addEventListener('DOMContentLoaded',function(){var count=0;document.getElementById('example_late').addEventListener('click',function(){var a=document.createElement('a');a.href='#';a.textContent='Late native widget';a.addEventListener('click',function(e){e.preventDefault();document.getElementById('example_result').textContent='Native widget clicked.';});document.getElementById('example_dynamic').appendChild(a);window.jQuery(a).button({icons:{primary:'ui-icon-refresh'}});});document.getElementById('example_dialog_open').addEventListener('click',function(){window.jQuery('#example_dialog').dialog({modal:true});});document.getElementById('example_form').addEventListener('submit',function(e){e.preventDefault();document.getElementById('example_result').textContent='Submitted '+(++count)+' time(s).';});document.getElementById('example_toggle').addEventListener('click',function(){document.getElementById('example_disabled').disabled=!document.getElementById('example_disabled').disabled;});document.getElementById('example_add').addEventListener('click',function(){var b=document.createElement('button');b.type='button';b.textContent='Dynamic action';b.addEventListener('click',function(){document.getElementById('example_result').textContent='Dynamic action clicked.';});document.getElementById('example_dynamic').appendChild(b);});});</script>
