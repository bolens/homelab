name: mylar3
default_port: 8090
databases: []
health:
  endpoint: /
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: media
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: mylar3.yourdomain.com
data_profile:
  contains_pii: false
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: null
  docs: null
  repo: https://github.com/mylar3/mylar3
backup:
  priority: medium
  schedule_hint: weekly
volumes:
- name: mylar3_config
  role: app_data
  critical: true
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: small
  memory_profile: small
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: media
lifecycle:
  status: stable
  replacement_for: null
  notes: 'Bundles a bounded read-only publication payload verifier; correction registration and enforcement remain a separately gated migration. Versioned primary-key release naming APIs preserve archive bytes and attributes through a same-folder native catalog journal and shared writer recovery fence, for the opt-in matching Komga worker. Published GHCR image includes DDL compatibility, worker recovery, queue control, verified transfers, import-problem reporting, the post-processing monitor, persistent Activity and pack-member history, opt-in verified pack recovery, annual identity fixes, guarded DDL-to-NZB handoff, guided import review, intake throttling, and cooldown-aware authenticated health checks without source bind mounts. A Legacy-default backend selector offers opt-in experimental modern CBZ ComicRack tagging; shared writer protocol state coordinates post-processing and manual tagging with an opt-in matching normalizer. Optional Curl discovery is isolated and Requests-default; archive transfers retain Requests. Image-bundled Poppler validates PDF downloads before optional normalizer rendering and verified CBZ import. Enable the Mylar API for container health.'
# Library metadata maintenance is independently opt-in in Activity; no added mounts or ingress.
# Converted tagging uses existing app state and primary-key API; see stack README for opt-in and rollout.
runtime_security:
  privileged_services: []
  host_network_services: []
  docker_socket_services: []
  floating_image_services: []
