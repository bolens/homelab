# Calibre-Web – web UI for an existing Calibre library (browse, read, download eBooks).
# Requires a Calibre library at /books (metadata.db + books). Use named volume or bind-mount.
# Access via Caddy only (no host port).

services:
  calibre-web:
    labels:
      logging: "true"
    image: lscr.io/linuxserver/calibre-web:latest@sha256:0895ba9b13abf3bf80131c62cefdbf7e090a363a2dff1bc2b3dff173156a88b9
    container_name: calibre-web
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Denver}
    volumes:
      - calibre_web_config:/config
      - "${CALIBRE_BOOKS_PATH:-/mnt/unraid/media/books}:/books"
    networks:
      - ingress-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8083/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s

networks:
  ingress-public:
    name: ingress-public
    external: true

volumes:
  calibre_web_config:
