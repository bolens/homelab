# Linkding – lightweight bookmark manager (tags, import, API).
# No host ports; access via Caddy (e.g. https://linkding.yourdomain.com → linkding:9090).
services:
  linkding:
    image: sissbruecker/linkding:latest@sha256:61b2eb9eed8e5772a473fb7f1f8923e046cb8cbbeb50e88150afd5ff287d4060
    container_name: linkding
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1536m
    pids_limit: 256
    cpu_shares: 256
    env_file:
      - stack.env
    environment:
      - TZ=${TZ:-America/Denver}
      - LD_DISABLE_BACKGROUND_TASKS=${LD_DISABLE_BACKGROUND_TASKS:-false}
    volumes:
      - linkding_data:/etc/linkding/data
    networks:
      - ingress-public
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9090/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  ingress-public:
    name: ingress-public
    external: true

volumes:
  linkding_data:
