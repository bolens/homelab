name: onionprobe
default_port: 9090
databases:
- postgres
health:
  endpoint: /-/healthy
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: cli_tool
category: monitoring
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: onionprobe.yourdomain.com
data_profile:
  contains_pii: false
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://onionservices.torproject.org/apps/web/onionprobe/
  docs: https://onionservices.torproject.org/apps/web/onionprobe/
  repo: https://gitlab.torproject.org/tpo/onion-services/onionprobe
backup:
  priority: medium
  schedule_hint: weekly
volumes:
- name: op-prometheus-data
  role: app_data
  critical: true
- name: op-alertmanager-data
  role: app_data
  critical: true
- name: op-postgres-data
  role: app_data
  critical: true
- name: op-grafana-data
  role: app_data
  critical: true
- name: op-tor-data
  role: app_data
  critical: true
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: medium
  memory_profile: medium
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: monitoring
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
