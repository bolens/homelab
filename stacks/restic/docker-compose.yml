services:
  restic:
    image: mazzolino/restic:latest
    container_name: restic
    restart: unless-stopped
    # CLI / cron-only stack: no host ports, no Caddy.
    # The container runs backups on a schedule via BACKUP_CRON.
    env_file:
      - stack.env
    environment:
      # Example: S3 over MinIO on the internal backup network
      - RESTIC_REPOSITORY=${RESTIC_REPOSITORY}
      - RESTIC_PASSWORD=${RESTIC_PASSWORD}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - BACKUP_CRON=${BACKUP_CRON:-0 3 * * *}
      - TZ=${TZ:-America/Denver}
      - POST_COMMANDS_SUCCESS=curl -fsS "http://uptime-kuma:3001/api/push/${UPTIME_KUMA_RESTIC_PUSH_TOKEN}?status=up&msg=Backup%20completed"
      - POST_COMMANDS_FAILURE=curl -fsS "http://uptime-kuma:3001/api/push/${UPTIME_KUMA_RESTIC_PUSH_TOKEN}?status=down&msg=Backup%20failed"
      - POST_COMMANDS_INCOMPLETE=curl -fsS "http://uptime-kuma:3001/api/push/${UPTIME_KUMA_RESTIC_PUSH_TOKEN}?status=down&msg=Backup%20incomplete"
    volumes:
      # Host paths to back up (override via env for Portainer)
      - ${RESTIC_PATH_DOCKER:-/srv/docker}:/data/docker:ro
      - ${RESTIC_PATH_MEDIA:-/srv/media}:/data/media:ro
      # Cache to speed up subsequent backups
      - restic_cache:/cache
    networks:
      - backup
      - monitoring-push

networks:
  backup:
    name: backup
    external: true
  monitoring-push:
    name: monitoring-push
    external: true

volumes:
  restic_cache:
