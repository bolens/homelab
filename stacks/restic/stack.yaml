name: restic
default_port: null
databases: []
health:
  endpoint: /
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: backup
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: restic.yourdomain.com
data_profile:
  contains_pii: true
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: null
  docs: null
  repo: null
backup:
  priority: high
  schedule_hint: weekly
volumes:
- name: restic_cache
  role: app_data
  critical: true
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: small
  memory_profile: small
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: null
  notes: >-
    Optional docker-compose.local-backup.yml writes to an existing host directory,
    backs up repository and application data, and excludes the old MinIO Restic
    repository and Restic cache. Media is excluded. Successful local backups keep
    7 daily, 4 weekly, 3 monthly, and at least 3 recent snapshots per source-path
    set, with weekly pruning bounded to 1 GiB of repacking. Old S3 backups remain
    untouched.
runtime_security:
  privileged_services: []
  host_network_services: []
  docker_socket_services: []
  floating_image_services: []
