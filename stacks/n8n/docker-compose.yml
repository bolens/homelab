# n8n – workflow automation. Portainer-friendly with dedicated ingress and mail networks.
# Access via Caddy only (reverse_proxy n8n:5678). No host ports exposed.
# Set N8N_HOST and WEBHOOK_URL in stack.env to your Caddy hostname (e.g. https://n8n.home or https://n8n.yourdomain.com).
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest@sha256:f9a15cc65378e4e5b6c3b1445c83985131938db8d8b5b1ab891d7d50196b2162
    container_name: n8n
    restart: unless-stopped
    volumes:
      - n8n_data:/home/node/.n8n
      # Optional: share host directory for Read/Write Files from Disk node (path /files in n8n)
      # - ./local-files:/files
    env_file:
      - stack.env
    networks:
      - ingress-public
      - mail-clients
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  ingress-public:
    name: ingress-public
    external: true
  mail-clients:
    name: mail-clients
    external: true

volumes:
  n8n_data: {}
