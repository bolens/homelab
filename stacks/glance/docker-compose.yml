# Glance – self-hosted dashboard (RSS, widgets, themes). YAML config under ./config.
# No host ports; access via Caddy (reverse_proxy glance:8080).
# Upstream: https://github.com/glanceapp/glance
services:
  glance:
    image: glanceapp/glance:latest@sha256:32ab73d80f2b8b5fb0735b0431deb36b93fbb6b2fb43592449b0178c8b83e350
    container_name: glance
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=true
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
    networks:
      - ingress-public
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ingress-public:
    name: ingress-public
    external: true
