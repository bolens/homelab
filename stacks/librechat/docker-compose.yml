# LibreChat - Enhanced ChatGPT Clone with multi-provider support
# Requires MongoDB and Redis. No host ports; access via Caddy on `ingress-public`.
# Compose reads `.env` (copy of stack.env from `./prepare-stack.sh`) for `${VAR}` substitution.
services:
  mongodb:
    image: mongo:8
    container_name: librechat-mongodb
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - mongodb8_data:/data/db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-librechat}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-librechat}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval "db.adminCommand({ping:1}).ok" | grep -q 1',
        ]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 40s
    mem_limit: 1g
    cpus: "1.00"

  redis:
    image: redis:8-alpine
    container_name: librechat-redis
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - redis_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD:-librechat}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-librechat}"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: "0.50"

  librechat:
    image: ghcr.io/danny-avila/librechat:latest@sha256:c5db3331b845e1f289f8d04c0c77936c4bbe372f76730a804abc1c37e44d23a9
    container_name: librechat
    restart: unless-stopped
    volumes:
      - librechat_data:/app/api/data
      - ./config/librechat.yaml:/app/librechat.yaml:ro
      - ./config/auth.json:/app/api/data/auth.json
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
      - ai-backend
      - ingress-public
    labels:
      - logging=true
      - logging_sampling=true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    environment:
      - MONGO_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME:-librechat}:${MONGO_INITDB_ROOT_PASSWORD:-librechat}@mongodb:27017/LibreChat?directConnection=true&authSource=admin
      - MONGO_DB=LibreChat
      - REDIS_URI=redis://:${REDIS_PASSWORD:-librechat}@redis:6379
      - DOMAIN_CLIENT=${DOMAIN_CLIENT:-http://localhost:3080}
      - DOMAIN_SERVER=${DOMAIN_SERVER:-http://localhost:3080}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      - ALLOW_SOCIAL_LOGIN=${ALLOW_SOCIAL_LOGIN:-false}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-}
      - JWT_EXPIRY=${JWT_EXPIRY:-1d}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY:-7d}
      - APP_TITLE=${APP_TITLE:-LibreChat}
      - VITE_SHOW_GOOGLE_LOGIN_OPTION=${VITE_SHOW_GOOGLE_LOGIN_OPTION:-false}
      - VITE_SHOW_MICROSOFT_LOGIN_OPTION=${VITE_SHOW_MICROSOFT_LOGIN_OPTION:-false}
    mem_limit: 2g
    cpus: "2.00"
    healthcheck:
      # Official image includes wget, not curl.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  backend:
    internal: true
  ai-backend:
    name: ai-backend
    external: true
  ingress-public:
    name: ingress-public
    external: true

volumes:
  mongodb8_data:
  redis_data:
  librechat_data:
