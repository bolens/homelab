name: blackbox-exporter
default_port: 9115
databases: []
health:
  endpoint: /health
  internal_only: false
monitoring:
  prometheus: true
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: monitoring
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: blackbox-exporter.yourdomain.com
data_profile:
  contains_pii: false
  contains_logs_only: false
  recommended_backup: false
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://prometheus.io/docs/blackbox_exporter/latest/
  docs: https://prometheus.io/docs/blackbox_exporter/configuration/
  repo: https://github.com/prometheus/blackbox_exporter
backup:
  priority: low
  schedule_hint: manual
volumes: []
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: small
  memory_profile: small
  storage_profile: small
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: monitoring
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
