# Config: copy blackbox.yml.example to ~/.config/blackbox-exporter/blackbox.yml
# (create the directory if needed). Override path with BLACKBOX_CONFIG_PATH if desired.
services:
  blackbox-exporter:
    labels:
      logging: "true"
    image: prom/blackbox-exporter:latest@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    container_name: blackbox-exporter
    restart: unless-stopped
    cap_add:
      - NET_RAW
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
      # Redirect URLs can contain Cloudflare Access signed metadata; metrics
      # retain probe results, while error-only logs avoid leaking noisy URLs.
      - --log.level=error
      - --log.prober=error
    volumes:
      - ${BLACKBOX_CONFIG_PATH:-${HOME}/.config/blackbox-exporter/blackbox.yml}:/etc/blackbox_exporter/config.yml:ro
    networks:
      - telemetry
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9115/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    mem_limit: 256m
    cpus: '0.25'
    memswap_limit: 384m
    pids_limit: 256
    cpu_shares: 256

networks:
  telemetry:
    name: telemetry
    external: true
