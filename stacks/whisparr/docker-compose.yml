# Bind mounts are driven by WHISPARR_*_PATH in stack.env.
# Compose reads those for volume paths only if you pass the file to the CLI, e.g.:
#   docker compose --env-file stack.env up -d
# (env_file below injects the same vars into the container but does not substitute compose volumes.)
services:
  whisparr:
    labels:
      logging: "true"
    image: ghcr.io/thespad/whisparr:latest@sha256:5b25ef072d9e186a2307146a2585268495188546c1fe282bd795ce38eaf5cc77
    container_name: whisparr
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    memswap_limit: 4g
    pids_limit: 512
    cpu_shares: 256
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${WHISPARR_CONFIG_PATH:?Set WHISPARR_CONFIG_PATH in stack.env}:/config
      - ${WHISPARR_MEDIA_PATH:?Set WHISPARR_MEDIA_PATH in stack.env}:/data
    networks:
      - media-automation
      - ingress-admin
      - usenet
      - torrents
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:6969/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  media-automation:
    name: media-automation
    external: true
  ingress-admin:
    name: ingress-admin
    external: true
  usenet:
    name: usenet
    external: true
  torrents:
    name: torrents
    external: true
