# Bind mounts: NZBGET_DOWNLOADS_PATH in stack.env. For compose volume substitution use:
#   docker compose --env-file stack.env up -d
services:
  nzbget:
    labels:
      logging: "true"
    image: lscr.io/linuxserver/nzbget:latest@sha256:b22a2b8b366d1e68e6341435bdabd9ff859642cc2ff4a04243d0723521d69d2e
    container_name: nzbget
    restart: unless-stopped
    cpus: 3.0
    mem_limit: 4g
    memswap_limit: 6g
    pids_limit: 768
    cpu_shares: 256
    env_file:
      - stack.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - UMASK=${UMASK:-002}
      - TZ=${TZ:-America/Denver}
    volumes:
      - nzbget_config:/config
      - "${NZBGET_DOWNLOADS_PATH:-/mnt/unraid/media/downloads/usenet}:/downloads"
      - ./config/unpack-passwords.txt:/etc/nzbget/unpack-passwords.txt:ro
      - ./config/10-fix-volume-ownership.sh:/custom-cont-init.d/10-fix-volume-ownership.sh:ro
      - ./scripts/UnpackMusicTar:/config/scripts/UnpackMusicTar:ro
    networks:
      - media-automation
      - ingress-admin
      - usenet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:6789/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  media-automation:
    name: media-automation
    external: true
  ingress-admin:
    name: ingress-admin
    external: true
  usenet:
    name: usenet
    external: true

volumes:
  nzbget_config:
