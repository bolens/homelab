services:
  adguard-home:
    labels:
      logging: "true"
    image: adguard/adguardhome:latest@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
    container_name: adguard-home
    restart: unless-stopped
    # DNS ports must be exposed on the host so LAN clients/routers can use this
    # host as their DNS server. HTTPS UI is reached via Caddy on the ingress-admin network.
    ports:
      - "${ADGUARD_BIND_IP}:53:53/tcp"
      - "${ADGUARD_BIND_IP}:53:53/udp"
      - "${ADGUARD_BIND_IP}:853:853/tcp"
    volumes:
      - adguard_conf:/opt/adguardhome/conf
      - adguard_work:/opt/adguardhome/work
    networks:
      - dns-services
      - ingress-admin
    env_file:
      - stack.env
    healthcheck:
      test: ["CMD", "nslookup", "-timeout=5", "example.com", "127.0.0.1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  dns-services:
    name: dns-services
    external: true
  ingress-admin:
    name: ingress-admin
    external: true

volumes:
  adguard_conf: {}
  adguard_work: {}
