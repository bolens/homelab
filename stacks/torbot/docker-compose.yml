# OWASP TorBot – Dark Web OSINT crawler (.onion crawler, email extraction, link tree, JSON export).
# No host ports: Tor SOCKS (9050) is internal; run crawls via docker compose exec torbot ...
# Use official/upstream image only (set TORBOT_IMAGE in stack.env; no local build).
# Docs: https://owasp.org/www-project-torbot/  |  GitHub: https://github.com/DedSecInside/TorBot

name: torbot

services:
  tor:
    build:
      context: .
      dockerfile: Dockerfile.tor
    image: torbot-tor:alpine-3.24
    container_name: torbot-tor
    restart: unless-stopped
    networks:
      - torbot
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9050"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  torbot:
    # No official image; set TORBOT_IMAGE to your registry image (build from upstream once if needed)
    image: ${TORBOT_IMAGE:-torbot:latest}
    container_name: torbot
    restart: unless-stopped
    depends_on:
      tor:
        condition: service_healthy
    env_file:
      - stack.env
    # Use Tor in this stack: --host tor --port 9050 when running torbot CLI
    networks:
      - torbot

networks:
  torbot:
    driver: bridge
