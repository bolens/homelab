# OWASP TorBot – Dark Web OSINT crawler (.onion crawler, email extraction, link tree, JSON export).
# No host ports: Tor SOCKS (9050) is internal; run crawls via docker compose exec torbot ...
# Defaults to the repository's GHCR images; stack.env can select registry mirrors.
# Docs: https://owasp.org/www-project-torbot/  |  GitHub: https://github.com/DedSecInside/TorBot

name: torbot

services:
  tor:
    labels:
      logging: "true"
    build:
      context: .
      dockerfile: Dockerfile.tor
    image: ${TORBOT_TOR_IMAGE:-ghcr.io/bolens/homelab-torbot-tor:latest}
    container_name: torbot-tor
    restart: unless-stopped
    networks:
      - torbot
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9050"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  torbot:
    labels:
      logging: "true"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORBOT_COMMIT: ${TORBOT_COMMIT:-9a829a593cd2a5b8e01487962e29cb47d26e001b}
    image: ${TORBOT_IMAGE:-ghcr.io/bolens/homelab-torbot:latest}
    container_name: torbot
    restart: unless-stopped
    depends_on:
      tor:
        condition: service_healthy
    env_file:
      - stack.env
    # Use Tor in this stack: --host tor --port 9050 when running torbot CLI
    networks:
      - torbot
    healthcheck:
      test: ["CMD", "python", "-c", "import socket, torbot; s = socket.create_connection(('tor', 9050), 5); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  torbot:
    driver: bridge
