# SMTP relay – central outbound SMTP for Docker stacks.
# No host ports: apps use smtp-relay:587 on the mail-clients network; public access can use
# Cloudflare Tunnel with hostname smtp.yourdomain.com → tcp://smtp-relay:587 (or host:587).
# Image docs: https://github.com/bokysan/docker-postfix

services:
  smtp-relay:
    image: boky/postfix:latest
    container_name: smtp-relay
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 256
    cpu_shares: 384
    env_file:
      - stack.env
    networks:
      - mail-clients
      - mail-egress

networks:
  mail-clients:
    name: mail-clients
    external: true
  mail-egress:
    name: mail-egress
    external: true
