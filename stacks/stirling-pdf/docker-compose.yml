# Stirling-PDF – PDF tools (merge, split, OCR, convert, watermark, etc.).
# No host ports; access via Caddy (e.g. https://stirling-pdf.yourdomain.com → stirling-pdf:8080).

name: stirling-pdf
services:
  stirling-pdf:
    labels:
      logging: "true"
    image: stirlingtools/stirling-pdf:latest@sha256:7ed4d9681d18e4fbc3aa6a63647c4b5c2bcc4b75841df7c05d7e3d2320f5c9a1
    container_name: stirling-pdf
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 4g
    memswap_limit: 6g
    pids_limit: 1024
    cpu_shares: 256
    env_file:
      - stack.env
    environment:
      - TZ=${TZ:-America/Denver}
      - SECURITY_ALLOWSIGNUP=${SECURITY_ALLOWSIGNUP:-false}
    volumes:
      - stirling_pdf_data:/usr/share/tesseract-ocr/4.05/tessdata
    networks:
      - ingress-public
    healthcheck:
      test: ["CMD-SHELL", "curl -fs --max-time 10 http://localhost:8080$${SYSTEM_ROOTURIPATH:-}/api/v1/info/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  ingress-public:
    name: ingress-public
    external: true

volumes:
  stirling_pdf_data:
