services:
  kometa:
    labels:
      logging: "true"
    image: kometateam/kometa:latest@sha256:0309e3975174d93a02f7a33f918a49875bcf623f87ac539390b3450532781bbf
    container_name: kometa
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    memswap_limit: 4g
    pids_limit: 512
    cpu_shares: 256
    # Batch runner — runs daily at 05:00, not a long-lived server
    healthcheck:
      disable: true
    environment:
      - PUID=1000
      - PGID=1000
      - KOMETA_CONFIG_PATH=/config
      - KOMETA_DATA_PATH=/data
    env_file:
      - path: ../../shared.env
        required: false
      - path: stack.env
        required: false
    volumes:
      - "${KOMETA_HOST_CONFIG_PATH:-${HOME}/.config/kometa}:/config"
      - "${KOMETA_HOST_DATA_PATH:-${HOME}/.config/kometa/data}:/data"
    networks:
      - media-services

networks:
  media-services:
    name: media-services
    external: true
