services:
  snipeit:
    labels:
      logging: "true"
    image: snipe/snipe-it:latest@sha256:3d8f042581751938c2ac5f831b3acf91c7a893054f525ba7d82a23a664d9c7ce
    container_name: snipe-it
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 256
    depends_on:
      snipeit-db:
        condition: service_healthy
    env_file:
      - stack.env
    volumes:
      - snipeit_storage:/var/lib/snipeit
    networks:
      - default
      - ingress-sensitive
      - mail-clients
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/login"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  snipeit-db:
    labels:
      logging: "true"
    image: mariadb:12.3
    container_name: snipe-it-db
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 384
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-snipeit}
      - MYSQL_USER=${MYSQL_USER:-snipeit}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-REPLACE_WITH_GENERATED_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-REPLACE_WITH_GENERATED_PASSWORD}
    volumes:
      - snipeit_db12:/var/lib/mysql
    networks:
      - default
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  ingress-sensitive:
    name: ingress-sensitive
    external: true
  mail-clients:
    name: mail-clients
    external: true

volumes:
  snipeit_storage: {}
  snipeit_db12: {}
