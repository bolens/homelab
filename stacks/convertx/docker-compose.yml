# ConvertX – self-hosted online file converter (1000+ formats).
# No host ports: access only via Caddy on the dedicated ingress network.
# Docs: https://github.com/C4illin/ConvertX
services:
  convertx:
    labels:
      logging: "true"
    image: ghcr.io/c4illin/convertx:latest@sha256:b515b04bfd25298a5cdc775b2fcd48b9399bab658ce13e2598b65df1b16098c8
    container_name: convertx
    restart: unless-stopped
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    volumes:
      - convertx-data:/app/data
    networks:
      - ingress-public
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  # Use only the shared ingress network; no stack default network is created.
  ingress-public:
    name: ingress-public
    external: true

volumes:
  convertx-data:
