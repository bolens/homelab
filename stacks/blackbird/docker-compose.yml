name: blackbird

# Blackbird reaches Caddy's optional HTTP forward proxy over security-research.

services:
  blackbird:
    build:
      context: .
      args:
        BLACKBIRD_COMMIT: ${BLACKBIRD_COMMIT:-b45505080ef51bb3ef52dc29879ee6bef31e5b94}
    image: ${BLACKBIRD_IMAGE:-harbor.yourdomain.com/homelab/blackbird:latest}
    container_name: blackbird
    restart: "no"
    env_file:
      - stack.env
    environment:
      - TZ=${TZ:-America/Denver}
    volumes:
      # Optional: store exported reports (PDF, CSV, JSON)
      - ./results:/results
    networks:
      - security-research
    stdin_open: true
    tty: true

networks:
  security-research:
    name: security-research
    external: true
