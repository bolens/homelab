# camofox-browser – anti-detection browser server for AI agents (Firefox/Camoufox-based).
# Repo: https://github.com/jo-inc/camofox-browser
# Image: ghcr.io/jo-inc/camofox-browser:latest (public GHCR)
# REST API on port 9377. Element refs, accessibility snapshots, session isolation.
# Portainer-friendly: named volumes, env from stack.env, external ingress-admin network for Caddy.

name: camofox-browser

services:
  camofox:
    labels:
      logging: "true"
    container_name: camofox-browser
    image: ghcr.io/jo-inc/camofox-browser:latest@sha256:cff2c1432b609bde9c9d0b91e5b924dae0799d3c7bc9d468c0bc949325beaf2a
    env_file:
      - stack.env
      - path: ../../shared.env
        required: false
    volumes:
      - cookies:/root/.camofox/cookies
      - profiles:/root/.camofox/profiles
      - traces:/root/.camofox/traces
    ports:
      - "127.0.0.1:9377:9377"
    restart: unless-stopped
    shm_size: 512mb
    networks:
      - default
      - ingress-admin

networks:
  ingress-admin:
    name: ingress-admin
    external: true

volumes:
  cookies:
  profiles:
  traces:
