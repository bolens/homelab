name: camofox-browser
default_port: 9377
databases: []
health:
  endpoint: /health
  internal_only: true
monitoring:
  prometheus: false
  uptime_kuma:
    external: false
    internal: true
  blackbox_exporter: false
  grafana_dashboard: false
shared_resources: []
type: service
category: browser
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: camofox.yourdomain.com
data_profile:
  contains_pii: false
  contains_logs_only: false
  recommended_backup: false
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://github.com/jo-inc/camofox-browser
  docs: https://github.com/jo-inc/camofox-browser
  repo: https://github.com/jo-inc/camofox-browser
backup:
  priority: low
  schedule_hint: null
volumes:
- name: camofox_cookies
  role: app_data
  critical: false
- name: camofox_profiles
  role: app_data
  critical: false
- name: camofox_traces
  role: app_data
  critical: false
auth:
  mode: api_key
  sso_provider: null
  access_policy: api_only
resources:
  cpu_profile: medium
  memory_profile: medium
  storage_profile: small
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: browser
lifecycle:
  status: stable
  replacement_for: null
  notes: 'Stealth browser automation with fingerprint camouflage. shm_size 512mb required.'
