services:
  termix:
    image: ghcr.io/termix-ssh/termix:26.11.1@sha256:cac04fdc9cd38c98566e6e903ad77a3a85b62869e6b78ada35e1570cbc32c6cb
    container_name: termix
    restart: unless-stopped
    labels:
      logging: 'true'
    env_file:
    - stack.env
    volumes:
    - termix_data:/app/data
    networks:
    - ingress-admin
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:30001/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
networks:
  ingress-admin:
    name: ingress-admin
    external: true
volumes:
  termix_data: {}
