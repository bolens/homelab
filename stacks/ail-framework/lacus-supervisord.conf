[supervisord]
nodaemon=true

[program:website]
command=/usr/bin/poetry run start_website
directory=/app/lacus
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:capture_manager]
command=/usr/bin/poetry run capture_manager
directory=/app/lacus
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
