# AIL framework – Analysis Information Leak framework (paste/leak analysis, trackers, MISP/TheHive).
# No host ports: access via Caddy (reverse proxy to ail:7000). UI uses HTTPS with self-signed cert; Caddy uses tls_insecure_skip_verify.
# Docs: https://github.com/ail-project/ail-framework | https://www.ail-project.org/
#
# Default image is the smaller CPU-only AIL 7.0 release (see README).
# Lacus and Tor run as isolated companion services for clear-web and .onion captures.
services:
  ail:
    image: ${AIL_IMAGE:-ail-framework:7.0}
    container_name: ail-framework
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=false
    # Wipe stale GNU screen sockets on start (otherwise Flask/feeder stay "Dead" after unclean stop).
    working_dir: /opt/AIL
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        sed -i 's/^activate_crawler = False$/activate_crawler = True/'
        /opt/AIL/configs/core.cfg;
        screen -wipe 2>/dev/null || true;
        exec /bin/bash docker_start.sh
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    volumes:
      - ail-pastes:/opt/AIL/PASTES
      - ail-screenshots:/opt/AIL/CRAWLED_SCREENSHOT
      - ail-kvrocks:/opt/AIL/DATA_KVROCKS
      - ail-indexdir:/opt/AIL/indexdir
      - ail-hashs:/opt/AIL/HASHS
      - ail-logs:/opt/AIL/logs
    # Default container /run is on the writable layer; screen sockets persisted as "Dead" and blocked LAUNCH.
    tmpfs:
      - /run/screen
    networks:
      - security-research
      - ingress-admin
    # 7100 = Lacus crawler UI, 9050 = Tor SOCKS for trusted security-research peers.
    expose:
      - "7000"
      - "7100"
      - "9050"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1:7000/"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 6g
    cpus: 2.0

  lacus:
    labels:
      logging: "true"
    build:
      context: .
      dockerfile: Dockerfile.lacus
      args:
        LACUS_REVISION: ${LACUS_REVISION:-e3be12569431234dfc08cffd4a5000cd86011545}
        VALSTORE_REVISION: ${VALSTORE_REVISION:-23b3f6bb66c19502225a40e7aeec9e1be76456c1}
    image: ${LACUS_IMAGE:-ghcr.io/bolens/homelab-ail-lacus:latest}
    container_name: ail-lacus
    restart: unless-stopped
    depends_on:
      tor:
        condition: service_healthy
    volumes:
      - lacus-cache:/app/lacus/cache
      - lacus-captures:/app/lacus/captures
      - ./lacus-generic.json:/app/lacus/config/generic.json:ro
      - lacus-logs:/app/lacus/logs
    networks:
      - security-research
    expose:
      - "7100"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7100/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 5g
    cpus: 3.0

  tor:
    labels:
      logging: "true"
    build:
      context: .
      dockerfile: Dockerfile.tor
    image: ${AIL_TOR_IMAGE:-ghcr.io/bolens/homelab-ail-tor:latest}
    container_name: ail-tor
    restart: unless-stopped
    volumes:
      - tor-data:/var/lib/tor
    networks:
      - security-research
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9050"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    cpus: 1.0

networks:
  security-research:
    name: security-research
    external: true
  ingress-admin:
    name: ingress-admin
    external: true

volumes:
  ail-pastes:
  ail-screenshots:
  ail-kvrocks:
  ail-indexdir:
  ail-hashs:
  ail-logs:
  lacus-cache:
  lacus-captures:
  lacus-logs:
  tor-data:
