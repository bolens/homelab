name: netbox
default_port: 8080
databases: []
health:
  endpoint: /
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: networking
exposure:
  behind_caddy: false
  public_by_default: false
  recommended_hostname: null
data_profile:
  contains_pii: false
  contains_logs_only: false
  recommended_backup: false
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://netbox.dev/
  docs: https://docs.netbox.dev/
  repo: null
backup:
  priority: low
  schedule_hint: manual
volumes: []
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: small
  memory_profile: small
  storage_profile: small
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: external
  replacement_for: null
  notes: Deployment is maintained by the upstream netbox-docker project.
