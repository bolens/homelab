# OWASP Threat Dragon – threat modeling (diagrams, STRIDE, save to GitHub/Bitbucket/GitLab).
# No host ports: access via Caddy (reverse_proxy threatdragon:3000 on ingress-admin network).
# Requires .env with SESSION_SIGNING_KEY; add GITHUB_* (or Bitbucket/GitLab) for repo storage.
# Docs: https://www.threatdragon.com/  |  https://owasp.org/www-project-threat-dragon/
#
# Start:  docker compose up -d
# First run: configure OAuth (e.g. GitHub) in .env so you can save models to repos.

name: threat-dragon

services:
  threatdragon:
    image: owasp/threat-dragon:stable
    container_name: threatdragon
    restart: unless-stopped
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    environment:
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ./stack.env:/app/.env:ro
    networks:
      - ingress-admin
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  ingress-admin:
    name: ingress-admin
    external: true
