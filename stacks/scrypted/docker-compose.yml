services:
  scrypted:
    labels:
      logging: "true"
    image: ghcr.io/koush/scrypted:latest@sha256:e78b4fcecdd6c61acaaf22b50ccef303c738da58cc0be57afdb116521df52296
    container_name: scrypted
    restart: unless-stopped
    network_mode: host
    cpus: 6.0
    mem_limit: 8g
    memswap_limit: 10g
    pids_limit: 2048
    cpu_shares: 512
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    environment:
      SCRYPTED_DOCKER_AVAHI: "true"
    volumes:
      - scrypted_data:/server/volume
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "process.env.NODE_TLS_REJECT_UNAUTHORIZED='0';require('https').get('https://127.0.0.1:10443/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  scrypted_data:
