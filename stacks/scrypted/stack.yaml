name: scrypted
default_port: 10443
databases: []
health:
  endpoint: /
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: homeautomation
exposure:
  behind_caddy: false
  public_by_default: false
  recommended_hostname: null
data_profile:
  contains_pii: true
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: true
links:
  homepage: https://www.scrypted.app
  docs: https://docs.scrypted.app/install/linux-docker.html
  repo: https://github.com/koush/scrypted
backup:
  priority: high
  schedule_hint: daily
volumes:
- name: scrypted_data
  role: app_data
  critical: true
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: large
  memory_profile: large
  storage_profile: large
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
runtime_security:
  privileged_services: []
  host_network_services:
  - scrypted
  docker_socket_services: []
  floating_image_services: []
