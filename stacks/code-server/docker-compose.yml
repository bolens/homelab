# LinuxServer code-server — config and extensions live in the named volume `/config` (no host bind mount required).
# All runtime settings come from `stack.env` (and optional `../../shared.env`). Run `./prepare-stack.sh` then `docker compose up -d`.
services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest@sha256:621d47575a19645f4267f68a77167ca0b4562d042717dbe0dbba318c9753bad7
    container_name: code-server
    restart: unless-stopped
    cpus: 4.0
    mem_limit: 6g
    memswap_limit: 8g
    pids_limit: 1024
    cpu_shares: 512
    env_file:
      - path: ../../shared.env
        required: false
      - path: stack.env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fso /dev/null http://localhost:8443/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - code_server_config:/config
    # No host port: access via Caddy only
    networks:
      - ingress-admin
    labels:
      - logging=true
      - logging_sampling=true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  ingress-admin:
    name: ingress-admin
    external: true

volumes:
  code_server_config: {}
