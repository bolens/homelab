# Portainer-friendly: scoped Docker API + optional host config dir for simple auth.
# Config dir (users.yaml): default ~/.config/dozzle — override with DOZZLE_CONFIG_DIR in stack.env (see stack.env.example).
# Simple auth: set DOZZLE_AUTH_PROVIDER=simple in stack.env and add a valid users.yaml (see README). Do not set simple without users.yaml.
# Note: stack.env is NOT passed as env_file into the container — only shared.env is. See comment below for why.
services:
  dozzle-docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    container_name: dozzle-docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1536m
    pids_limit: 512
    cpu_shares: 256
    stop_grace_period: 30s   # Dozzle needs time to close log streams; default 10s can cause "failed to shut down"
    # No host port: access via Caddy only
    volumes:
      - ${DOZZLE_CONFIG_DIR:-${HOME}/.config/dozzle}:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ingress-admin
      - docker-api
    env_file:
      - path: ../../shared.env
        required: false
    # stack.env is copied to .env by ./prepare-stack.sh for ${DOZZLE_*} / port interpolation only — do not env_file
    # stack.env into the container or Dozzle logs "Unexpected environment variable" for compose-only keys.
    environment:
      - TZ=${TZ:-America/Denver}
      - LANG=${LANG:-en_US.UTF-8}
      - LC_ALL=${LC_ALL:-en_US.UTF-8}
      - LC_CTYPE=${LC_CTYPE:-en_US.UTF-8}
      - DOZZLE_AUTH_PROVIDER=${DOZZLE_AUTH_PROVIDER:-}
      # The label after "|" names this Docker engine in Dozzle's host selector.
      - DOZZLE_REMOTE_HOST=tcp://dozzle-docker-socket-proxy:2375|${DOZZLE_LOCAL_HOST_LABEL:-docker-host}
      # Optional comma-separated Dozzle agents: endpoint|name|group.
      - DOZZLE_REMOTE_AGENT=${DOZZLE_REMOTE_AGENT:-}
    depends_on:
      dozzle-docker-socket-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 20s

networks:
  docker-api:
    internal: true
  ingress-admin:
    name: ingress-admin
    external: true
