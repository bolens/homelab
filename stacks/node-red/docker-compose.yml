services:
  nodered:
    image: nodered/node-red:latest@sha256:2ccd38b4066648bd5e17430c50a2f8102c566a82fd4f2fc5c342e61664d6896f
    container_name: node-red
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    # No host port: access via Caddy only (reverse_proxy nodered:1880)
    volumes:
      - nodered_data:/data
    networks:
      - ingress-admin
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    healthcheck:
      test: ["CMD-SHELL", "node /healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    mem_limit: 1g
    cpus: 1.0

networks:
  ingress-admin:
    name: ingress-admin
    external: true

volumes:
  nodered_data: {}
