services:
  nodered:
    image: nodered/node-red:latest@sha256:b5adb6c9dd29ab80c852d82bc87daed84e729dcff9b00ca1bf958e6de470f2c1
    container_name: node-red
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    # No host port: access via Caddy only (reverse_proxy nodered:1880)
    volumes:
      - nodered_data:/data
    networks:
      - ingress-admin
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    healthcheck:
      test: ["CMD-SHELL", "node /healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    mem_limit: 1g
    cpus: 1.0

networks:
  ingress-admin:
    name: ingress-admin
    external: true

volumes:
  nodered_data: {}
