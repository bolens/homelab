# Whisper ASR — OpenAI-style HTTP transcription (Whisper / faster-whisper / WhisperX).
# Docs: https://github.com/ahmetoner/whisper-asr-webservice
# No host ports; Caddy uses `ingress-admin`, while AI clients use `ai-backend`.
# Compose reads `.env` (copy of stack.env from `./prepare-stack.sh`) for `${VAR}` substitution.
services:
  whisper-asr:
    image: onerahmet/openai-whisper-asr-webservice:latest@sha256:0616c3d5fc6924e9d59aa8a7a3a944fbe8f3a5d701e5fc1fa2ce5b933dfecb73
    container_name: whisper-asr
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=true
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    volumes:
      - whisper_asr_cache:/root/.cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-backend
      - ingress-admin
    mem_limit: 4g
    cpus: "2.00"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/', timeout=10).status==200 else 1)",
        ]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ai-backend:
    name: ai-backend
    external: true
  ingress-admin:
    name: ingress-admin
    external: true

volumes:
  whisper_asr_cache: {}
