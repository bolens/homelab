# Use nickfedor/watchtower (maintained fork). containrrr/watchtower is archived
# and fails on Docker 29+ with "client version 1.25 is too old" (API 1.44+).
services:
  watchtower:
    labels:
      logging: "true"
    image: nickfedor/watchtower:latest@sha256:bee77696862e09521c49e5ab4904a4179accece6d561a2ef334c7589b84a2438
    container_name: watchtower
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1536m
    pids_limit: 256
    cpu_shares: 256
    env_file:
      - path: stack.env
        required: false
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=America/Denver
      - LANG=en_US.UTF-8
      - LC_ALL=en_US.UTF-8
      - LC_CTYPE=en_US.UTF-8
      # Check for updates every 24 hours
      - WATCHTOWER_POLL_INTERVAL=86400
      # Remove old images after updating (saves disk space)
      - WATCHTOWER_CLEANUP=true
      # Only update containers that have label com.centurylinklabs.watchtower.enable=true
      # Set to "true" to enable; "false" = update all containers
      - WATCHTOWER_LABEL_ENABLE=false
      # HTTP API (manual /v1/update) for Caddy on :80; token in stack.env (WATCHTOWER_HTTP_API_TOKEN)
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_METRICS=true
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=true
      - WATCHTOWER_HTTP_API_PORT=80
      # ntfy push notifications over telemetry.
      # Set WATCHTOWER_NOTIFICATION_URL and WATCHTOWER_NOTIFICATION_REPORT in stack.env.
      # Injected via env_file — not listed here to avoid shell-interpolation overriding with empty values.
    networks:
      - telemetry
    # Optional: use cron instead of interval (e.g. daily at 03:00)
    # command: --schedule "0 0 3 * * *" --cleanup

networks:
  telemetry:
    name: telemetry
    external: true

volumes: {}
