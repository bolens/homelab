name: handbrake
default_port: 5800
databases: []
health:
  endpoint: /
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: media
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: handbrake.yourdomain.com
data_profile:
  contains_pii: false
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://handbrake.fr
  docs: https://github.com/jlesage/docker-handbrake
  repo: https://github.com/jlesage/docker-handbrake
backup:
  priority: low
  schedule_hint: weekly
volumes:
- name: config
  role: config
  critical: true
- name: storage
  role: media
  critical: false
- name: watch
  role: media
  critical: false
- name: output
  role: media
  critical: false
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: large
  memory_profile: large
  storage_profile: large
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
runtime_security:
  privileged_services: []
  host_network_services: []
  docker_socket_services: []
  floating_image_services: []
