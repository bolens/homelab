services:
  handbrake:
    image: jlesage/handbrake:latest
    container_name: handbrake
    restart: unless-stopped
    cpus: 6.0
    mem_limit: 8g
    memswap_limit: 10g
    pids_limit: 1024
    cpu_shares: 512
    env_file:
      - path: ../../shared.env
        required: false
      - stack.env
    volumes:
      - ${HANDBRAKE_CONFIG_PATH:-${HOME}/.config/handbrake}:/config
      - ${HANDBRAKE_STORAGE_PATH:-/mnt/unraid/media}:/storage:ro
      - ${HANDBRAKE_WATCH_PATH:-/mnt/unraid/media/downloads/handbrake/watch}:/watch
      - ${HANDBRAKE_OUTPUT_PATH:-/mnt/unraid/media/downloads/handbrake/output}:/output
    networks:
      - monitor
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5800/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  monitor:
    name: monitor
    external: true
