name: kasm
default_port: 443
databases: []
health:
  endpoint: /
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: networking
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: kasm.yourdomain.com
data_profile:
  contains_pii: false
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: true
  needs_privileged: true
  uses_host_network: false
links:
  homepage: null
  docs: https://docs.kasmweb.com/
  repo: https://github.com/linuxserver/docker-kasm
backup:
  priority: medium
  schedule_hint: weekly
volumes:
- name: kasm_data
  role: app_data
  critical: true
- name: kasm_profiles
  role: app_data
  critical: true
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: small
  memory_profile: small
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
