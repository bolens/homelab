# Umami – privacy-focused web analytics (dashboard + tracker API).
# No host ports; access via Caddy (https://umami.example.com → umami:3000).
# Postgres is internal-only; only the app joins `ingress-public` for Caddy.
services:
  db:
    image: postgres:18-alpine
    container_name: umami-db
    restart: unless-stopped
    env_file:
      - path: ../../shared.env
        required: false
      - path: stack.env
        required: false
    volumes:
      - umami_pg_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 10s
      retries: 10

  umami:
    image: ghcr.io/umami-software/umami:latest@sha256:8edfe4beaef13f9d1300619fa264ef250a3688df9cc54d24ca830ca31cb475ec
    container_name: umami
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ../../shared.env
        required: false
      - path: stack.env
        required: false
    networks:
      - default
      - ingress-public
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/heartbeat >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

networks:
  ingress-public:
    name: ingress-public
    external: true

volumes:
  umami_pg_data:
