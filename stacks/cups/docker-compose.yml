# CUPS – network print server (web admin, IPP). No host ports: use Caddy → cups:631.
# For USB printers on the Docker host, uncomment the devices block below.
services:
  cups:
    image: docker.io/anujdatar/cups:latest@sha256:c907a6a8cae0fc82578d25fcd302c8002fc98e0d0b1f481490d3f947c175f206
    container_name: cups
    restart: unless-stopped
    labels:
      - logging=true
      - logging_sampling=true
    env_file:
      - path: ../../shared.env
        required: false
      - path: stack.env
        required: false
    volumes:
      - cups_config:/etc/cups
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb
    networks:
      - ingress-admin
    mem_limit: 512m
    cpus: "0.50"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/631' && exec 3<&- && exec 3>&-",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ingress-admin:
    name: ingress-admin
    external: true

volumes:
  cups_config: {}
