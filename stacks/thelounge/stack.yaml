name: thelounge
default_port: 9000
databases: []
health:
  endpoint: /
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: productivity
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: thelounge.yourdomain.com
data_profile:
  contains_pii: true
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: https://thelounge.chat
  docs: https://thelounge.chat/docs
  repo: https://github.com/thelounge/thelounge
backup:
  priority: medium
  schedule_hint: daily
volumes:
  - name: thelounge_data
    role: app_data
    critical: true
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: small
  memory_profile: small
  storage_profile: small
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: null
  notes: ''
