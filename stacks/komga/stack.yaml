name: komga
default_port: 25600
databases: []
health:
  endpoint: /
  internal_only: false
monitoring:
  prometheus: false
  uptime_kuma:
    external: true
    internal: true
  blackbox_exporter: true
  grafana_dashboard: false
shared_resources: []
type: web_app
category: dashboard
exposure:
  behind_caddy: true
  public_by_default: false
  recommended_hostname: komga.yourdomain.com
data_profile:
  contains_pii: false
  contains_logs_only: false
  recommended_backup: true
host_requirements:
  needs_gpu: false
  needs_privileged: false
  uses_host_network: false
links:
  homepage: null
  docs: https://komga.org/docs
  repo: https://github.com/gotson/komga
backup:
  priority: medium
  schedule_hint: weekly
volumes:
- name: komga_config
  role: app_data
  critical: true
- name: normalizer_state
  role: app_data
  critical: true
auth:
  mode: app_local
  sso_provider: null
  access_policy: access_full_site
resources:
  cpu_profile: small
  memory_profile: small
  storage_profile: medium
  gpu_profile: none
placement:
  preferred_node: null
  colocation_group: null
lifecycle:
  status: stable
  replacement_for: null
  notes: 'Publication-aware coordinated worker cycles require initialized native correction authority and explicit publication_roots mappings through existing mounts. Native HTTP is refused under writer exclusion; complete mutation and remote handoff acceptance precede activation. Optional release naming uses dotted fields and a final scanner-group hyphen, exact native catalog ownership, restore-verified per-file copies and reader hash/progress proofs. It defaults to disabled and requires matching Mylar/worker images with existing writer coordination. Optional normalizer override uses the published comic-normalizer GHCR image without source bind mounts, enables writable libraries and preserves original archives in the NORMALIZER_STATE_PATH bind mount. Optional maintenance override adds completed-download cleanup and corrupt-archive quarantine in that state directory, publishes conversion status to the Mylar post-processing monitor, and supports opt-in verified pack inventories and related supplements, plus source-preserving recovery of uniquely matched imports plus explicit guided matching and confirmed exact series aliases through Mylar Activity. Guided receipts remain in the existing private state directory; update Mylar before the worker. An optional coordination override grants the worker a narrow writable Mylar media-writer state mount for exclusive writer admission and durable asynchronous-upgrade fencing. Opt-in completed-addition reader scans batch catalog-confirmed tagged CBZ arrivals using the same coordination and API credentials, without changing scheduled scans. Opt-in PDF rendering creates bounded CBZ reading derivatives, retains original PDFs and verification receipts in normalizer state, and uses existing import recovery and media mounts.'
# Converted tagging uses existing app state and primary-key API; see stack README for opt-in and rollout.
runtime_security:
  privileged_services: []
  host_network_services: []
  docker_socket_services: []
  floating_image_services: []
# Optional KOMGA_IMAGE override replaces next-UI assets only; same persistence and exposure.
