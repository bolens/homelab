# Opt-in dedicated Librarr libraries; preserve existing library roots.
services:
  komga:
    volumes:
      - type: bind
        source: ${LIBRARR_MEDIA_PATH:?Set LIBRARR_MEDIA_PATH to the same root as the Librarr stack}/librarr/manga
        target: /data/librarr-manga
        read_only: true
        bind:
          create_host_path: false
