# Komga – comics and manga server. Web UI and OPDS (e.g. Tachiyomi).
# Access via Caddy only (no host port).
# Publication-aware worker coordination uses existing overrides/mounts; see README.

services:
  komga:
    labels:
      logging: "true"
    image: ${KOMGA_IMAGE:-gotson/komga:1.28.1@sha256:d8f772dce7b3dcd8baa0ce7481bd890e68446065ab6c8eb2cb5b24df62fb3c4f}
    container_name: komga
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      - TZ=${TZ:-America/Denver}
      - SERVER_PORT=25600
    volumes:
      - komga_config:/config
      - "${KOMGA_COMICS_PATH:-/mnt/unraid/media/comics}:/data/comics:ro"
      - "${KOMGA_MANGA_PATH:-/mnt/unraid/media/manga}:/data/manga:ro"
    networks:
      - ingress-public
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:25600/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  ingress-public:
    name: ingress-public
    external: true

volumes:
  komga_config:
