# Komga – comics and manga server. Web UI and OPDS (e.g. Tachiyomi).
# Access via Caddy only (no host port).

services:
  komga:
    labels:
      logging: "true"
    image: gotson/komga:latest@sha256:c4f9885fc077e2e9cd684dc95e8f6cfa5e33b100b46712b2de7f5cc2ff59e6fb
    container_name: komga
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      - TZ=${TZ:-America/Denver}
      - SERVER_PORT=25600
    volumes:
      - komga_config:/config
      - komga_data:/data
    networks:
      - ingress-public
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:25600/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  ingress-public:
    name: ingress-public
    external: true

volumes:
  komga_config:
  komga_data:
