# Required for opt-in reader_scan batching and mylar.tag_converted notifications; deploy the Mylar consumer first.
# Opt-in shared writer protocol. Apply after docker-compose.normalizer.yml.
# The directory is created by matching Mylar startup; never create it over a missing mount.
# Matching publication-aware workers require initialized native authority and explicit
# publication_roots mappings in normalizer.json. Keep prototype workers held until
# full mutation/handoff acceptance; configuration and library mounts remain unchanged.
services:
  comic-normalizer:
    volumes:
      - type: bind
        source: ${MYLAR_WRITER_STATE_PATH:?Set MYLAR_WRITER_STATE_PATH to Mylar's existing media-writer directory}
        target: /mylar-writer
        bind:
          create_host_path: false
