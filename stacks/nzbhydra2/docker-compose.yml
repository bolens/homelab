services:
  nzbhydra2:
    labels:
      logging: "true"
    image: lscr.io/linuxserver/nzbhydra2:latest@sha256:52bbcf7fafb7dc4316936cd4694388b26ed7ddd4e3363bc961f7527e48c3594e
    container_name: nzbhydra2
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 256
    env_file:
      - stack.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Denver}
    volumes:
      - nzbhydra2_config:/config
    networks:
      - media-automation
      - ingress-admin
      - usenet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5076/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  media-automation:
    name: media-automation
    external: true
  ingress-admin:
    name: ingress-admin
    external: true
  usenet:
    name: usenet
    external: true

volumes:
  nzbhydra2_config:
