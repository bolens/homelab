name: phoneinfoga

services:
  phoneinfoga:
    image: sundowndev/phoneinfoga:v2.11.0
    container_name: phoneinfoga
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 256
    command: ["serve", "-p", "5000"]
    env_file:
      - stack.env
    environment:
      - TZ=${TZ:-America/Denver}
    networks:
      - security-research
      - ingress-admin

networks:
  security-research:
    name: security-research
    external: true
  ingress-admin:
    name: ingress-admin
    external: true
