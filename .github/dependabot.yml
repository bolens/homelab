version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:17"
      timezone: "America/Denver"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/stacks/ail-framework"
      - "/stacks/atomic-red-team"
      - "/stacks/auth-fuzz"
      - "/stacks/blackbird"
      - "/stacks/caddy"
      - "/stacks/clark-browser/build"
      - "/stacks/docker-forensics-toolkit"
      - "/stacks/docker-gc"
      - "/stacks/flood"
      - "/stacks/ghunt"
      - "/stacks/hashcat"
      - "/stacks/komga/normalizer"
      - "/stacks/komga/ui"
      - "/stacks/lidarr"
      - "/stacks/metagoofil"
      - "/stacks/mylar3"
      - "/stacks/n8n/restart-gateway"
      - "/stacks/netexec"
      - "/stacks/nodepad"
      - "/stacks/onionscan"
      - "/stacks/rackula"
      - "/stacks/readarr"
      - "/stacks/responder-mitm6"
      - "/stacks/searx-ng"
      - "/stacks/torbot"
      - "/stacks/unbound"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "05:31"
      timezone: "America/Denver"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Keep this inventory aligned with maintained Dockerfile directories.
    # Ubuntu release changes require reviewed package and ABI migration.
    # Continue receiving immutable digest refreshes on the selected release.
    ignore:
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Explicitly reject the unsupported interim release proposed despite the
      # SemVer filter. Other stacks retain their selected 26.04 digest updates.
      - dependency-name: "ubuntu"
        versions: ["25.10"]
    groups:
      docker-images:
        patterns:
          - "*"

  # These applications require Python 3.13 until their dependency locks migrate.
  # Separate directories keep other Python images eligible for newer runtimes.
  - package-ecosystem: "docker"
    directories:
      - "/stacks/acquire"
      - "/stacks/privotron"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "05:31"
      timezone: "America/Denver"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      - dependency-name: "python"
        versions: [">= 3.14"]
    groups:
      docker-images:
        patterns:
          - "*"

  - package-ecosystem: "docker-compose"
    # Internal gateway/shield releases are not intended for self-hosted Stoat.
    # Continue monitoring later releases; review their self-hosting guidance.
    ignore:
      - dependency-name: "ghcr.io/stoatchat/*"
        versions: ["v0.15.6", "v0.15.7"]
    directories:
      - "/stacks/*"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "05:47"
      timezone: "America/Denver"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      compose-images:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "05:13"
      timezone: "America/Denver"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      root-javascript:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directories:
      - "/.github"
      - "/stacks/acquire"
      - "/stacks/blackbird"
      - "/stacks/clark-browser/build"
      - "/stacks/docker-forensics-toolkit"
      - "/stacks/ghunt"
      - "/stacks/metagoofil"
      - "/stacks/mylar3"
      - "/stacks/privotron"
      - "/stacks/torbot"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "05:29"
      timezone: "America/Denver"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      python:
        patterns:
          - "*"
        group-by: "dependency-name"

  - package-ecosystem: docker
    cooldown:
      default-days: 7
    directory: /.devcontainer
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
