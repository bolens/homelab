name: Publish Custom Images

on:
  pull_request:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/custom-images.yml"
      - ".github/custom-images.json"
      - "scripts/ci-custom-images.py"
      - "scripts/tests/test_ci_custom_images.py"
      - "stacks/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: custom-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select custom images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check selection and generate filters
        run: |
          python3 -m unittest discover -s scripts/tests -p test_ci_custom_images.py
          python3 scripts/ci-custom-images.py filters > "$RUNNER_TEMP/custom-image-filters.json"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: paths
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: ${{ runner.temp }}/custom-image-filters.json
      - name: Select affected build contexts
        id: matrix
        env:
          CHANGED_IMAGES: ${{ steps.paths.outputs.changes }}
          FULL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/ci-custom-images.py matrix >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    name: Build ${{ matrix.image }}
    permissions:
      contents: read
      packages: write # Publish images from trusted main and manual runs.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare pinned Nodepad source
        if: matrix.image == 'nodepad'
        run: bash stacks/nodepad/clone-repo.sh

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/homelab-${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/homelab-${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

  result:
    name: Custom images
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every selected build
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys
          jobs = json.loads(os.environ["NEEDS_JSON"])
          selected = jobs["changes"].get("outputs", {}).get("any")
          expected = "success" if selected == "true" else "skipped"
          valid = jobs["changes"]["result"] == "success" and selected in ("true", "false")
          valid &= jobs["build"]["result"] == expected
          sys.exit(0 if valid else 1)
          PYTHON
