name: Weekly Maintenance

on:
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-maintenance
  cancel-in-progress: true

jobs:
  repository:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck yamllint
          sudo npm install --global markdownlint-cli2@0.22.0
          python -m pip install --disable-pip-version-check \
            --require-hashes -r .github/requirements-validation.txt

      - name: Validate repository
        run: make validate-strict

      - name: Scan committed content
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  links:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --accept 200,204,206,403,429
            --exclude '^https?://[^/]+\.yourdomain\.com'
            --exclude '^https?://[^/]+\.home'
            --exclude '^https?://(localhost|127\.0\.0\.1|host|[a-z0-9-]+)(:[0-9]+)?/'
            './**/*.md'
          # External documentation can rate-limit or disappear temporarily.
          # Keep the detailed summary actionable without breaking all CI.
          fail: false
          jobSummary: true
          token: ${{ github.token }}
