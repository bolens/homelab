name: Weekly Maintenance

on:
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-maintenance
  cancel-in-progress: true

jobs:
  repository:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up validation tools
        uses: ./.github/actions/setup-validation

      - name: Validate repository
        run: make validate-strict

      - name: Scan committed content
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  links:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check internal documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --offline
            --include-fragments
            './**/*.md'
          fail: true
          failIfEmpty: true
          jobSummary: true
          output: internal-links.md

      - name: Check external documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --accept 200,204,206,403,429
            --exclude '^https?://[^/]+\.yourdomain\.com'
            --exclude '^https?://[^/]+\.home'
            --exclude '^https?://(localhost|127\.0\.0\.1|host|[a-z0-9-]+)(:[0-9]+)?/'
            './**/*.md'
          # External documentation can rate-limit or disappear temporarily.
          # Keep the detailed summary actionable without breaking all CI.
          fail: false
          jobSummary: true
          output: external-links.md
          token: ${{ github.token }}
