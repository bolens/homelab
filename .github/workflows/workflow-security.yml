name: Workflow Security

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: workflow-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Lint and audit workflows
    permissions:
      contents: read
      security-events: write
    uses: bolens/.github/.github/workflows/reusable-actionlint.yml@d30ff6a56b47317d3d565e7b4747d133966db8d2
    with:
      security-audit: true
