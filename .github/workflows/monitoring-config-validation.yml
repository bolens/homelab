name: Validate Monitoring Config

on:
  pull_request:
    paths:
      - "stacks/prometheus/**"
      - "stacks/alertmanager/**"
      - "stacks/grafana-alloy/**"
      - "documents/PROMETHEUS-SCRAPE-TARGETS.md"
      - "documents/TROUBLESHOOTING.md"
      - "scripts/validate-monitoring-config.sh"
  push:
    branches: ["main"]
    paths:
      - "stacks/prometheus/**"
      - "stacks/alertmanager/**"
      - "stacks/grafana-alloy/**"
      - "documents/PROMETHEUS-SCRAPE-TARGETS.md"
      - "documents/TROUBLESHOOTING.md"
      - "scripts/validate-monitoring-config.sh"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python deps
        run: pip install pyyaml

      - name: Validate monitoring configs
        run: bash scripts/validate-monitoring-config.sh
