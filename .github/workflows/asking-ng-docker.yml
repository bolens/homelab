name: asking-ng docker

on:
  push:
    paths:
      - "stacks/asking-ng/api/**"
      - "stacks/asking-ng/client/**"
      - "stacks/asking-ng/docker-compose.yml"
      - "stacks/asking-ng/stack.env.example"
      - ".github/workflows/asking-ng-docker.yml"
  pull_request:
    paths:
      - "stacks/asking-ng/api/**"
      - "stacks/asking-ng/client/**"
      - "stacks/asking-ng/docker-compose.yml"
      - "stacks/asking-ng/stack.env.example"
      - ".github/workflows/asking-ng-docker.yml"

concurrency:
  group: asking-ng-docker-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: stacks/asking-ng

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure external networks
        run: docker network create monitor 2>/dev/null || true

      - name: Prepare stack.env for CI
        run: |
          cp stack.env.example stack.env
          sed -i 's/REPLACE_WITH_GENERATED_PASSWORD/ci-postgres-password-for-asking-ng/' stack.env
          sed -i 's/REPLACE_WITH_LONG_RANDOM_SECRET/ci-admin-token-for-asking-ng/' stack.env

      - name: Docker Compose build
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for API
        run: sleep 15s
        shell: bash

      - name: Healthcheck
        run: >
          curl
          -m 1
          --silent
          --show-error
          --fail
          "localhost:8080/healthcheck"

      - name: Info
        run: >
          curl
          -m 1
          --silent
          --show-error
          --fail
          "localhost:8080/info"
          | jq -e '.service == "asking-ng-api" and (.version | type) == "string"'

      - name: Create poll
        run: >
          content=$(curl
          --request POST
          -m 1
          --header "Content-Type: application/json"
          --data '{"title":"test","options":["a","b","c","d"],"expiration":9999999999999,"limit_ip":true}'
          --silent
          --show-error
          --fail
          "localhost:8080/poll");

          id=$(echo $content | jq -r '.data.id');
          api_key=$(echo $content | jq -r '.data.api_key');

      - name: Get poll
        run: >
          content=$(curl
          --request POST
          -m 1
          --header "Content-Type: application/json"
          --data '{"title":"test","options":["a","b","c","d"],"expiration":9999999999999,"limit_ip":true}'
          --silent
          --show-error
          --fail
          "localhost:8080/poll");

          id=$(echo $content | jq -r '.data.id');
          api_key=$(echo $content | jq -r '.data.api_key');

          curl
          -m 1
          --silent
          --show-error
          --fail
          "localhost:8080/poll/${id}"
          | jq -e '.status == "success" and .data.archived == false'

      - name: Update poll
        run: >
          content=$(curl
          --request POST
          -m 1
          --header "Content-Type: application/json"
          --data '{"title":"test","options":["a","b","c","d"],"expiration":9999999999999,"limit_ip":true}'
          --silent
          --show-error
          --fail
          "localhost:8080/poll");

          id=$(echo $content | jq -r '.data.id');
          api_key=$(echo $content | jq -r '.data.api_key');

          curl
          --request PUT
          -m 1
          --header "Content-Type: application/json"
          --header "api_key: ${api_key}"
          --data '{"expiration":0}'
          --silent
          --show-error
          --fail
          "localhost:8080/poll/${id}"

      - name: Vote on poll
        run: >
          content=$(curl
          --request POST
          -m 1
          --header "Content-Type: application/json"
          --data '{"title":"test","options":["a","b","c","d"],"expiration":9999999999999,"limit_ip":true}'
          --silent
          --show-error
          --fail
          "localhost:8080/poll");

          id=$(echo $content | jq -r '.data.id');
          api_key=$(echo $content | jq -r '.data.api_key');

          curl
          --request PUT
          -m 1
          --header "Content-Type: application/json"
          --data '{"option":"a"}'
          --silent
          --show-error
          --fail
          "localhost:8080/poll/${id}/vote"

      - name: Duplicate vote returns 409
        run: >
          content=$(curl
          --request POST
          -m 1
          --header "Content-Type: application/json"
          --data '{"title":"dup","options":["a","b"],"expiration":9999999999999,"limit_ip":true}'
          --silent
          --show-error
          --fail
          "localhost:8080/poll");

          id=$(echo $content | jq -r '.data.id');

          curl
          --request PUT
          -m 1
          --header "Content-Type: application/json"
          --data '{"option":"a"}'
          --silent
          --show-error
          --fail
          "localhost:8080/poll/${id}/vote";

          code=$(curl
          --request PUT
          -m 1
          --header "Content-Type: application/json"
          --data '{"option":"b"}'
          --silent
          --output /tmp/vote2.json
          --write-out '%{http_code}'
          "localhost:8080/poll/${id}/vote");

          test "$code" = "409"
          && jq -e '.message | test("already voted")' /tmp/vote2.json

      - name: Delete poll
        run: >
          content=$(curl
          --request POST
          -m 1
          --header "Content-Type: application/json"
          --data '{"title":"test","options":["a","b","c","d"],"expiration":9999999999999,"limit_ip":true}'
          --silent
          --show-error
          --fail
          "localhost:8080/poll");

          id=$(echo $content | jq -r '.data.id');
          api_key=$(echo $content | jq -r '.data.api_key');

          curl
          --request DELETE
          -m 1
          --header "api_key: ${api_key}"
          --data '{"expiration":0}'
          --silent
          --show-error
          --fail
          "localhost:8080/poll/${id}"
