name: Validate Repository

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up validation tools
        uses: ./.github/actions/setup-validation

      - name: Validate repository
        if: github.event_name != 'pull_request'
        run: make validate-strict

      - name: Validate changed stacks and global invariants
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: make validate-changed BASE="$BASE_REF"

      - name: Scan committed content
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  site-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked browser-test dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Test accessibility and behavior
        run: npm run test:site:ci

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-quality-failure-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  mylar-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pinned Mylar image without live configuration
        shell: bash
        run: |
          image=$(awk '$1 == "FROM" {print $2; exit}' stacks/mylar3/Dockerfile)
          [[ "$image" == *@sha256:* ]]
          docker pull "$image"
          stacks/mylar3/verify-image.sh "$image"

  comic-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test preservation and cleanup in the pinned converter image
        shell: bash
        run: |
          image=$(awk '$1 == "FROM" {print $2; exit}' stacks/komga/normalizer/Dockerfile)
          [[ "$image" == *@sha256:* ]]
          docker pull "$image"
          docker run --rm --pull=never --network=none --read-only --user=1000:1000 \
            --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=64 --memory=768m \
            --tmpfs /tmp:rw,size=256m,mode=1777 -e PYTHONDONTWRITEBYTECODE=1 \
            -e ARCHIVING_UTILS_BIN=/opt/archiving-utils/bin/archiving-utils \
            --mount "type=bind,src=$PWD/stacks/komga/normalizer,dst=/app,readonly" \
            --entrypoint python3 "$image" -m unittest discover -s /app -p 'test_*.py'
