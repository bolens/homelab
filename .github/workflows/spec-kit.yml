# Pin both workflow references and tooling-ref to the same immutable commit.
name: Spec Kit

on:
  pull_request:
    paths:
      - .agents/skills/speckit-*/**
      - .specify/**
      - .github/workflows/spec-kit.yml
      - AGENTS.md
  push:
    branches: [main]
    paths:
      - .agents/skills/speckit-*/**
      - .specify/**
      - .github/workflows/spec-kit.yml
      - AGENTS.md
  schedule:
    - cron: "45 5 * * 2"
  workflow_dispatch:
    inputs:
      update:
        description: Check for and propose a Spec Kit update
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  validate:
    permissions:
      contents: read
    if: github.event_name != 'schedule' && !inputs.update
    uses: bolens/.github/.github/workflows/reusable-spec-kit.yml@7159a187479e511a9420f8f4eec93246a43fea12
    with:
      tooling-ref: 7159a187479e511a9420f8f4eec93246a43fea12

  update:
    if: github.event_name == 'schedule' || inputs.update
    permissions:
      contents: write
      pull-requests: write
    uses: bolens/.github/.github/workflows/reusable-spec-kit-update.yml@7159a187479e511a9420f8f4eec93246a43fea12
    with:
      tooling-ref: 7159a187479e511a9420f8f4eec93246a43fea12
