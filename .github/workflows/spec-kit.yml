# Pin both workflow references and tooling-ref to the same immutable commit.
name: Spec Kit

on:
  pull_request:
    paths:
      - .agents/skills/speckit-*/**
      - .specify/**
      - .github/workflows/spec-kit.yml
      - AGENTS.md
  push:
    branches: [main]
    paths:
      - .agents/skills/speckit-*/**
      - .specify/**
      - .github/workflows/spec-kit.yml
      - AGENTS.md
  schedule:
    - cron: "45 5 * * 2"
  workflow_dispatch:
    inputs:
      update:
        description: Check for and propose a Spec Kit update
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  validate:
    # Only validation is disposable; the update job writes a pull request.
    concurrency:
      group: ${{ github.workflow }}-validate-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    if: vars.WOODPECKER_LINUX_CI != 'true' && (github.event_name != 'schedule' && !inputs.update)
    uses: bolens/.github/.github/workflows/reusable-spec-kit.yml@c161a6757130ea687def9eb1e81c6a4190488f07
    with:
      tooling-ref: c161a6757130ea687def9eb1e81c6a4190488f07

  update:
    if: github.event_name == 'schedule' || inputs.update
    permissions:
      contents: write
      pull-requests: write
    uses: bolens/.github/.github/workflows/reusable-spec-kit-update.yml@c161a6757130ea687def9eb1e81c6a4190488f07
    with:
      tooling-ref: c161a6757130ea687def9eb1e81c6a4190488f07
