name: Source lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: vars.WOODPECKER_LINUX_CI != 'true'
    uses: bolens/.github/.github/workflows/reusable-source-lint.yml@8469a503a054c6a167567e0f88b63bf853c811f7
    with:
      tooling-ref: 8469a503a054c6a167567e0f88b63bf853c811f7
