name: Source lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: vars.WOODPECKER_LINUX_CI != 'true'
    uses: bolens/.github/.github/workflows/reusable-source-lint.yml@f64dc0480a91b43bbc5ebd8dbaadf29bc6cd6ced
    with:
      tooling-ref: f64dc0480a91b43bbc5ebd8dbaadf29bc6cd6ced
