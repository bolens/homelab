# Credential-free portable validation on either forge; hosted retirement is opt-in.
# Keep actual Docker image lifecycle/publishing and GitHub security/Pages exceptions.
when:
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: [pull_request, manual, cron]

labels:
  platform: linux/amd64
  backend: docker

clone:
  git:
    image: woodpeckerci/plugin-git:2.11.0@sha256:9802cb7852dcf31f9c5c1d1ddeadfb9002d4fae85751f7b6a792eedb267bcc59
    settings:
      depth: 0
      partial: false

steps:
  - name: gitleaks
    image: docker.io/zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    commands:
      - test "$(git rev-parse --is-shallow-repository)" = false
      - gitleaks detect --source . --redact --verbose

  - name: repository-validation
    image: node:26-trixie@sha256:6d2c7d5d074bf72f81ddc252b4fbb5d625bc028eeda49cb4b8c2ff8eda1ee617
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git make python3 python3-venv python3-pip shellcheck yamllint ca-certificates
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - bash scripts/ci/check-native.sh repository

  - name: source-and-workflow-policy
    image: node:26-trixie@sha256:6d2c7d5d074bf72f81ddc252b4fbb5d625bc028eeda49cb4b8c2ff8eda1ee617
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git make python3 python3-venv python3-pip shellcheck ca-certificates
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - bash scripts/ci/check-native.sh policy

  - name: komga-source-controls
    image: eclipse-temurin:21-jdk-noble@sha256:114cabb73033ca4ce7ceec3deb62396bc1b716282bae051ed3c1d82e38fcab2d
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git make python3 python3-venv python3-pip util-linux tar ca-certificates
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - bash scripts/ci/check-native.sh komga

  - name: kavita-dotnet-controls
    image: mcr.microsoft.com/dotnet/sdk:10.0.403-noble@sha256:de4fe90a98845d75910b9769662465c84de1a934665c431279d1382b2bddc02b
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git python3 python3-venv python3-pip ca-certificates libatomic1
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - bash scripts/ci/check-native.sh dotnet

  - name: ail-pystemon-controls
    image: ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git make python3 ca-certificates binutils
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - bash scripts/ci/check-native.sh pystemon

  - name: site-quality
    image: node:26-trixie@sha256:6d2c7d5d074bf72f81ddc252b4fbb5d625bc028eeda49cb4b8c2ff8eda1ee617
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git python3 ca-certificates
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - bash scripts/ci/check-native.sh site

  - name: publisher-broker-tests
    image: docker.io/library/golang:1.27.3-bookworm@sha256:d9b6a1beb9474adc2a1ce842573639b44b2a0dd49b6669f51d3821baf9ec37c9
    commands:
      - cd stacks/woodpecker-ci/publisher-broker
      - go test -race -tags repositoryfixtures ./...
      - go vet ./...

  - name: weekly-documentation-links
    image: node:26-trixie@sha256:6d2c7d5d074bf72f81ddc252b4fbb5d625bc028eeda49cb4b8c2ff8eda1ee617
    when:
      event: [cron, manual]
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git python3 python3-venv python3-pip ca-certificates
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - bash scripts/ci/check-native.sh links
