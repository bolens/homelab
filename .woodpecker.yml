# Woodpecker CI — runs on your Gitea-connected Woodpecker instance when this repo is enabled.
# Docs: https://woodpecker-ci.org/docs/usage/workflows
#
# Requires: agent with Docker; clone must include git history for gitleaks (default detect).
when:
  - event: [push, pull_request, manual]

steps:
  - name: gitleaks
    image: docker.io/zricethezav/gitleaks:v8.30.1
    commands:
      - gitleaks detect --source . --redact --verbose

  - name: repository-validation
    image: docker.io/library/alpine:3.24.1
    commands:
      - apk add --no-cache bash docker-cli-compose git make python3 py3-pyyaml shellcheck
      - make validate
