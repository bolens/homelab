# Woodpecker CI — runs on your Gitea-connected Woodpecker instance when this repo is enabled.
# Docs: https://woodpecker-ci.org/docs/usage/workflows
#
# Requires: agent with Docker; clone must include git history for gitleaks (default detect).
when:
  - event: [push, pull_request, manual]

clone:
  git:
    image: woodpeckerci/plugin-git:2.11.0@sha256:9802cb7852dcf31f9c5c1d1ddeadfb9002d4fae85751f7b6a792eedb267bcc59
    settings:
      depth: 0
      partial: false

steps:
  - name: gitleaks
    image: docker.io/zricethezav/gitleaks:v8.30.1
    commands:
      - gitleaks detect --source . --redact --verbose

  - name: repository-validation
    image: docker.io/library/alpine:3.24.1
    commands:
      - apk add --no-cache bash docker-cli-compose git make nodejs npm yamllint python3 py3-yaml shellcheck
      - test "$(git rev-parse --is-shallow-repository)" = false
      - npm ci --ignore-scripts --no-audit --no-fund
      - make validate-strict

  - name: publisher-broker-tests
    image: docker.io/library/golang:1.27.3-bookworm@sha256:d9b6a1beb9474adc2a1ce842573639b44b2a0dd49b6669f51d3821baf9ec37c9
    commands:
      - cd stacks/woodpecker-ci/publisher-broker
      - go test -race -tags repositoryfixtures ./...
      - go vet ./...
