# When accessing Portainer through Caddy or another reverse proxy, set TRUSTED_ORIGINS
# to the URL you use in the browser (e.g. https://portainer.yourdomain.com) to avoid
# "Forbidden - Invalid origin" when deploying stacks. Optional: stack.env.example → stack.env.
# Attach to the dedicated ingress network so Caddy can reach portainer:9443
# without granting Portainer access to the broader monitoring network.
services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 384
    security_opt:
      - no-new-privileges:true
    # UI is private to the Caddy ingress network.
    expose:
      - "9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    healthcheck:
      disable: true
    env_file:
      - stack.env
    networks:
      - default
      - proxy-ingress

networks:
  proxy-ingress:
    name: proxy-ingress
    external: true

volumes:
  portainer_data:
